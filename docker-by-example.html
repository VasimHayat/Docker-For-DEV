restarts if **you** stopped it; `always` starts it again.\n3. `docker run --rm -it --entrypoint sh IMAGE`.\n4. Default logs grow forever and can fill the disk.\n5. `docker volume prune -a` (and `docker system prune --volumes`).\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker ps -a ; docker logs --tail 50 NAME ; docker inspect NAME ; docker events\ndocker run --rm -it --entrypoint sh IMAGE           # inspect a crashing image\ndocker cp NAME:/path .\\local                        # copy out\ndocker stats --no-stream                            # resource snapshot\ndocker run --restart unless-stopped -m 256m --cpus 0.5 --log-opt max-size=10m --log-opt max-file=3 IMAGE\ndocker update --restart unless-stopped -m 512m --memory-swap 512m NAME\ndocker system df ; docker image prune ; docker builder prune ; docker container prune\n```"},{"id":"phase-10","kind":"phase","num":10,"title":"Capstone: A Full-Stack App + CI Pipeline","short":"Capstone","oneLine":"Build a real project from zero that uses everything from Phases 1–9: frontend, API, database, cache, reverse proxy, dev live-reload, production images, and automatic image builds on GitHub.","meta":["Time: ~3–4 hours","Work folder: $HOME\\docker-learning\\phase10-capstone"],"time":"~3–4 hours","md":"\n## What you will build\n\n```\n                     Browser\n                        │  http://localhost:3150\n                        ▼\n              ┌──────────────────┐\n              │  proxy (nginx)   │   only service with a published port\n              └───┬──────────┬───┘\n         /        │          │   /api/*\n                  ▼          ▼\n     ┌────────────────┐   ┌────────────────┐\n     │ frontend       │   │ api            │──────────┐\n     │ nginx + static │   │ Node/Express   │          │\n     └────────────────┘   └───────┬────────┘          │\n                                  │                   │\n               network: frontnet  │  network: backnet │\n                                  ▼                   ▼\n                          ┌──────────────┐    ┌──────────────┐\n                          │ db postgres  │    │ cache redis  │\n                          │ + volume     │    │              │\n                          └──────────────┘    └──────────────┘\n```\n\n| Service | Image | Phase skills used |\n|---------|-------|-------------------|\n| `proxy` | `nginx:1.27-alpine` + config | 3 (bind mount), 4 (networking, reverse proxy) |\n| `frontend` | multi-stage → nginx | 2, 7 |\n| `api` | multi-stage → `node:22-alpine`, non-root, healthcheck | 2, 7 |\n| `db` | `postgres:17-alpine` + named volume + `init.sql` | 3, 5 |\n| `cache` | `redis:7-alpine` | 4, 5 |\n| dev mode | `compose.override.yml` + `develop.watch` | 6 |\n| ops | restart, limits, log rotation | 9 |\n| CI | GitHub Actions → GHCR | 8 |\n\n---\n\n## 1. Folder structure\n\n```\nphase10-capstone/\n├── .env.example            ← committed (fake values)\n├── .env                    ← NOT committed (real values)\n├── .gitignore\n├── compose.yml             ← production-like base\n├── compose.override.yml    ← dev: watch + debug\n├── proxy/\n│   └── nginx.conf\n├── frontend/\n│   ├── Dockerfile\n│   ├── .dockerignore\n│   └── (your HTML/JS or Angular/Vite app)\n├── api/\n│   ├── Dockerfile\n│   ├── .dockerignore\n│   ├── package.json\n│   └── src/server.js\n├── db/\n│   └── init.sql\n└── .github/workflows/docker.yml\n```\n\n---\n\n## 2. Step by step\n\n### Step 1 — Environment files\n\n`.env.example`\n```ini\nDB_PASSWORD=change-me\nPROXY_PORT=3150\n```\nCopy it: `Copy-Item .env.example .env` and set a password.\n\n`.gitignore`\n```\n.env\nnode_modules\ndist\n```\n\n### Step 2 — Database (`db/init.sql`)\n```sql\nCREATE TABLE notes (\n  id         serial PRIMARY KEY,\n  text       text NOT NULL,\n  created_at timestamptz DEFAULT now()\n);\nINSERT INTO notes (text) VALUES ('Hello from Postgres');\n```\n\n### Step 3 — API (`api/`)\n\n`api/package.json`\n```json\n{\n  \"name\": \"capstone-api\",\n  \"version\": \"1.0.0\",\n  \"scripts\": { \"start\": \"node src/server.js\", \"test\": \"node --test\" },\n  \"dependencies\": { \"express\": \"^4.21.2\", \"pg\": \"^8.13.0\", \"redis\": \"^4.7.0\" }\n}\n```\nRun `npm install` inside `api/` once to create `package-lock.json` (the Dockerfile's `npm ci` needs it). No Node.js on your PC? Let Docker do it:\n```powershell\ncd api\ndocker run --rm -v ${PWD}:/app -w /app node:22-alpine npm install --package-lock-only\ncd ..\n```\n\n`api/src/server.js`\n```js\nconst express = require(\"express\");\nconst { Pool } = require(\"pg\");\nconst { createClient } = require(\"redis\");\n\nconst db = new Pool({ connectionString: process.env.DATABASE_URL });\nconst cache = createClient({ url: process.env.REDIS_URL });\ncache.connect();\n\nconst app = express();\napp.use(express.json());\n\napp.get(\"/api/health\", async (_req, res) => {\n  try { await db.query(\"SELECT 1\"); res.json({ ok: true }); }\n  catch { res.status(500).json({ ok: false }); }\n});\n\napp.get(\"/api/notes\", async (_req, res) => {\n  const views = await cache.incr(\"views\");                 // count requests in Redis\n  const { rows } = await db.query(\"SELECT * FROM notes ORDER BY id\");\n  res.json({ views, notes: rows });\n});\n\napp.post(\"/api/notes\", async (req, res) => {\n  const { rows } = await db.query(\"INSERT INTO notes (text) VALUES ($1) RETURNING *\", [req.body.text]);\n  res.status(201).json(rows[0]);\n});\n\nconst server = app.listen(3000, \"0.0.0.0\", () => console.log(\"api on 3000\"));\nprocess.on(\"SIGTERM\", () => server.close(() => process.exit(0)));\n```\n\n`api/Dockerfile` (multi-stage, dev + prod)\n```dockerfile\n# syntax=docker/dockerfile:1\nFROM node:22-alpine AS base\nWORKDIR /app\nCOPY package*.json ./\n\nFROM base AS dev\nRUN --mount=type=cache,target=/root/.npm npm ci\nCOPY src ./src\nCMD [\"node\", \"src/server.js\"]\n\nFROM base AS prod\nENV NODE_ENV=production\nRUN --mount=type=cache,target=/root/.npm npm ci --omit=dev\nCOPY --chown=node:node src ./src\nUSER node\nEXPOSE 3000\nHEALTHCHECK --interval=15s --timeout=3s --start-period=10s --retries=3 \\\n  CMD wget -qO- http://127.0.0.1:3000/api/health || exit 1\nCMD [\"node\", \"src/server.js\"]\n```\n\n`api/.dockerignore`\n```\nnode_modules\n.git\n*.md\n```\n\n### Step 4 — Frontend (`frontend/`)\n\nSimplest version: plain HTML. (Replace with Angular/Vite later — see Phase 7 Example 2.)\n\n`frontend/public/index.html`\n```html\n\u003c!doctype html>\n\u003chtml>\n\u003cbody>\n  \u003ch1>Notes\u003c/h1>\n  \u003cform id=\"f\">\u003cinput id=\"t\" placeholder=\"New note\">\u003cbutton>Add\u003c/button>\u003c/form>\n  \u003cp id=\"v\">\u003c/p>\n  \u003cul id=\"list\">\u003c/ul>\n  \u003cscript>\n    async function load() {\n      const r = await fetch(\"/api/notes\").then(r => r.json());\n      document.getElementById(\"v\").textContent = \"API views: \" + r.views;\n      document.getElementById(\"list\").innerHTML = r.notes.map(n => `\u003cli>${n.text}\u003c/li>`).join(\"\");\n    }\n    document.getElementById(\"f\").onsubmit = async e => {\n      e.preventDefault();\n      await fetch(\"/api/notes\", { method: \"POST\", headers: { \"Content-Type\": \"application/json\" },\n        body: JSON.stringify({ text: document.getElementById(\"t\").value }) });\n      document.getElementById(\"t\").value = \"\"; load();\n    };\n    load();\n  \u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\n`frontend/Dockerfile`\n```dockerfile\nFROM nginx:1.27-alpine\nCOPY public /usr/share/nginx/html\n```\n> With a real framework this becomes a 2-stage build: `node` builds → `nginx` serves `dist/`.\n\n### Step 5 — Reverse proxy (`proxy/nginx.conf`)\n```nginx\nserver {\n  listen 80;\n\n  location /api/ {\n    proxy_pass http://api:3000;           # service name : container port\n    proxy_set_header Host $host;\n    proxy_set_header X-Real-IP $remote_addr;\n  }\n\n  location / {\n    proxy_pass http://frontend:80;\n  }\n}\n```\n\n### Step 6 — `compose.yml` (production-like)\n```yaml\nname: capstone\n\nx-logging: &default-logging          # a reusable YAML block (\"anchor\")\n  driver: json-file\n  options: { max-size: \"10m\", max-file: \"3\" }\n\nservices:\n  proxy:\n    image: nginx:1.27-alpine\n    ports:\n      - \"${PROXY_PORT:-3150}:80\"\n    volumes:\n      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro\n    networks: [frontnet]\n    depends_on: [frontend, api]\n    restart: unless-stopped\n    logging: *default-logging         # reuse the block\n\n  frontend:\n    build: ./frontend\n    image: capstone-frontend:local\n    networks: [frontnet]\n    restart: unless-stopped\n    logging: *default-logging\n\n  api:\n    build:\n      context: ./api\n      target: prod\n    image: capstone-api:local\n    environment:\n      DATABASE_URL: postgres://app:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/notes\n      REDIS_URL: redis://cache:6379\n    networks: [frontnet, backnet]     # the only service on BOTH networks\n    depends_on:\n      db:    { condition: service_healthy }\n      cache: { condition: service_started }\n    restart: unless-stopped\n    deploy:\n      resources:\n        limits: { memory: 256M, cpus: \"0.5\" }\n    logging: *default-logging\n\n  db:\n    image: postgres:17-alpine\n    environment:\n      POSTGRES_USER: app\n      POSTGRES_PASSWORD: ${DB_PASSWORD}\n      POSTGRES_DB: notes\n    volumes:\n      - pgdata:/var/lib/postgresql/data\n      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro\n    networks: [backnet]\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app -d notes\"]\n      interval: 5s\n      timeout: 3s\n      retries: 10\n    restart: unless-stopped\n    logging: *default-logging\n\n  cache:\n    image: redis:7-alpine\n    networks: [backnet]\n    restart: unless-stopped\n    logging: *default-logging\n\nnetworks:\n  frontnet:\n  backnet:\n\nvolumes:\n  pgdata:\n```\n\nNew things here:\n- `x-logging: &default-logging` + `logging: *default-logging` → define once, reuse (YAML **anchors**). Keys starting with `x-` are ignored by Compose — they're just for you.\n- `${DB_PASSWORD:?…}` → stop with a clear error if the password isn't set.\n- Two networks → `proxy` and `frontend` **cannot** reach `db`/`cache`. Only `api` can.\n\n### Step 7 — `compose.override.yml` (dev)\n```yaml\nservices:\n  api:\n    build:\n      target: dev\n    environment:\n      NODE_ENV: development\n    develop:\n      watch:\n        - action: sync+restart\n          path: ./api/src\n          target: /app/src\n        - action: rebuild\n          path: ./api/package.json\n  frontend:\n    develop:\n      watch:\n        - action: sync\n          path: ./frontend/public\n          target: /usr/share/nginx/html\n```\n\n### Step 8 — Run it\n\n**Dev mode** (base + override, with live reload):\n```powershell\ncd $HOME\\docker-learning\\phase10-capstone\ndocker compose config               # check everything resolves\ndocker compose up --build --watch\n```\nOpen http://localhost:3150 → add notes. Edit `api/src/server.js` → auto restart. Edit `frontend/public/index.html` → refresh.\n\n**Prod-like mode** (base only):\n```powershell\ndocker compose -f compose.yml up -d --build\ndocker compose -f compose.yml ps    # all healthy?\n```\n\n### Step 9 — Verify the acceptance checklist\n\nRun these in **prod-like mode** (`-f compose.yml`, so the dev override is not mixed in):\n```powershell\n# Only proxy publishes a port:\ndocker compose -f compose.yml ps --format 'table {{.Service}}\\t{{.Ports}}'\n\n# proxy cannot reach db (network isolation):\ndocker compose -f compose.yml exec proxy ping -c 1 -W 2 db     # bad address 'db'  ✅\n\n# data survives down/up:\ndocker compose -f compose.yml down; docker compose -f compose.yml up -d\ncurl.exe http://localhost:3150/api/notes                        # notes still there ✅\n\n# api runs as non-root:\ndocker compose -f compose.yml exec api whoami                   # node ✅\n\n# reset (deletes the database volume):\ndocker compose -f compose.yml down -v\n```\n\n> ⚠️ The `redis` image declares a `VOLUME /data`, so `cache` gets an **anonymous volume**. Every plain `docker compose down` leaves that volume behind as an orphan (only `down -v` removes it). Check with `docker volume ls -f dangling=true`. To avoid it, give the cache a named volume (`volumes: [redisdata:/data]` plus `redisdata:` under the top-level `volumes:`), which also keeps the view counter across restarts.\n\n**Real results from a test run:** prod-like `up --build --wait` took 25 s and every service came up; only `proxy` published a port (3150); the page, `/api/health`, notes from Postgres and the Redis view counter all worked through the proxy; `proxy` and `frontend` got `bad address` for `db`/`cache` while `api` reached `db`; notes survived `down`/`up`; `api` ran as `node` with a 256 MB limit, half a CPU, `unless-stopped` and log rotation. In dev mode an API edit was live in about 3 s and a frontend edit synced without a restart. The workflow file parsed as valid YAML (it was not pushed to GitHub).\n\n---\n\n## 3. CI: build & push images on every push (GitHub Actions)\n\nPut the project in a GitHub repo, then add `.github/workflows/docker.yml`:\n\n```yaml\nname: docker\n\non:\n  push:\n    branches: [main]\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n      packages: write                  # allow pushing to GHCR\n\n    strategy:\n      matrix:\n        service: [api, frontend]       # run the job once per service\n\n    steps:\n      - uses: actions/checkout@v4                    # get the code\n\n      - uses: docker/setup-buildx-action@v3          # enable BuildKit/buildx\n\n      - uses: docker/login-action@v3                 # docker login ghcr.io\n        with:\n          registry: ghcr.io\n          username: ${{ github.actor }}\n          password: ${{ secrets.GITHUB_TOKEN }}      # automatic token, no setup needed\n\n      - uses: docker/build-push-action@v6            # docker build + push\n        with:\n          context: ./${{ matrix.service }}\n          target: ${{ matrix.service == 'api' && 'prod' || '' }}\n          push: true\n          tags: |\n            ghcr.io/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}\n            ghcr.io/${{ github.repository }}/${{ matrix.service }}:main\n          cache-from: type=gha                       # reuse layers from earlier CI runs\n          cache-to: type=gha,mode=max\n```\n\nWhat each step does:\n\n| Step | Same as running… |\n|------|------------------|\n| `actions/checkout` | `git clone` |\n| `setup-buildx-action` | enabling `docker buildx` |\n| `login-action` | `docker login ghcr.io` |\n| `build-push-action` | `docker build -t … --push ./api` |\n| `cache-from/to: type=gha` | keeps the build cache in GitHub so builds stay fast |\n| `matrix.service` | runs the job twice: once for `api`, once for `frontend` |\n\nTags: `sha-\u003ccommit>` (exact, for deploys) + `main` (moving, \"latest from main\").\n\n> Bonus: add a step before pushing that runs `docker scout cves --exit-code --only-severity critical` to **fail the build** if critical CVEs are found.\n\n---\n\n## 4. Acceptance checklist ✅\n\n- [ ] `git clone` → `Copy-Item .env.example .env` → `docker compose up -d` = working app on a fresh machine\n- [ ] Data survives `down` / `up`; `down -v` resets it\n- [ ] Only `proxy` publishes a port\n- [ ] `proxy` and `frontend` cannot reach `db` or `cache`\n- [ ] The `api` image: multi-stage, non-root, healthcheck. (The simple `frontend` uses plain `nginx`, which runs as root and has no healthcheck; see stretch goal 6.)\n- [ ] `docker compose up --watch` gives live reload for api + frontend\n- [ ] Restart policy, memory limit, and log rotation on every service\n- [ ] CI pushes `sha-…` tagged images to GHCR on every push to `main`\n- [ ] `docker scout quickview` → 0 critical CVEs\n\n---\n\n## 5. Stretch goals\n\n1. Replace the plain HTML frontend with **Angular** (2-stage build → nginx; remember the SPA `try_files` rule).\n2. Add a `migrate` one-time service and make `api` wait with `condition: service_completed_successfully`.\n3. Add **HTTPS** in the proxy using a self-signed certificate.\n4. Add a `compose.prod.yml` that uses the GHCR images (`image: ghcr.io/…:sha-…`) instead of `build:`, and deploy on another machine with only `docker compose pull && docker compose up -d`.\n5. Add a nightly backup service that runs `pg_dump` to a bind-mounted `backups/` folder.\n6. Harden the frontend: switch to `nginxinc/nginx-unprivileged:1.27-alpine` (runs as a normal user and listens on port **8080**, so change `proxy_pass http://frontend:8080;`) and add a `HEALTHCHECK`.\n"},{"id":"phase-11","kind":"phase","num":11,"title":"(Optional) Beyond Docker: A First Look at Kubernetes","short":"Beyond Docker","oneLine":"Compose runs containers on one machine. Kubernetes runs them across many machines, and keeps them running, scaled and updated for you.","meta":["Time: open-ended","Uses the capstone images from Phase 10"],"time":"open-ended","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## 1. When is Compose not enough?\n\n| Need | Compose | Kubernetes |\n|------|---------|------------|\n| Run an app on one server / your PC | ✅ perfect | overkill |\n| Run on **many** servers | ❌ | ✅ |\n| Server dies → move containers elsewhere automatically | ❌ | ✅ |\n| Scale from 2 → 20 copies by load | manual (`--scale`) | ✅ automatic (HPA) |\n| Update with zero downtime, roll back with one command | ❌ | ✅ rolling updates |\n| Learning effort | small | big |\n\n> 💡 Many teams never need Kubernetes. A single server with Compose (or a managed service like AWS ECS / Azure Container Apps / Google Cloud Run) is often enough.\n\n---\n\n## 2. Compose words → Kubernetes words\n\n| Compose | Kubernetes | Simple meaning |\n|---------|-----------|----------------|\n| a container | **Pod** | Smallest unit: one (or a few tightly linked) containers |\n| a service + `deploy.replicas` | **Deployment** | \"Keep N copies of this Pod running, update them safely\" |\n| service name DNS (`db`) | **Service** | Stable name + load balancing to the Pods |\n| `ports:` | **Service** type `NodePort` / `LoadBalancer`, or **Ingress** | Let traffic in from outside |\n| `environment:` | **ConfigMap** | Non-secret settings |\n| `.env` passwords | **Secret** | Secret settings |\n| named volume | **PersistentVolumeClaim (PVC)** | \"I need 1 GB of disk that survives\" |\n| `healthcheck` | **liveness / readiness probes** | Restart if dead / don't send traffic until ready |\n| `compose.yml` | many **YAML manifests** (or a **Helm chart**) | The desired state |\n| `docker compose up` | `kubectl apply -f .` | Make reality match the files |\n\n---\n\n## 3. Try it locally\n\n1. **Docker Desktop → Settings → Kubernetes → Enable Kubernetes** → Apply. Wait until it's green.\n2. Check:\n   ```powershell\n   kubectl version\n   kubectl get nodes          # one node: docker-desktop  Ready\n   ```\n\n> ⚠️ **If Kubernetes is not switched on yet**, `kubectl` still exists (Docker Desktop installs it), but every command fails:\n> ```\n> kubectl config current-context\n> error: current-context is not set\n> kubectl get nodes\n> Unable to connect to the server: dial tcp [::1]:8080: connectex: No connection could be made because the target machine actively refused it.\n> ```\n> `localhost:8080` means kubectl has **no cluster configured** and is guessing. Enable Kubernetes in Docker Desktop (step 1), wait until its status is green, then check `kubectl config get-contexts`: you should see `docker-desktop` marked as current. If you have several clusters, switch with `kubectl config use-context docker-desktop`.\n\n### Example — run the task board in Kubernetes\n\n`taskboard.yaml`\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: taskboard\nspec:\n  replicas: 3                          # 3 copies\n  selector:\n    matchLabels: { app: taskboard }\n  template:\n    metadata:\n      labels: { app: taskboard }\n    spec:\n      containers:\n        - name: taskboard\n          image: taskboard:step4       # local image (built in Phase 2)\n          imagePullPolicy: IfNotPresent\n          ports:\n            - containerPort: 3000\n          readinessProbe:\n            httpGet: { path: /api/health, port: 3000 }\n          resources:\n            limits: { memory: \"256Mi\", cpu: \"500m\" }\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: taskboard\nspec:\n  type: NodePort\n  selector: { app: taskboard }\n  ports:\n    - port: 3000\n      targetPort: 3000\n      nodePort: 31100                 # reach it at http://localhost:31100\n```\n\n```powershell\ndocker build -t taskboard:step4 $HOME\\docker-learning\\taskboard\nkubectl apply -f taskboard.yaml\nkubectl get pods                        # 3 pods Running\nkubectl get svc taskboard\n# open http://localhost:31100\n```\n\n### `kubectl` commands explained\n\n| Command | Docker equivalent | What it does |\n|---------|------------------|--------------|\n| `kubectl apply -f file.yaml` | `docker compose up -d` | Create/update resources |\n| `kubectl get pods` | `docker ps` | List pods (`-o wide` for more columns) |\n| `kubectl logs POD` | `docker logs` | Logs (`-f` to follow) |\n| `kubectl exec -it POD -- sh` | `docker exec -it` | Shell inside |\n| `kubectl describe pod POD` | `docker inspect` | Details + **events** (why it failed) |\n| `kubectl delete pod POD` | `docker rm -f` | Delete — the Deployment **makes a new one** right away! |\n| `kubectl scale deploy taskboard --replicas=5` | `docker compose up --scale` | Change copy count |\n| `kubectl rollout undo deploy taskboard` | — | Go back to the previous version |\n| `kubectl delete -f file.yaml` | `docker compose down` | Remove everything in the file |\n\n**Self-healing demo:**\n```powershell\nkubectl get pods\nkubectl delete pod \u003cone-pod-name>\nkubectl get pods           # a new pod already replaced it ✨\n```\n\nClean up: `kubectl delete -f taskboard.yaml`\n\n---\n\n## 4. Helpful tools\n\n| Tool | What it is |\n|------|-----------|\n| **kompose** | Converts `compose.yml` → Kubernetes YAML (`kompose convert`) — good starting point |\n| **k9s** | A terminal UI to look around a cluster |\n| **Helm** | \"Package manager\" for Kubernetes apps (charts with variables) |\n| **kind / minikube** | Other ways to run a local cluster |\n\n---\n\n## 5. Where to go next\n\n- Official Docker docs: https://docs.docker.com/get-started/\n- Kubernetes basics tutorial: https://kubernetes.io/docs/tutorials/kubernetes-basics/\n- Practice: deploy the Phase 10 capstone to a cloud container service (Azure Container Apps, AWS ECS, Google Cloud Run) using your GHCR images."},{"id":"sample-app","kind":"ref","title":"Sample app","short":"Sample app","oneLine":"The task board you package with Docker in Phases 2 to 6, with every file and how to set it up.","md":"The task board is a small Express app (Node.js) with a web page and a JSON API. It keeps its tasks in memory, so they reset when it restarts. That is on purpose: Phase 3 and Phase 5 show you how to keep data.\n\nPhases 2, 4, 5, 6 and 8 build this app into images, so set it up once before Phase 2.\n\n## Set it up\n\n1. Create the folders:\n   ```powershell\n   mkdir $HOME\\docker-learning\\taskboard\\src, $HOME\\docker-learning\\taskboard\\public, $HOME\\docker-learning\\taskboard\\docker-steps\n   cd $HOME\\docker-learning\\taskboard\n   ```\n2. Create every file listed below with exactly the same name and content. Use the **Copy** button on each block.\n3. Create `package-lock.json`. The Dockerfiles use `npm ci`, which needs it.\n   - With Node.js installed: `npm install`\n   - Without Node.js, let Docker do it:\n     ```powershell\n     docker run --rm -v ${PWD}:/app -w /app node:22-alpine npm install --package-lock-only\n     ```\n4. Check that it works, either way:\n   ```powershell\n   npm start                          # needs Node.js → http://localhost:3000\n   docker compose up -d --build       # needs only Docker → http://localhost:3100\n   ```\n\nYou should see the task board with three example tasks, a health dot, and a \"Server info\" panel. When the app runs in a container, the hostname in that panel changes to the container ID.\n\n## The API\n\n| Method | Path | What it does |\n|--------|------|--------------|\n| GET | `/api/health` | Health check used by `HEALTHCHECK` |\n| GET | `/api/info` | Hostname, environment, Node version, process ID |\n| GET | `/api/tasks` | List tasks |\n| POST | `/api/tasks` | Add a task: `{ \"title\": \"...\" }` |\n| PATCH | `/api/tasks/:id` | Change a task: `{ \"done\": true }` |\n| DELETE | `/api/tasks/:id` | Delete a task |\n\nSettings come from environment variables: `PORT` (default 3000), `APP_NAME` (default \"Task Board\") and `NODE_ENV`.\n\n## The files\n\n### `package.json`\n\n```json\n{\n  \"name\": \"taskboard\",\n  \"version\": \"1.0.0\",\n  \"description\": \"Basic Node.js + Express + Tailwind task board, built to learn Docker\",\n  \"main\": \"src/server.js\",\n  \"scripts\": {\n    \"start\": \"node src/server.js\",\n    \"dev\": \"node --watch src/server.js\"\n  },\n  \"engines\": {\n    \"node\": \">=20\"\n  },\n  \"license\": \"MIT\",\n  \"dependencies\": {\n    \"express\": \"^4.21.2\"\n  }\n}\n```\n\n### `src/server.js`\n\n```javascript\nconst express = require('express');\nconst path = require('path');\nconst os = require('os');\n\nconst app = express();\nconst PORT = process.env.PORT || 3000;\nconst APP_NAME = process.env.APP_NAME || 'Task Board';\nconst startedAt = new Date();\n\napp.use(express.json());\napp.use(express.static(path.join(__dirname, '..', 'public')));\n\n// ---- In-memory data store (resets on restart; that's a Docker lesson later) ----\nlet nextId = 4;\nlet tasks = [\n  { id: 1, title: 'Write the Express server', done: true, createdAt: new Date().toISOString() },\n  { id: 2, title: 'Style the UI with Tailwind', done: true, createdAt: new Date().toISOString() },\n  { id: 3, title: 'Dockerize this app', done: false, createdAt: new Date().toISOString() },\n];\n\n// ---- API ----\napp.get('/api/health', (req, res) => {\n  res.json({ status: 'ok', uptimeSeconds: Math.floor(process.uptime()) });\n});\n\napp.get('/api/info', (req, res) => {\n  res.json({\n    appName: APP_NAME,\n    environment: process.env.NODE_ENV || 'development',\n    nodeVersion: process.version,\n    hostname: os.hostname(),\n    platform: `${os.platform()} ${os.arch()}`,\n    pid: process.pid,\n    startedAt: startedAt.toISOString(),\n    memoryMB: Math.round(process.memoryUsage().rss / 1024 / 1024),\n  });\n});\n\napp.get('/api/tasks', (req, res) => {\n  res.json(tasks);\n});\n\napp.post('/api/tasks', (req, res) => {\n  const title = (req.body.title || '').trim();\n  if (!title) return res.status(400).json({ error: 'title is required' });\n  const task = { id: nextId++, title, done: false, createdAt: new Date().toISOString() };\n  tasks.push(task);\n  res.status(201).json(task);\n});\n\napp.patch('/api/tasks/:id', (req, res) => {\n  const task = tasks.find((t) => t.id === Number(req.params.id));\n  if (!task) return res.status(404).json({ error: 'task not found' });\n  if (typeof req.body.done === 'boolean') task.done = req.body.done;\n  if (typeof req.body.title === 'string' && req.body.title.trim()) task.title = req.body.title.trim();\n  res.json(task);\n});\n\napp.delete('/api/tasks/:id', (req, res) => {\n  const before = tasks.length;\n  tasks = tasks.filter((t) => t.id !== Number(req.params.id));\n  if (tasks.length === before) return res.status(404).json({ error: 'task not found' });\n  res.status(204).end();\n});\n\napp.use('/api', (req, res) => res.status(404).json({ error: 'not found' }));\n\nconst server = app.listen(PORT, '0.0.0.0', () => {\n  console.log(`${APP_NAME} listening on http://0.0.0.0:${PORT} (pid ${process.pid})`);\n});\n\n// Graceful shutdown: Docker sends SIGTERM on `docker stop`. Without this handler,\n// Node would ignore it and Docker would SIGKILL after 10s.\nfunction shutdown(signal) {\n  console.log(`${signal} received, shutting down...`);\n  server.close(() => process.exit(0));\n  setTimeout(() => process.exit(1), 5000).unref();\n}\nprocess.on('SIGTERM', () => shutdown('SIGTERM'));\nprocess.on('SIGINT', () => shutdown('SIGINT'));\n```\n\n### `public/index.html`\n\n```html\n\u003c!doctype html>\n\u003chtml lang=\"en\" class=\"h-full\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\" />\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n  \u003ctitle>Task Board\u003c/title>\n  \u003cscript src=\"https://cdn.tailwindcss.com\">\u003c/script>\n  \u003cscript>\n    tailwind.config = {\n      theme: {\n        extend: {\n          fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },\n        },\n      },\n    };\n  \u003c/script>\n  \u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />\n  \u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap\" rel=\"stylesheet\" />\n\u003c/head>\n\u003cbody class=\"h-full bg-slate-950 text-slate-100 antialiased\">\n  \u003cdiv class=\"min-h-full bg-[radial-gradient(ellipse_at_top,_rgba(99,102,241,0.18),_transparent_60%)]\">\n    \u003cmain class=\"mx-auto max-w-5xl px-4 py-10 sm:px-6 lg:px-8\">\n\n      \u003c!-- Header -->\n      \u003cheader class=\"mb-10 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between\">\n        \u003cdiv>\n          \u003cp class=\"text-xs font-semibold uppercase tracking-widest text-indigo-400\">Node.js · Express · Tailwind\u003c/p>\n          \u003ch1 class=\"mt-2 text-3xl font-bold tracking-tight sm:text-4xl\" id=\"app-name\">Task Board\u003c/h1>\n          \u003cp class=\"mt-2 text-sm text-slate-400\">A small app built to learn how Docker packages a Node service.\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"flex items-center gap-2 rounded-full border border-slate-800 bg-slate-900/60 px-3 py-1.5 text-xs\">\n          \u003cspan id=\"health-dot\" class=\"h-2 w-2 rounded-full bg-slate-500\">\u003c/span>\n          \u003cspan id=\"health-text\" class=\"text-slate-400\">checking…\u003c/span>\n        \u003c/div>\n      \u003c/header>\n\n      \u003c!-- Stats -->\n      \u003csection class=\"mb-8 grid grid-cols-2 gap-4 sm:grid-cols-4\">\n        \u003cdiv class=\"rounded-xl border border-slate-800 bg-slate-900/60 p-4\">\n          \u003cp class=\"text-xs text-slate-400\">Total\u003c/p>\n          \u003cp id=\"stat-total\" class=\"mt-1 text-2xl font-semibold\">–\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"rounded-xl border border-slate-800 bg-slate-900/60 p-4\">\n          \u003cp class=\"text-xs text-slate-400\">Done\u003c/p>\n          \u003cp id=\"stat-done\" class=\"mt-1 text-2xl font-semibold text-emerald-400\">–\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"rounded-xl border border-slate-800 bg-slate-900/60 p-4\">\n          \u003cp class=\"text-xs text-slate-400\">Open\u003c/p>\n          \u003cp id=\"stat-open\" class=\"mt-1 text-2xl font-semibold text-amber-400\">–\u003c/p>\n        \u003c/div>\n        \u003cdiv class=\"rounded-xl border border-slate-800 bg-slate-900/60 p-4\">\n          \u003cp class=\"text-xs text-slate-400\">Progress\u003c/p>\n          \u003cp id=\"stat-pct\" class=\"mt-1 text-2xl font-semibold text-indigo-400\">–\u003c/p>\n        \u003c/div>\n      \u003c/section>\n\n      \u003cdiv class=\"grid gap-6 lg:grid-cols-3\">\n        \u003c!-- Tasks -->\n        \u003csection class=\"lg:col-span-2\">\n          \u003cdiv class=\"rounded-2xl border border-slate-800 bg-slate-900/60 shadow-xl shadow-black/30\">\n            \u003cdiv class=\"border-b border-slate-800 p-5\">\n              \u003cform id=\"task-form\" class=\"flex gap-2\">\n                \u003cinput id=\"task-input\" type=\"text\" placeholder=\"Add a new task…\" autocomplete=\"off\"\n                  class=\"flex-1 rounded-lg border border-slate-700 bg-slate-950 px-4 py-2.5 text-sm placeholder:text-slate-500 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30\" />\n                \u003cbutton type=\"submit\"\n                  class=\"rounded-lg bg-indigo-500 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 active:scale-95\">\n                  Add\n                \u003c/button>\n              \u003c/form>\n              \u003cp id=\"form-error\" class=\"mt-2 hidden text-xs text-rose-400\">\u003c/p>\n            \u003c/div>\n            \u003cul id=\"task-list\" class=\"divide-y divide-slate-800\">\u003c/ul>\n            \u003cp id=\"empty-state\" class=\"hidden p-10 text-center text-sm text-slate-500\">No tasks yet. Add one above.\u003c/p>\n          \u003c/div>\n        \u003c/section>\n\n        \u003c!-- Server info -->\n        \u003caside>\n          \u003cdiv class=\"rounded-2xl border border-slate-800 bg-slate-900/60 p-5 shadow-xl shadow-black/30\">\n            \u003cdiv class=\"mb-4 flex items-center justify-between\">\n              \u003ch2 class=\"text-sm font-semibold\">Server info\u003c/h2>\n              \u003cbutton id=\"refresh-info\" class=\"text-xs text-indigo-400 hover:text-indigo-300\">refresh\u003c/button>\n            \u003c/div>\n            \u003cp class=\"mb-3 text-xs text-slate-500\">Comes from \u003ccode class=\"rounded bg-slate-800 px-1 py-0.5\">GET /api/info\u003c/code>. Watch the hostname change once this runs in a container.\u003c/p>\n            \u003cdl id=\"info-list\" class=\"space-y-2 text-xs\">\u003c/dl>\n          \u003c/div>\n\n          \u003cdiv class=\"mt-6 rounded-2xl border border-slate-800 bg-slate-900/60 p-5\">\n            \u003ch2 class=\"mb-3 text-sm font-semibold\">API endpoints\u003c/h2>\n            \u003cul class=\"space-y-1.5 font-mono text-xs text-slate-400\">\n              \u003cli>\u003cspan class=\"text-emerald-400\">GET\u003c/span> /api/health\u003c/li>\n              \u003cli>\u003cspan class=\"text-emerald-400\">GET\u003c/span> /api/info\u003c/li>\n              \u003cli>\u003cspan class=\"text-emerald-400\">GET\u003c/span> /api/tasks\u003c/li>\n              \u003cli>\u003cspan class=\"text-sky-400\">POST\u003c/span> /api/tasks\u003c/li>\n              \u003cli>\u003cspan class=\"text-amber-400\">PATCH\u003c/span> /api/tasks/:id\u003c/li>\n              \u003cli>\u003cspan class=\"text-rose-400\">DELETE\u003c/span> /api/tasks/:id\u003c/li>\n            \u003c/ul>\n          \u003c/div>\n        \u003c/aside>\n      \u003c/div>\n    \u003c/main>\n  \u003c/div>\n\n  \u003cscript src=\"/app.js\">\u003c/script>\n\u003c/body>\n\u003c/html>\n```\n\n### `public/app.js`\n\n```javascript\nconst $ = (sel) => document.querySelector(sel);\n\nasync function api(path, options = {}) {\n  const res = await fetch(path, {\n    headers: { 'Content-Type': 'application/json' },\n    ...options,\n  });\n  if (res.status === 204) return null;\n  const data = await res.json().catch(() => ({}));\n  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);\n  return data;\n}\n\n// ---------- Tasks ----------\nfunction renderTasks(tasks) {\n  const list = $('#task-list');\n  list.innerHTML = '';\n  $('#empty-state').classList.toggle('hidden', tasks.length > 0);\n\n  for (const t of tasks) {\n    const li = document.createElement('li');\n    li.className = 'group flex items-center gap-3 px-5 py-3.5 transition hover:bg-slate-800/40';\n    li.innerHTML = `\n      \u003cbutton data-toggle=\"${t.id}\" data-done=\"${t.done}\" aria-label=\"toggle\"\n        class=\"flex h-5 w-5 shrink-0 items-center justify-center rounded-md border transition\n               ${t.done ? 'border-emerald-500 bg-emerald-500 text-slate-950' : 'border-slate-600 hover:border-indigo-400'}\">\n        ${t.done ? '\u003csvg class=\"h-3.5 w-3.5\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\u003cpath fill-rule=\"evenodd\" d=\"M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 111.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z\" clip-rule=\"evenodd\"/>\u003c/svg>' : ''}\n      \u003c/button>\n      \u003cspan class=\"flex-1 text-sm ${t.done ? 'text-slate-500 line-through' : 'text-slate-100'}\">${escapeHtml(t.title)}\u003c/span>\n      \u003cspan class=\"hidden text-[10px] text-slate-600 sm:inline\">#${t.id}\u003c/span>\n      \u003cbutton data-delete=\"${t.id}\" aria-label=\"delete\"\n        class=\"rounded p-1 text-slate-600 opacity-0 transition hover:bg-rose-500/10 hover:text-rose-400 group-hover:opacity-100\">\n        \u003csvg class=\"h-4 w-4\" viewBox=\"0 0 20 20\" fill=\"currentColor\">\u003cpath fill-rule=\"evenodd\" d=\"M9 2a1 1 0 00-.9.6L7.4 4H4a1 1 0 000 2h1v10a2 2 0 002 2h6a2 2 0 002-2V6h1a1 1 0 100-2h-3.4l-.7-1.4A1 1 0 0011 2H9zM7 6h6v10H7V6z\" clip-rule=\"evenodd\"/>\u003c/svg>\n      \u003c/button>`;\n    list.appendChild(li);\n  }\n\n  const done = tasks.filter((t) => t.done).length;\n  $('#stat-total').textContent = tasks.length;\n  $('#stat-done').textContent = done;\n  $('#stat-open').textContent = tasks.length - done;\n  $('#stat-pct').textContent = tasks.length ? Math.round((done / tasks.length) * 100) + '%' : '0%';\n}\n\nasync function loadTasks() {\n  renderTasks(await api('/api/tasks'));\n}\n\n$('#task-form').addEventListener('submit', async (e) => {\n  e.preventDefault();\n  const input = $('#task-input');\n  const err = $('#form-error');\n  err.classList.add('hidden');\n  try {\n    await api('/api/tasks', { method: 'POST', body: JSON.stringify({ title: input.value }) });\n    input.value = '';\n    await loadTasks();\n  } catch (ex) {\n    err.textContent = ex.message;\n    err.classList.remove('hidden');\n  }\n});\n\n$('#task-list').addEventListener('click', async (e) => {\n  const toggle = e.target.closest('[data-toggle]');\n  const del = e.target.closest('[data-delete]');\n  if (toggle) {\n    const isDone = toggle.dataset.done === 'true';\n    await api(`/api/tasks/${toggle.dataset.toggle}`, { method: 'PATCH', body: JSON.stringify({ done: !isDone }) });\n    await loadTasks();\n  } else if (del) {\n    await api(`/api/tasks/${del.dataset.delete}`, { method: 'DELETE' });\n    await loadTasks();\n  }\n});\n\n// ---------- Server info + health ----------\nasync function loadInfo() {\n  const info = await api('/api/info');\n  $('#app-name').textContent = info.appName;\n  document.title = info.appName;\n  const rows = {\n    Environment: info.environment,\n    Hostname: info.hostname,\n    Node: info.nodeVersion,\n    Platform: info.platform,\n    PID: info.pid,\n    Memory: info.memoryMB + ' MB',\n    Started: new Date(info.startedAt).toLocaleTimeString(),\n  };\n  $('#info-list').innerHTML = Object.entries(rows)\n    .map(([k, v]) => `\u003cdiv class=\"flex justify-between gap-3\">\u003cdt class=\"text-slate-500\">${k}\u003c/dt>\u003cdd class=\"truncate font-mono text-slate-200\">${escapeHtml(String(v))}\u003c/dd>\u003c/div>`)\n    .join('');\n}\n\nasync function checkHealth() {\n  const dot = $('#health-dot');\n  const text = $('#health-text');\n  try {\n    const h = await api('/api/health');\n    dot.className = 'h-2 w-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]';\n    text.textContent = `healthy · up ${formatUptime(h.uptimeSeconds)}`;\n  } catch {\n    dot.className = 'h-2 w-2 rounded-full bg-rose-500';\n    text.textContent = 'unreachable';\n  }\n}\n\nfunction formatUptime(s) {\n  if (s \u003c 60) return `${s}s`;\n  if (s \u003c 3600) return `${Math.floor(s / 60)}m ${s % 60}s`;\n  return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;\n}\n\nfunction escapeHtml(str) {\n  const map = { '&': '&amp;', '\u003c': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' };\n  return str.replace(/[&\u003c>\"']/g, (c) => map[c]);\n}\n\n$('#refresh-info').addEventListener('click', loadInfo);\n\nloadTasks();\nloadInfo();\ncheckHealth();\nsetInterval(checkHealth, 5000);\n```\n\n### `.dockerignore`\n\n```gitignore\n# Files that should never be sent to the Docker build context.\n# Same idea as .gitignore, but for `docker build`.\nnode_modules\nnpm-debug.log*\n.env\n.git\n.gitignore\ndocker-steps\nDockerfile*\ndocker-compose*.yml\n*.md\n```\n\n### `Dockerfile`\n\n```dockerfile\n# FINAL Dockerfile (= docker-steps/step4.Dockerfile). See DOCKER_GUIDE.md for how we got here.\n\n# Alpine variant: same Node, ~5x smaller base. (Use node:22-slim if a native\n# dependency needs glibc; alpine uses musl.)\nFROM node:22-alpine\n\n# Tells Express and many libs to run in production mode (less logging, caching on).\nENV NODE_ENV=production\n\nWORKDIR /app\n\nCOPY package.json package-lock.json ./\nRUN npm ci --omit=dev && npm cache clean --force\n\nCOPY src ./src\nCOPY public ./public\n\n# The node images ship a non-root user called \"node\". Never run as root in\n# production: a compromised app would otherwise be root inside the container.\nUSER node\n\nEXPOSE 3000\n\n# Docker will run this every 30s and mark the container \"unhealthy\" if it fails.\n# Orchestrators (compose, swarm, k8s-style setups) use this to restart/route traffic.\n# Use 127.0.0.1, not localhost: in Alpine \"localhost\" resolves to IPv6 ::1 first,\n# but Node is bound to IPv4 0.0.0.0, so the probe would get \"connection refused\".\nHEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\\n  CMD wget -qO- http://127.0.0.1:3000/api/health || exit 1\n\n# EXEC form (JSON array): node becomes PID 1 and receives SIGTERM directly,\n# so our graceful-shutdown handler in server.js actually runs on `docker stop`.\nCMD [\"node\", \"src/server.js\"]\n```\n\n### `docker-compose.yml`\n\n```yaml\n# Production-style compose file.\n#   docker compose up -d --build     # build image + start in background\n#   docker compose logs -f           # follow logs\n#   docker compose ps                # see status + health\n#   docker compose down              # stop + remove container/network\nservices:\n  web:\n    build: .                      # use ./Dockerfile\n    image: taskboard:latest # name to tag the built image with\n    container_name: taskboard\n    ports:\n      - \"3100:3000\"               # host:container (host 3100 avoids clashing with `npm start`)\n    environment:\n      APP_NAME: \"Task Board (Docker)\"\n      # NODE_ENV=production and PORT=3000 are already set/default in the image\n    restart: unless-stopped       # come back after a crash or a host reboot\n    # HEALTHCHECK is inherited from the Dockerfile; `docker compose ps` shows it.\n```\n\n### `docker-compose.dev.yml`\n\n```yaml\n# Development override: live-reload inside the container.\n#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --watch\n#\n# Why `develop.watch` and not a plain bind mount + `node --watch`?\n# On Docker Desktop for Windows/macOS, file-change events (inotify) from a\n# mounted host folder often never reach the container, so node --watch sits\n# idle. `develop.watch` watches on the HOST, copies changed files into the\n# container, and restarts it. Works the same on every OS.\nservices:\n  web:\n    environment:\n      NODE_ENV: development\n      APP_NAME: \"Task Board (Docker dev)\"\n    develop:\n      watch:\n        - path: ./src\n          target: /app/src\n          action: sync+restart      # copy file in, then restart the container\n        - path: ./public\n          target: /app/public\n          action: sync              # static files: copy only, no restart needed\n        - path: ./package.json\n          action: rebuild           # dependency change => rebuild the image\n```\n\n\n## The Dockerfile steps (used in Phase 2)\n\nThese four files show how the Dockerfile improves step by step. Put them in the `docker-steps` folder.\n\n### `docker-steps/step1.Dockerfile`\n\n```dockerfile\n# STEP 1 — The naive Dockerfile. It works, but it has problems we will fix step by step.\n\n# Every image starts FROM a base image. \"node:22\" is the official Node image\n# built on Debian: a full Linux userland + Node 22 preinstalled (~1.1 GB).\nFROM node:22\n\n# All following commands run inside this directory in the container.\nWORKDIR /app\n\n# Copy EVERYTHING from the build context (your project folder) into /app.\n# Problem: this includes your host node_modules, .git, docs, etc.\nCOPY . .\n\n# Install dependencies inside the image.\nRUN npm install\n\n# Documentation only: tells readers (and `docker run -P`) which port the app uses.\nEXPOSE 3000\n\n# The process to start when a container is created from this image.\nCMD node src/server.js\n```\n\n### `docker-steps/step2.Dockerfile`\n\n```dockerfile\n# STEP 2 — Same Dockerfile as step 1. The change is the new .dockerignore file\n# next to it, which stops node_modules / .git / docs being sent to the daemon.\n# Lesson: the build CONTEXT is everything Docker can see; keep it small and clean.\nFROM node:22\nWORKDIR /app\nCOPY . .\nRUN npm install\nEXPOSE 3000\nCMD node src/server.js\n```\n\n### `docker-steps/step3.Dockerfile`\n\n```dockerfile\n# STEP 3 — Layer caching + production installs.\n# Each instruction creates a layer. Docker reuses a cached layer only if the\n# instruction AND every layer before it are unchanged. So: copy the files that\n# change rarely (package.json) BEFORE the files that change often (your code).\nFROM node:22\nWORKDIR /app\n\n# 1) Only the dependency manifests.\nCOPY package.json package-lock.json ./\n\n# 2) Install from the lockfile, skip devDependencies. This layer is cached\n#    until package*.json changes, so code edits no longer re-run npm.\nRUN npm ci --omit=dev\n\n# 3) Now the application code.\nCOPY src ./src\nCOPY public ./public\n\nEXPOSE 3000\nCMD node src/server.js\n```\n\n### `docker-steps/step4.Dockerfile`\n\n```dockerfile\n# STEP 4 — Production hardening: small base, non-root user, proper signals, healthcheck.\n\n# Alpine variant: same Node, ~5x smaller base. (Use node:22-slim if a native\n# dependency needs glibc; alpine uses musl.)\nFROM node:22-alpine\n\n# Tells Express and many libs to run in production mode (less logging, caching on).\nENV NODE_ENV=production\n\nWORKDIR /app\n\nCOPY package.json package-lock.json ./\nRUN npm ci --omit=dev && npm cache clean --force\n\nCOPY src ./src\nCOPY public ./public\n\n# The node images ship a non-root user called \"node\". Never run as root in\n# production: a compromised app would otherwise be root inside the container.\nUSER node\n\nEXPOSE 3000\n\n# Docker will run this every 30s and mark the container \"unhealthy\" if it fails.\n# Orchestrators (compose, swarm, k8s-style setups) use this to restart/route traffic.\n# Use 127.0.0.1, not localhost: in Alpine \"localhost\" resolves to IPv6 ::1 first,\n# but Node is bound to IPv4 0.0.0.0, so the probe would get \"connection refused\".\nHEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\\n  CMD wget -qO- http://127.0.0.1:3000/api/health || exit 1\n\n# EXEC form (JSON array): node becomes PID 1 and receives SIGTERM directly,\n# so our graceful-shutdown handler in server.js actually runs on `docker stop`.\nCMD [\"node\", \"src/server.js\"]\n```"},{"id":"cheat-sheet","kind":"ref","title":"Cheat sheet","short":"Cheat sheet","oneLine":"The commands you will use every day, in one place.","md":"## Containers\n\n```powershell\ndocker run -d --name NAME -p HOST:CONTAINER -e KEY=VALUE -v VOLUME:/path IMAGE:TAG\ndocker run --rm -it IMAGE sh          # throwaway shell\ndocker ps                             # running containers\ndocker ps -a                          # all containers\ndocker logs -f NAME                   # follow output\ndocker exec -it NAME sh               # shell in a running container\ndocker stop NAME ; docker start NAME ; docker restart NAME\ndocker rm -f NAME                     # stop and delete\ndocker inspect NAME                   # every detail as JSON\ndocker stats                          # live CPU and memory\n```\n\n## Images\n\n```powershell\ndocker build -t NAME:TAG .            # build from ./Dockerfile\ndocker build -f other.Dockerfile -t NAME:TAG .\ndocker images                         # list images\ndocker history NAME:TAG               # layers and their sizes\ndocker tag NAME:TAG REGISTRY/NAME:TAG\ndocker push REGISTRY/NAME:TAG\ndocker pull REGISTRY/NAME:TAG\ndocker rmi NAME:TAG\n```\n\n## Data and networks\n\n```powershell\ndocker volume create NAME ; docker volume ls ; docker volume rm NAME\ndocker run -v NAME:/path IMAGE              # named volume\ndocker run -v ${PWD}\\folder:/path:ro IMAGE  # bind mount, read-only\ndocker network create NET ; docker network ls ; docker network inspect NET\ndocker run --network NET --name api IMAGE   # other containers reach it as \"api\"\n```\n\n## Compose\n\n```powershell\ndocker compose up -d --build          # build and start everything\ndocker compose ps                     # status and health\ndocker compose logs -f SERVICE\ndocker compose exec SERVICE sh\ndocker compose run --rm SERVICE CMD   # one-off command\ndocker compose watch                  # live reload with develop.watch\ndocker compose down                   # stop and remove, keep volumes\ndocker compose down -v                # also delete volumes (data!)\ndocker compose config                 # show the final merged file\n```\n\n## Debugging and cleanup\n\n```powershell\ndocker run --rm -it --entrypoint sh IMAGE   # look inside an image that crashes\ndocker inspect NAME --format '{{.State.ExitCode}} {{.State.OOMKilled}}'\ndocker cp NAME:/path .\\local                # copy a file out\ndocker events                               # what happens, live\ndocker system df                            # disk use\ndocker image prune ; docker builder prune ; docker container prune\n```\n\n## Exit codes\n\n| Code | Meaning |\n|------|---------|\n| 0 | Finished without error |\n| 1 | The app reported an error |\n| 125 | Docker could not run the container (bad flag, name or port conflict) |\n| 126 | The command is not executable |\n| 127 | The command was not found |\n| 137 | Killed: out of memory or `docker kill` |\n| 143 | Stopped normally by `docker stop` |"},{"id":"gotchas","kind":"ref","title":"Windows gotchas","short":"Windows gotchas","oneLine":"Traps you may meet on Windows, what they look like, and how to fix them.","md":"These traps catch many people on Windows. Each one is explained in the phase where you first meet it.\n\n| Problem | What you see | Fix |\n|---------|-------------|-----|\n| **Git Bash** changes Linux paths | `/etc/os-release` becomes `C:/Program Files/Git/etc/os-release` and the command fails | Run `export MSYS_NO_PATHCONV=1` first, or use PowerShell |\n| **Windows PowerShell 5.1** drops inner double quotes when it calls programs | `sh -c 'echo \"$A $B\"; exit 3'` runs only part of the command | Avoid inner double quotes, or use PowerShell 7 (`pwsh`) |\n| `~` is not expanded for `docker` | `docker build ~\\app` cannot find the folder | Use `$HOME\\app` or a relative path |\n| Health check to `localhost` fails on Alpine images | Container stays `unhealthy` although the app works | Use `127.0.0.1`: Alpine resolves `localhost` to IPv6 first |\n| File watchers do not see edits through a bind mount | `node --watch` or nodemon never reloads | Use Compose `develop.watch` (Phase 6) |\n| Bind mounts are slow | Big `node_modules` folders make the app slow | Keep dependencies inside the image or in a named volume |\n| Docker 29 removed `.NetworkSettings.IPAddress` | `map has no entry for key \"IPAddress\"` | Read `.NetworkSettings.Networks.\u003cnetwork>.IPAddress` |\n| A port is already used on your PC | `port is already allocated` | Change the left side of `-p`, for example `-p 3105:80` |\n| Docker Desktop is not running | `error during connect` | Start Docker Desktop and wait for \"Engine running\" |"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/nginx.min.js"></script>
<script>
(function () {
  const DATA = JSON.parse(document.getElementById('course-data').textContent);
  const PAGES = DATA.pages;
  const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
  const PHASES = PAGES.filter(p => p.kind === 'phase');
  const $ = s => document.querySelector(s);

  /* ---------- progress (per viewer, best effort) ---------- */
  const KEY = 'dbe-progress-v1';
  let progress = {};
  try { progress = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { progress = {}; }
  function saveProgress() { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
  const doneCount = () => PHASES.filter(p => progress[p.id]).length;

  /* ---------- helpers ---------- */
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function makeSlugger() {
    const seen = {};
    return raw => {
      let s = String(raw).toLowerCase()
        .replace(/<[^>]+>/g, '').replace(/[`*_~]/g, '')
        .replace(/[^\p{L}\p{N}\s-]/gu, '').trim().replace(/\s+/g, '-') || 'section';
      if (seen[s]) { seen[s] += 1; s = s + '-' + seen[s]; } else { seen[s] = 1; }
      return s;
    };
  }
  const pad = n => String(n).padStart(2, '0');

  /* ---------- markdown renderer ---------- */
  const LANG = { sh: 'bash', shell: 'bash', ps: 'powershell', ps1: 'powershell', js: 'javascript', ts: 'typescript', yml: 'yaml', gitignore: 'plaintext', text: 'plaintext', txt: 'plaintext', ini: 'ini' };
  let codeStore = [];
  let slug = makeSlugger();
  const renderer = {
    heading(text, level, raw) {
      const id = slug(raw);
      return `<h${level} id="${id}">${text}</h${level}>`;
    },
    code(code, info) {
      const lang = (info || '').trim().split(/\s+/)[0].toLowerCase();
      const hl = LANG[lang] || lang;
      let html;
      if (hl && hl !== 'plaintext' && window.hljs && hljs.getLanguage(hl)) {
        try { html = hljs.highlight(code, { language: hl, ignoreIllegals: true }).value; } catch (e) { html = esc(code); }
      } else { html = esc(code); }
      const i = codeStore.push(code) - 1;
      const isDiagram = !lang && /[┌└│─▶▼]/.test(code);
      const label = lang || (isDiagram ? 'diagram' : 'output');
      return `<figure class="code${isDiagram ? ' diagram' : ''}"><div class="code-head"><span>${esc(label)}</span><button class="copy" data-code="${i}" type="button">Copy</button></div><pre><code>${html}</code></pre></figure>`;
    },
    table(header, body) {
      return `<div class="table-wrap"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
    },
    link(href, title, text) {
      let h = href || '';
      const m = h.match(/(phase-\d\d)[^/]*\.md$/);
      if (m) h = '#' + m[1];
      else if (/DOCKER_LEARNING_PLAN\.md$/.test(h)) h = '#home';
      else if (/^sample-app\.md$/.test(h)) h = '#sample-app';
      const ext = /^https?:/.test(h);
      return `<a href="${esc(h)}"${title ? ` title="${esc(title)}"` : ''}${ext ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`;
    }
  };
  marked.use({ renderer, gfm: true, breaks: false });

  /* ---------- nav ---------- */
  function renderNav(current) {
    const link = (p, cls, numText) => `<a href="#${p.id}" class="${cls}${p.id === current ? ' current' : ''}${progress[p.id] ? ' done' : ''}"><span class="nav-num">${numText}</span><span>${esc(p.short || p.title)}</span>${p.kind === 'phase' ? '<span class="nav-check" aria-hidden="true"></span>' : ''}</a>`;
    let html = `<a href="#home" class="nav-plain${current === 'home' ? ' current' : ''}"><span class="nav-num">◆</span><span>Course home</span></a>`;
    html += `<div class="nav-group">Phases</div>`;
    html += PHASES.map(p => link(p, '', pad(p.num))).join('');
    html += `<div class="nav-group">Reference</div>`;
    html += PAGES.filter(p => p.kind === 'ref').map(p => link(p, 'nav-plain', '§')).join('');
    $('#nav').innerHTML = html;
    const d = doneCount();
    $('#gauge-text').textContent = `${d} / ${PHASES.length}`;
    $('#gauge-fill').style.width = (d / PHASES.length * 100) + '%';
  }

  /* ---------- pages ---------- */
  function nextUnfinished() { return PHASES.find(p => !progress[p.id]) || PHASES[PHASES.length - 1]; }

  function renderHome() {
    const d = doneCount();
    const next = nextUnfinished();
    const startLabel = d === 0 ? 'Start with Phase 00' : (d === PHASES.length ? 'Review the capstone' : `Continue with Phase ${pad(next.num)}`);
    // Container stack: phase 00 sits bottom-left, like loading a ship from the deck up.
    const rows = [];
    for (let r = Math.ceil(PHASES.length / 3) - 1; r >= 0; r--) rows.push(PHASES.slice(r * 3, r * 3 + 3));
    const stack = rows.flat().map(p => `<a class="box${progress[p.id] ? ' done' : ''}" href="#${p.id}" title="Phase ${pad(p.num)}: ${esc(p.title)}"><span>P${pad(p.num)}</span><span>${progress[p.id] ? 'LOADED' : ''}</span></a>`).join('');
    const cards = PHASES.map(p => `
      <a class="phase-card" href="#${p.id}">
        <div class="phase-card-top"><span class="tag">PHASE ${pad(p.num)}</span><span>${esc(p.time || '')}</span></div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.oneLine || '')}</p>
        ${progress[p.id] ? '<span class="state done">Completed</span>' : ''}
      </a>`).join('');
    $('#page').innerHTML = `
      <section class="hero">
        <div>
          <div class="eyebrow" style="margin-bottom:14px"><span class="tag">12 PHASES</span><span>About 15 hours, hands-on</span></div>
          <h1>Docker by Example</h1>
          <p>Learn Docker by running it. Each phase explains the idea in plain words, then every command and flag you type, then a real example you run on your own computer.</p>
          <div class="hero-actions">
            <a class="btn" href="#${next.id}">${startLabel}</a>
            <a class="btn ghost" href="#cheat-sheet">Open the cheat sheet</a>
          </div>
        </div>
        <div class="stack-wrap">
          <div class="stack" aria-label="Progress: ${d} of ${PHASES.length} phases completed">${stack}</div>
          <div class="stack-caption"><span>Each finished phase loads one container.</span><span>${d} / ${PHASES.length} loaded</span></div>
        </div>
      </section>

      <h2 class="section-title">The phases</h2>
      <p class="section-sub">Go in order. Every phase builds on the one before it, and each one ends with an exercise and a short quiz.</p>
      <div class="phase-list">${cards}</div>

      <h2 class="section-title">Before you start</h2>
      <div class="cols">
        <div class="panel">
          <h3>What you need</h3>
          <ul>
            <li><b>Docker Desktop</b> installed and running (it should say "Engine running").</li>
            <li>A terminal. The commands are written for <b>Windows PowerShell</b>.</li>
            <li>A code editor, such as VS Code.</li>
            <li>For Phases 2 to 6: the <a href="#sample-app">sample task board app</a>.</li>
          </ul>
        </div>
        <div class="panel">
          <h3>On macOS or Linux?</h3>
          <ul>
            <li>All <code>docker</code> commands are the same.</li>
            <li>Use <code>$(pwd)</code> where the guide says <code>\${PWD}</code>.</li>
            <li>End a continued line with <code>\\</code> instead of a backtick.</li>
            <li>Use <code>~/docker-learning</code> where the guide says <code>$HOME\\docker-learning</code>.</li>
          </ul>
        </div>
        <div class="panel">
          <h3>How each phase works</h3>
          <ol>
            <li>The idea, with a real-life comparison</li>
            <li>Commands and flags, explained in tables</li>
            <li>A step-by-step example to run</li>
            <li>Common mistakes and their fixes</li>
            <li>An exercise and a self-check quiz</li>
          </ol>
        </div>
      </div>

      <h2 class="section-title">Reference</h2>
      <div class="ref-links">
        <a href="#sample-app"><b>Sample app</b><small>Source of the task board used in Phases 2–6</small></a>
        <a href="#cheat-sheet"><b>Cheat sheet</b><small>The commands you will use every day</small></a>
        <a href="#gotchas"><b>Windows gotchas</b><small>Traps on Windows and how to avoid them</small></a>
      </div>
      <p style="margin-top:32px">${d ? '<span id="reset-zone"><button class="reset" id="reset" type="button">Clear my progress</button></span>' : ''}</p>
    `;
    const r = $('#reset');
    if (r) r.addEventListener('click', () => {
      $('#reset-zone').innerHTML = `<span class="confirm">Clear all ${d} completed phases? <button class="btn ghost" id="reset-yes" type="button" style="padding:4px 12px">Yes, clear</button><button class="reset" id="reset-no" type="button">Keep</button></span>`;
      $('#reset-yes').onclick = () => { progress = {}; saveProgress(); route(); };
      $('#reset-no').onclick = () => route();
    });
    $('#toc').innerHTML = '';
  }

  function renderDoc(p, anchor) {
    codeStore = [];
    slug = makeSlugger();
    const body = marked.parse(p.md);
    let head;
    if (p.kind === 'phase') {
      head = `<header class="phase-head">
        <div class="eyebrow"><span class="tag">PHASE ${pad(p.num)}</span><span>${pad(p.num + 1)} of ${PHASES.length}</span></div>
        <h1>${esc(p.title)}</h1>
        ${p.oneLine ? `<p class="lede">${esc(p.oneLine)}</p>` : ''}
        ${p.meta && p.meta.length ? `<div class="meta">${p.meta.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div>` : ''}
      </header>`;
    } else {
      head = `<header class="phase-head"><div class="eyebrow"><span class="tag">REFERENCE</span></div><h1>${esc(p.title)}</h1>${p.oneLine ? `<p class="lede">${esc(p.oneLine)}</p>` : ''}</header>`;
    }
    let tail = '';
    if (p.kind === 'phase') {
      const i = PHASES.indexOf(p);
      const prev = PHASES[i - 1], next = PHASES[i + 1];
      const done = !!progress[p.id];
      tail = `<div class="finish">
          <p>${done ? 'You marked this phase as completed.' : 'Finished the exercise and the quiz? Mark this phase as done.'}</p>
          <button class="btn${done ? ' is-done' : ''}" id="done-btn" type="button">${done ? '✓ Completed' : 'Mark phase as done'}</button>
        </div>
        <nav class="pager">
          ${prev ? `<a href="#${prev.id}"><small>Previous</small><span>${pad(prev.num)} · ${esc(prev.title)}</span></a>` : ''}
          ${next ? `<a class="next" href="#${next.id}"><small>Next</small><span>${pad(next.num)} · ${esc(next.title)}</span></a>` : ''}
        </nav>`;
    }
    $('#page').innerHTML = head + `<article class="prose">${body}</article>` + tail;

    // callout flavours
    document.querySelectorAll('.prose blockquote').forEach(b => {
      const t = b.textContent.trim();
      if (/^(⚠|❌|🔒|🔐)/.test(t)) b.classList.add('warn');
    });
    // copy buttons
    document.querySelectorAll('.copy').forEach(btn => btn.addEventListener('click', () => copy(btn)));
    // done toggle
    const db = $('#done-btn');
    if (db) db.addEventListener('click', () => {
      if (progress[p.id]) delete progress[p.id]; else progress[p.id] = true;
      saveProgress();
      renderNav(p.id);
      const done = !!progress[p.id];
      db.textContent = done ? '✓ Completed' : 'Mark phase as done';
      db.classList.toggle('is-done', done);
      db.previousElementSibling.textContent = done ? 'You marked this phase as completed.' : 'Finished the exercise and the quiz? Mark this phase as done.';
    });
    // table of contents
    const hs = [...document.querySelectorAll('.prose h2')];
    $('#toc').innerHTML = hs.length ? `<div class="toc-title">On this page</div>` + hs.map(h => `<a href="#${p.id}" data-target="${h.id}">${esc(h.textContent)}</a>`).join('') : '';
    document.querySelectorAll('#toc a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); scrollToId(a.dataset.target); }));
    watchToc(hs);
    if (anchor) requestAnimationFrame(() => scrollToId(anchor));
    else window.scrollTo(0, 0);
  }

  let tocObserver;
  function watchToc(hs) {
    if (tocObserver) tocObserver.disconnect();
    if (!('IntersectionObserver' in window) || !hs.length) return;
    tocObserver = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.dataset.target === en.target.id));
        }
      });
    }, { rootMargin: '-70px 0px -70% 0px' });
    hs.forEach(h => tocObserver.observe(h));
  }

  function scrollToId(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ block: 'start' });
  }

  function copy(btn) {
    const text = codeStore[+btn.dataset.code] || '';
    const ok = () => { btn.textContent = 'Copied'; btn.classList.add('copied'); setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1600); };
    const fallback = () => {
      const pre = btn.closest('.code').querySelector('pre');
      const range = document.createRange(); range.selectNodeContents(pre);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.textContent = 'Press Ctrl+C';
    };
    try { navigator.clipboard.writeText(text).then(ok, fallback); } catch (e) { fallback(); }
  }

  /* ---------- router ---------- */
  let pendingAnchor = null;
  function route() {
    const id = (location.hash || '#home').slice(1);
    const p = byId[id] || byId.home;
    renderNav(p.id);
    closeDrawer();
    if (p.kind === 'home') { renderHome(); window.scrollTo(0, 0); }
    else renderDoc(p, pendingAnchor);
    pendingAnchor = null;
    document.title = p.kind === 'home' ? 'Docker by Example' : `${p.short || p.title} · Docker by Example`;
  }
  function go(id, anchor) {
    pendingAnchor = anchor || null;
    if (location.hash.slice(1) === id) route(); else location.hash = id;
  }
  window.addEventListener('hashchange', route);

  /* ---------- drawer ---------- */
  function closeDrawer() { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false'); }
  $('#menu-btn').addEventListener('click', () => {
    const open = !$('#sidebar').classList.contains('open');
    $('#sidebar').classList.toggle('open', open); $('#overlay').classList.toggle('open', open);
    $('#menu-btn').setAttribute('aria-expanded', String(open));
  });
  $('#overlay').addEventListener('click', closeDrawer);

  /* ---------- search ---------- */
  const INDEX = [];
  PAGES.filter(p => p.md).forEach(p => {
    const s = makeSlugger();
    let heading = null, headingText = p.title, inCode = false;
    p.md.split('\n').forEach(line => {
      if (/^```/.test(line)) { inCode = !inCode; return; }
      const h = !inCode && line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { heading = s(h[2]); headingText = h[2].replace(/[`*]/g, ''); INDEX.push({ p, heading, headingText, text: headingText, isHead: true }); return; }
      const t = line.replace(/<[^>]+>/g, '').replace(/[*`]/g, '').replace(/^\s*[|>\-#]+\s*/, '').replace(/\s*\|\s*/g, ' · ').trim();
      if (t.length > 2) INDEX.push({ p, heading, headingText, text: t, isHead: false });
    });
  });
  let hits = [], active = -1;
  const input = $('#search'), box = $('#results');
  function search(q) {
    q = q.trim().toLowerCase();
    if (q.length < 2) { box.hidden = true; return; }
    const seen = new Set();
    hits = [];
    for (const it of INDEX) {
      if (!it.text.toLowerCase().includes(q)) continue;
      const k = it.p.id + '|' + it.heading + '|' + it.text;
      if (seen.has(k)) continue; seen.add(k);
      hits.push(it);
    }
    hits.sort((a, b) => (b.isHead - a.isHead));
    hits = hits.slice(0, 40);
    active = -1;
    if (!hits.length) { box.innerHTML = `<div class="results-empty">No matches for "${esc(q)}". Try a command name like <b>exec</b> or a flag like <b>-p</b>.</div>`; box.hidden = false; return; }
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig');
    box.innerHTML = hits.map((h, i) => {
      let t = h.text;
      const at = t.toLowerCase().indexOf(q);
      if (t.length > 140) { const s = Math.max(0, at - 50); t = (s ? '…' : '') + t.slice(s, s + 140) + '…'; }
      const where = h.p.kind === 'phase' ? `Phase ${pad(h.p.num)} · ${h.headingText}` : `${h.p.title} · ${h.headingText}`;
      return `<button class="result" type="button" data-i="${i}"><div class="result-where">${esc(where)}</div><div class="result-text">${esc(t).replace(re, m => `<mark>${m}</mark>`)}</div></button>`;
    }).join('');
    box.hidden = false;
  }
  function pick(i) {
    const h = hits[i]; if (!h) return;
    box.hidden = true; input.blur();
    go(h.p.id, h.heading);
  }
  input.addEventListener('input', () => search(input.value));
  input.addEventListener('focus', () => { if (input.value.trim().length >= 2) search(input.value); });
  input.addEventListener('keydown', e => {
    const items = box.querySelectorAll('.result');
    if (e.key === 'ArrowDown') { e.preventDefault(); active = Math.min(items.length - 1, active + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); active = Math.max(0, active - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(active < 0 ? 0 : active); return; }
    else if (e.key === 'Escape') { box.hidden = true; input.blur(); return; }
    else return;
    items.forEach((el, i) => el.classList.toggle('active', i === active));
    if (items[active]) items[active].scrollIntoView({ block: 'nearest' });
  });
  box.addEventListener('click', e => { const b = e.target.closest('.result'); if (b) pick(+b.dataset.i); });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) box.hidden = true; });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); input.focus(); }
  });

  route();
})();
</script>

</body></html>
