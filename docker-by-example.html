t`, `none`\n- Built-in **DNS**: reach a container by its name\n- Port publishing (`-p`) vs container-to-container traffic\n- How a container reaches your Windows PC (`host.docker.internal`)\n- `docker network` commands\n\n---\n\n## 1. The idea\n\nEvery container gets its **own private network stack**: its own IP address, its own `localhost`, its own ports.\n\n### Analogy: an office building 🏢\n\n- Each **container** is an **office room** with its own phone.\n- A **Docker network** is an **internal phone system**. Rooms on the same system can call each other by **name** (\"call *db*\").\n- **`-p` (publish)** is giving one room an **outside phone line**, so people from the street (your browser) can call it.\n- Rooms on **different** phone systems cannot call each other at all.\n\n```\n ┌──────────────────── Network \"appnet\" ───────────────────┐\n │                                                          │\n │   ┌───────────┐   http://api:3000   ┌───────────┐        │\n │   │  proxy    │ ──────────────────▶ │   api     │        │\n │   │ (nginx)   │                     │ (node)    │        │\n │   └─────┬─────┘                     └─────┬─────┘        │\n │         │                                 │ db:5432       │\n │         │                           ┌─────▼─────┐        │\n │         │                           │    db     │        │\n │         │                           │(postgres) │        │\n │         │                           └───────────┘        │\n └─────────┼────────────────────────────────────────────────┘\n           │ -p 3104:80   (only proxy has an \"outside line\")\n     Your browser → http://localhost:3104\n```\n\n### ⚠️ The #1 beginner trap: `localhost`\n\nInside a container, **`localhost` = that container itself**. Not your PC. Not other containers.\n\n| From inside container \"api\", you call… | Reaches |\n|----------------------------------------|---------|\n| `localhost:5432` | api container itself (nothing there → connection refused) ❌ |\n| `db:5432` | the \"db\" container (same user-defined network) ✅ |\n| `host.docker.internal:5432` | a Postgres running on your **Windows PC** ✅ |\n\n---\n\n## 2. Network types\n\n| Driver | What it is | Use it when |\n|--------|-----------|-------------|\n| `bridge` (the default one, named `bridge`) | Every container joins it if you don't say otherwise. **No name lookup** — only IPs. | Quick single containers |\n| **user-defined bridge** (`docker network create x`) | Your own private network. **Containers find each other by name.** Isolated from other networks. | ✅ **Almost always** for multi-container apps |\n| `host` | Container uses the host's network directly (no isolation, no `-p` needed). On Docker Desktop it means the Linux VM, not Windows — limited use. | Rare, Linux servers |\n| `none` | No network at all | Jobs that must not have network access |\n\n> Docker Compose (Phase 5) automatically creates a user-defined network for each project. That's why services there can talk by name.\n\n---\n\n## 3. Commands & flags explained\n\n### `docker network` commands\n\n| Command | What it does |\n|---------|--------------|\n| `docker network ls` | List networks (you'll see `bridge`, `host`, `none` + yours) |\n| `docker network create appnet` | Create a user-defined bridge network called \"appnet\" |\n| `docker network create --subnet 10.10.0.0/24 appnet` | …with your own IP range |\n| `docker network inspect appnet` | Details + **which containers are connected** and their IPs |\n| `docker network connect appnet web` | Plug an existing running container into a network (a container can be on several) |\n| `docker network disconnect appnet web` | Unplug it |\n| `docker network rm appnet` | Delete (must have no containers) |\n| `docker network prune` | Delete all unused networks |\n\n### Network-related flags on `docker run`\n\n| Flag | What it does | Example |\n|------|--------------|---------|\n| `--network NAME` | Join this network at start | `--network appnet` |\n| `--network-alias X` | An extra DNS name on that network | `--network-alias database` |\n| `-p H:C` | Publish container port C on PC port H (the \"outside line\") | `-p 3104:80` |\n| `-p 127.0.0.1:H:C` | Publish **only** for your own PC, not your LAN | `-p 127.0.0.1:5433:5432` |\n| `-p H:C/udp` | UDP instead of TCP | `-p 5353:53/udp` |\n| `-P` (capital) | Publish **all** `EXPOSE`d ports on random PC ports | `docker run -P nginx` then `docker port` |\n| `--add-host name:ip` | Add a line to the container's `/etc/hosts` | |\n| `--dns 1.1.1.1` | Use a specific DNS server | |\n\n### `-p` vs no `-p`\n\n| | Needs `-p`? |\n|---|---|\n| Browser on your PC → container | ✅ Yes |\n| Container → container on same network | ❌ No — they talk directly on the **container** port |\n| Container → internet | ❌ No — outgoing works by default |\n\n---\n\n## 4. Hands-on, step by step\n\n```powershell\nmkdir $HOME\\docker-learning\\phase4; cd $HOME\\docker-learning\\phase4\n```\n\n### Example 1 — The default bridge has no names\n\n```powershell\ndocker run -d --name r1 redis:7-alpine\ndocker run --rm redis:7-alpine redis-cli -h r1 PING\n# Could not connect to Redis at r1:6379: Name has no usable address   ❌\ndocker rm -f -v r1\n```\nBoth containers were on the default `bridge` network — it has **no DNS**.\n\n### Example 2 — A user-defined network: names work\n\n```powershell\ndocker network create appnet\ndocker run -d --name cache --network appnet redis:7-alpine\ndocker run --rm --network appnet redis:7-alpine redis-cli -h cache PING\n# PONG   ✅\n```\n- `--network appnet` → join \"appnet\"\n- `redis-cli -h cache PING` → connect to host **\"cache\"** (the container name) and send PING\n\nSee the DNS lookup:\n```powershell\ndocker run --rm --network appnet alpine:3.20 nslookup cache\n# Name:    cache\n# Address: 172.28.0.2      (your IP may differ)\n```\nDocker runs a small DNS server (at `127.0.0.11` inside each container) that turns container names into IPs.\n\nSee who is on the network:\n```powershell\ndocker network inspect appnet --format '{{range .Containers}}{{.Name}} {{.IPv4Address}}{{println}}{{end}}'\n```\n\n### Example 3 — Isolation between networks\n\n```powershell\ndocker network create othernet\ndocker run --rm --network othernet redis:7-alpine redis-cli -h cache PING\n# Could not connect to Redis at cache:6379: Name has no usable address   ❌  — different network, can't see \"cache\"\n```\nThis is a security feature: e.g. put your database on a \"backend\" network only the API can reach.\n\n### Example 4 — Container → your Windows PC\n\nStart the task board app on Windows (outside Docker):\n```powershell\nnpm --prefix $HOME\\docker-learning\\taskboard start      # listens on http://localhost:3000 on Windows\n```\nIn another terminal:\n```powershell\ndocker run --rm alpine:3.20 sh -c \"apk add -q curl && curl -s http://host.docker.internal:3000/api/health\"\n```\n- `host.docker.internal` is a special name Docker Desktop provides = **your Windows PC**.\n- Useful when the container must reach something you run locally (a DB, an API you are debugging).\n\n### Example 5 (= Exercise) — Reverse proxy: only one container is public\n\nGoal: the browser talks to **nginx** on port 3104; nginx forwards to the **taskboard** container, which has **no** published port.\n\n1. Build the app image (from Phase 2):\n   ```powershell\n   docker build -t taskboard:step4 $HOME\\docker-learning\\taskboard\n   ```\n2. Create `$HOME\\docker-learning\\phase4\\nginx.conf`:\n   ```nginx\n   server {\n     listen 80;\n     location / {\n       proxy_pass http://taskboard:3000;      # container NAME : CONTAINER port\n       proxy_set_header Host $host;\n     }\n   }\n   ```\n3. Run both on `appnet`:\n   ```powershell\n   docker run -d --name taskboard --network appnet taskboard:step4\n   docker run -d --name proxy --network appnet -p 3104:80 `\n     -v ${PWD}\\nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:1.27-alpine\n   ```\n   - `taskboard` → **no `-p`**. Not reachable from your browser directly.\n   - `proxy` → `-p 3104:80`, the only public entry.\n   - `-v ...nginx.conf:/etc/nginx/conf.d/default.conf:ro` → replace nginx's default site config with ours (bind mount from Phase 3).\n4. Open http://localhost:3104 → task board ✅. Try http://localhost:3000 → nothing ❌ (good!).\n\nCheck logs if it fails:\n```powershell\ndocker ps -a           # proxy shows \"Exited (1)\" a few seconds after starting\ndocker logs proxy      # [emerg] host not found in upstream \"taskboard\" → not on the same network / wrong name\n```\n\n### Clean up\n```powershell\ndocker rm -f -v cache proxy taskboard      # -v: redis declares a VOLUME, remove its anonymous volume too\ndocker network rm appnet othernet\n```\n\n**Real results from a test run:** the default bridge could not resolve `r1`; on `appnet` the name `cache` resolved through Docker's DNS server `127.0.0.11` and answered `PONG`; `othernet` could not see it; a container reached the Windows app via `host.docker.internal:3000` while `localhost:3000` failed; the proxy served the task board on 3104 while the app itself had no published port; and with two networks, `proxy` got `bad address 'db'` while `taskboard` reached `db:5432`.\n\n---\n\n## 5. Common mistakes\n\n| Problem | Cause | Fix |\n|---------|-------|-----|\n| App in container can't reach DB at `localhost` | `localhost` = the app container itself | Use the DB **container name** (`db`) |\n| `Name has no usable address` (or `bad address`) | Containers on default `bridge`, or on different networks | `docker network create` + `--network` for both |\n| Using the **PC port** between containers (`db:5433`) | `-p 5433:5432` is only for the outside; inside the network it's still 5432 | Use the **container** port: `db:5432` |\n| App listens on `127.0.0.1` inside container | Unreachable via `-p` and from other containers | Make it listen on `0.0.0.0` |\n| `port is already allocated` | Two containers want the same **PC** port | Change the left side of `-p` |\n| Database published on `0.0.0.0` | Anyone on your Wi-Fi can try to connect | `-p 127.0.0.1:5433:5432` or don't publish at all |\n\n---\n\n## 6. Exercise\n\n1. Do Example 5 yourself without looking.\n2. Create **two** networks: `frontnet` (proxy + taskboard) and `backnet` (taskboard + a postgres `db`). Connect taskboard to both using `docker network connect backnet taskboard`. Prove that `proxy` **cannot** reach `db`:\n   `docker exec proxy ping -c 1 -W 2 db` → should fail (`bad address 'db'`).\n   `docker exec taskboard ping -c 1 -W 2 db` → should succeed.\n3. Run `docker run -d -P --name randomport nginx:1.27-alpine`, then find which PC port it got with `docker port randomport`.\n\n---\n\n## 7. Check yourself ✅\n\n1. Inside a container, what does `localhost` mean?\n2. Why does name lookup fail on the default `bridge` network?\n3. Container `api` needs Postgres in container `db` started with `-p 5433:5432`. What host:port should `api` use?\n4. How does a container reach a server on your Windows PC?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. The container itself.\n2. The default bridge has no built-in DNS; only user-defined networks do.\n3. `db:5432` (container name + container port; `5433` is only for the PC).\n4. `host.docker.internal:\u003cport>`.\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker network create NET   ·  docker network ls  ·  docker network inspect NET  ·  docker network rm NET\ndocker run -d --name X --network NET IMAGE      # join a network\ndocker network connect NET CONTAINER            # add a running container to a network\ndocker run -p 127.0.0.1:H:C IMAGE               # publish only to your PC\ndocker port CONTAINER                           # show port mappings\n```"},{"id":"phase-05","kind":"phase","num":5,"title":"Docker Compose: The Whole App in One File","short":"Docker Compose","oneLine":"Instead of typing many long docker run commands, describe all your containers in one YAML file and start everything with docker compose up.","meta":["Time: ~2 hours","Work folder: $HOME\\docker-learning\\phase5","Uses $HOME\\docker-learning\\taskboard"],"time":"~2 hours","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## What you will learn\n\n- Why Compose exists\n- YAML basics (just enough)\n- Every important key in `compose.yml`: `services`, `image`, `build`, `ports`, `environment`, `env_file`, `volumes`, `networks`, `depends_on`, `healthcheck`, `restart`, `command`\n- The `.env` file and `${VARIABLE}` substitution\n- Every important `docker compose` command and flag\n\n---\n\n## 1. The idea\n\nIn Phase 4 you ran a proxy + app. That took a network command and two long `docker run` commands. A real app (frontend + API + database + cache) would need 5+ commands with 10 flags each. Hard to remember, easy to get wrong.\n\n**Compose = a written plan for the whole app.**\n\n### Analogy: a restaurant order ticket 🧾\n\nInstead of telling the kitchen dish by dish (\"now make the soup… now the rice… now…\"), you hand over **one ticket** listing every dish. The kitchen prepares all of them, in the right order.\n\n`compose.yml` is that ticket. `docker compose up` hands it over.\n\n### `docker run` vs Compose — the same thing\n\n```powershell\ndocker network create phase5_default\ndocker volume create phase5_pgdata\ndocker run -d --name db --network phase5_default -e POSTGRES_PASSWORD=dev `\n  -v phase5_pgdata:/var/lib/postgresql/data postgres:17-alpine\n```\n⬇ becomes ⬇\n```yaml\nservices:\n  db:\n    image: postgres:17-alpine\n    environment:\n      POSTGRES_PASSWORD: dev\n    volumes:\n      - pgdata:/var/lib/postgresql/data\nvolumes:\n  pgdata:\n```\n\nWhat Compose does for you automatically:\n- Creates a **network** for the project (named `\u003cfolder>_default`) → all services find each other **by service name**.\n- Creates **volumes** you list.\n- Names containers `\u003cproject>-\u003cservice>-1`.\n- Starts services in the right order (`depends_on`).\n\n> The modern command is `docker compose` (with a space, built into Docker). The old `docker-compose` (with a dash) is retired. The file can be named `compose.yml` (preferred) or `docker-compose.yml`.\n\n---\n\n## 2. YAML in 2 minutes\n\n```yaml\nkey: value              # a setting\nparent:                 # a group — children are indented with SPACES (never tabs!)\n  child: value\nlist:                   # a list — each item starts with \"- \"\n  - first\n  - second\ninline_list: [\"a\", \"b\"] # same as above, on one line\nnumber_as_text: \"3100:3000\"   # quote values with \":\" to be safe\n# this is a comment\n```\n⚠️ Indentation **is** the structure. One wrong space = error or wrong meaning.\n\n---\n\n## 3. `compose.yml` keys explained\n\n### Top level\n```yaml\nname: taskboard        # optional: project name (default = folder name)\nservices:              # the containers\nvolumes:               # named volumes\nnetworks:              # custom networks (optional — a default one is made)\n```\n\n### Inside a service\n\n| Key | What it does | `docker run` equivalent |\n|-----|--------------|------------------------|\n| `image: postgres:17-alpine` | Use this image (pull if needed) | the IMAGE argument |\n| `build: ./api` | Build an image from the Dockerfile in this folder | `docker build ./api` |\n| `build: { context: ., dockerfile: Dockerfile.dev, target: dev, args: {X: 1} }` | Long build form | `-f`, `--target`, `--build-arg` |\n| `container_name: db` | Fixed container name (optional; stops you running 2 copies) | `--name` |\n| `ports: [\"3100:3000\"]` | Publish ports (HOST:CONTAINER) | `-p` |\n| `expose: [\"3000\"]` | Document a port for other services (no publishing) | `EXPOSE` |\n| `environment:` | Env variables (map or list) | `-e` |\n| `env_file: .env.api` | Load env vars from a file | `--env-file` |\n| `volumes:` | Named volumes or bind mounts | `-v` |\n| `networks: [backend]` | Which networks to join | `--network` |\n| `depends_on:` | Start order (and optionally wait for healthy) | — |\n| `healthcheck:` | Health check command | `--health-cmd` / Dockerfile `HEALTHCHECK` |\n| `restart: unless-stopped` | Restart policy | `--restart` |\n| `command: [\"npm\",\"run\",\"dev\"]` | Replace the image's `CMD` | args after image |\n| `entrypoint:` | Replace `ENTRYPOINT` | `--entrypoint` |\n| `working_dir: /app` | Working folder | `-w` |\n| `user: \"1000:1000\"` | Run as this user | `-u` |\n| `profiles: [\"tools\"]` | Only start with `--profile tools` (Phase 6) | — |\n\n### `depends_on` — start order\n\n```yaml\napi:\n  depends_on:\n    db:\n      condition: service_healthy     # wait until db's healthcheck passes\n```\n\n| Condition | Waits until… |\n|-----------|-------------|\n| `service_started` (default, short form `depends_on: [db]`) | the db **container** started — but Postgres may still be booting! ⚠️ |\n| `service_healthy` | the db **healthcheck** says healthy ✅ (needs a `healthcheck`) |\n| `service_completed_successfully` | a one-time job (like migrations) finished with exit code 0 |\n\n### `healthcheck`\n```yaml\nhealthcheck:\n  test: [\"CMD-SHELL\", \"pg_isready -U app -d tasks\"]\n  interval: 5s       # check every 5 s\n  timeout: 3s        # one check may take max 3 s\n  retries: 10        # 10 failures → unhealthy\n  start_period: 10s  # grace time at startup\n```\n- `[\"CMD\", \"prog\", \"arg\"]` → run the program directly\n- `[\"CMD-SHELL\", \"text\"]` → run through `sh` (allows `||`, `&&`, `$VAR`)\n\n### Volumes in Compose\n```yaml\nservices:\n  db:\n    volumes:\n      - pgdata:/var/lib/postgresql/data          # named volume (declared below)\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # bind mount (path starts with ./)\nvolumes:\n  pgdata:            # declare named volumes here (empty = default settings)\n```\n- Relative paths (`./`) are relative to the **compose file's folder** — no `${PWD}` needed. 🎉\n\n---\n\n## 4. The `.env` file and `${VARIABLES}`\n\nCompose automatically reads a file named **`.env`** in the same folder and substitutes `${NAME}` in `compose.yml`.\n\n`.env`\n```ini\nDB_PASSWORD=devpassword\nAPI_PORT=3100\n```\n`compose.yml`\n```yaml\nports:\n  - \"${API_PORT}:3000\"\nenvironment:\n  POSTGRES_PASSWORD: ${DB_PASSWORD}\n```\n\n| Syntax | Meaning |\n|--------|---------|\n| `${VAR}` | value of VAR |\n| `${VAR:-3100}` | VAR, or `3100` if it's empty/unset (default) |\n| `${VAR:?must set VAR}` | error out with this message if missing |\n\n⚠️ Two different things with similar names:\n- **`.env`** → used by **Compose itself** to fill `${...}` in the YAML.\n- **`env_file:`** → variables passed **into the container**.\n\n🔒 Add `.env` to `.gitignore`. Commit a `.env.example` with fake values instead.\n\nSee the final result after substitution:\n```powershell\ndocker compose config      # prints the fully resolved file — great for debugging\n```\n\n---\n\n## 5. `docker compose` commands explained\n\nRun them in the folder with `compose.yml` (or use `-f path\\compose.yml`).\n\n| Command | What it does |\n|---------|--------------|\n| `docker compose up` | Create network/volumes, build/pull images, start all services, **show logs** (Ctrl+C stops them) |\n| `docker compose up -d` | Same, in the **background** (`-d` = detached) |\n| `docker compose up -d --build` | **Rebuild** images first (use after changing code/Dockerfile) |\n| `docker compose up -d --wait` | Start in the background and **wait until all services are running/healthy** (great in scripts) |\n| `docker compose up -d api` | Start only `api` (and what it depends on) |\n| `docker compose up -d --force-recreate` | Recreate containers even if nothing changed |\n| `docker compose ps` | Status of this project's containers (incl. `healthy`) |\n| `docker compose logs` | Logs of all services, colour-coded |\n| `docker compose logs -f api` | Follow logs of `api` only |\n| `docker compose logs --tail 50` | Last 50 lines each |\n| `docker compose exec db psql -U app` | Run a command in a **running** service container (has `-it` by default) |\n| `docker compose run --rm api npm test` | Start a **new, one-off** container of `api` and run a command |\n| `docker compose stop` | Stop containers (keep them) |\n| `docker compose start` | Start stopped containers |\n| `docker compose restart api` | Restart one service |\n| `docker compose down` | Stop **and remove** containers + network. **Volumes are kept.** |\n| `docker compose down -v` | …also remove **volumes** ⚠️ deletes DB data |\n| `docker compose down --rmi local` | …also remove images built by this file |\n| `docker compose build` | Only build images |\n| `docker compose pull` | Only pull images |\n| `docker compose config` | Show the final merged/resolved file |\n| `docker compose top` | Processes in each container |\n\nGlobal flags (go **before** the sub-command):\n\n| Flag | Meaning |\n|------|---------|\n| `-f file.yml` | Use this file (repeat to merge several) |\n| `-p name` | Project name (default: folder name) |\n| `--profile x` | Enable services in profile x |\n| `--env-file other.env` | Use another file instead of `.env` |\n\n---\n\n## 6. Hands-on: task board + Postgres + Adminer\n\n```powershell\nmkdir $HOME\\docker-learning\\phase5; cd $HOME\\docker-learning\\phase5\n```\n\n### Step 1 — Create the files\n\n**`.env`**\n```ini\nDB_PASSWORD=devpassword\n```\n\n**`init.sql`** — the postgres image runs any `.sql` in `/docker-entrypoint-initdb.d/` the **first time** the volume is empty:\n```sql\nCREATE TABLE tasks (\n  id    serial PRIMARY KEY,\n  title text   NOT NULL,\n  done  boolean DEFAULT false\n);\nINSERT INTO tasks (title) VALUES ('Learn Docker Compose');\n```\n\n**`compose.yml`**\n```yaml\nservices:\n  api:\n    build: ../taskboard          # Dockerfile of the task board\n    ports:\n      - \"3100:3000\"                        # browser → localhost:3100\n    environment:\n      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/tasks   # \"db\" = service name!\n    depends_on:\n      db:\n        condition: service_healthy         # wait for Postgres to be ready\n    restart: unless-stopped\n\n  db:\n    image: postgres:17-alpine\n    environment:\n      POSTGRES_USER: app\n      POSTGRES_PASSWORD: ${DB_PASSWORD}    # from .env\n      POSTGRES_DB: tasks\n    volumes:\n      - pgdata:/var/lib/postgresql/data    # keep data\n      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app -d tasks\"]\n      interval: 5s\n      timeout: 3s\n      retries: 10\n    # no \"ports:\" → db is NOT reachable from your PC, only from api/adminer\n\n  adminer:                                  # a small web UI for databases\n    image: adminer:4\n    ports:\n      - \"5050:8080\"\n    depends_on: [db]\n\nvolumes:\n  pgdata:\n```\n\n### Step 2 — Check and start\n\n```powershell\ndocker compose config          # see ${DB_PASSWORD} replaced — catches YAML mistakes early\ndocker compose up -d --build\ndocker compose ps\n```\nExpected order: `db` starts → becomes `(healthy)` → then `api` starts.\n\n```\nNAME               SERVICE   STATUS                    PORTS\nphase5-adminer-1   adminer   Up 10 seconds             0.0.0.0:5050->8080/tcp\nphase5-api-1       api       Up 4 seconds (healthy)    0.0.0.0:3100->3000/tcp\nphase5-db-1        db        Up 10 seconds (healthy)   5432/tcp\n```\nNote `db` shows `5432/tcp` with **no** `0.0.0.0:` → not published.\n\nRight after `up`, `api` may show `(health: starting)` for a few seconds. To make the command wait until everything is healthy, add `--wait`:\n```powershell\ndocker compose up -d --build --wait\n```\n\n### Step 3 — Use it\n\n- Task board: http://localhost:3100\n  > The task board still shows its **3 built-in example tasks**, not the `Learn Docker Compose` row. That's expected: the app keeps tasks in memory and doesn't read `DATABASE_URL` yet. Making it use Postgres is the exercise in section 8. For now, look at the database with Adminer or `psql`.\n- Adminer: http://localhost:5050 → System **PostgreSQL**, Server **db**, User **app**, Password **devpassword**, Database **tasks**.\n  (Server is `db` because Adminer runs *inside* the network!)\n\nFrom the command line:\n```powershell\ndocker compose exec db psql -U app -d tasks -c \"SELECT * FROM tasks;\"\ndocker compose logs -f api            # Ctrl+C to stop watching\n```\n\n### Step 4 — Prove data survives\n\n```powershell\ndocker compose exec db psql -U app -d tasks -c \"INSERT INTO tasks (title) VALUES ('Survive down/up');\"\ndocker compose down                   # containers + network removed, volume kept\ndocker compose up -d\ndocker compose exec db psql -U app -d tasks -c \"SELECT * FROM tasks;\"   # both rows ✅\n```\n\n### Step 5 — Reset everything\n\n```powershell\ndocker compose down -v                # -v also deletes pgdata → init.sql will run again next time\n```\n\n**Real results from a test run:** first `up --build` took 33 s; Compose created `phase5_default` and `phase5_pgdata`, waited for `db` to be **Healthy**, then started `api`. Adminer logged in with server `db`. After `down` the volume `phase5_pgdata` was still there and both rows came back after `up`; `down -v` removed it.\n\n---\n\n## 7. Common mistakes\n\n| Problem | Cause | Fix |\n|---------|-------|-----|\n| `api` crashes: `ECONNREFUSED db:5432` at start | Postgres not ready yet | `depends_on` with `condition: service_healthy` + a healthcheck |\n| `api` can't connect to `localhost:5432` | localhost = api container | Use the **service name** `db` |\n| `init.sql` didn't run | It only runs when the data volume is **empty** | `docker compose down -v` then `up` |\n| Code changed but app shows old version | Image not rebuilt | `docker compose up -d --build` |\n| `yaml: line 7: did not find expected key` | Bad indentation / tabs | Use 2 spaces; check with `docker compose config` |\n| `${DB_PASSWORD}` is empty, warning \"variable is not set\" | `.env` missing, misnamed, or in another folder | Put `.env` next to `compose.yml` |\n| Committed `.env` with real passwords | Secret leak | `.gitignore` it; commit `.env.example` |\n| `docker compose down -v` by habit | Lost all DB data | Use plain `down` unless you want a reset |\n\n---\n\n## 8. Exercise\n\nMake the task board **really** use Postgres:\n\n1. In `$HOME\\docker-learning\\taskboard` run `npm install pg`.\n2. In `src/server.js`, create a `pg.Pool({ connectionString: process.env.DATABASE_URL })` and change the tasks API to `SELECT/INSERT/UPDATE/DELETE` from the `tasks` table instead of the in-memory array.\n3. `docker compose up -d --build`\n4. Add tasks in the browser → `docker compose down` → `docker compose up -d` → tasks are still there.\n5. Bonus: add a `redis:7-alpine` service named `cache` and count page views with it.\n\n---\n\n## 9. Check yourself ✅\n\n1. What does Compose create automatically that you had to create by hand in Phase 4?\n2. Difference between `docker compose down` and `docker compose down -v`?\n3. Difference between `docker compose exec` and `docker compose run`?\n4. Why use `condition: service_healthy` instead of just `depends_on: [db]`?\n5. `.env` vs `env_file:` — which one goes into the container?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. A network (with DNS by service name), named volumes, container names.\n2. `-v` also deletes the named volumes (your data).\n3. `exec` runs in an already-running container; `run` starts a new one-off container.\n4. \"Started\" ≠ \"ready\". Healthy means Postgres actually accepts connections.\n5. `env_file:` goes into the container. `.env` only fills `${...}` in the YAML.\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker compose config            # validate + show final file\ndocker compose up -d --build     # build & start everything in background\ndocker compose ps                # status\ndocker compose logs -f SERVICE   # follow logs\ndocker compose exec SERVICE sh   # shell into a running service\ndocker compose run --rm SERVICE CMD   # one-off command\ndocker compose down              # stop & remove (keep volumes)\ndocker compose down -v           # …and delete volumes\n```"},{"id":"phase-06","kind":"phase","num":6,"title":"Daily Development with Compose","short":"Dev workflow","oneLine":"Edit code on Windows → see the change in the running container within seconds, without rebuilding by hand.","meta":["Time: ~1 hour","Continue in $HOME\\docker-learning\\phase5 (or $HOME\\docker-learning\\taskboard, which already has docker-compose.dev.yml)"],"time":"~1 hour","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## What you will learn\n\n- Why a plain bind mount often does **not** live-reload on Windows\n- `develop.watch` and its 3 actions: `sync`, `sync+restart`, `rebuild`\n- `docker compose watch`\n- **Override files**: one base file + dev changes on top\n- **Profiles**: optional services (tools, tests)\n- **Multi-target Dockerfile**: a `dev` image and a `prod` image from one file\n\n---\n\n## 1. The idea: a fast feedback loop\n\nWithout help, every code change means:\n`edit → docker compose up -d --build → wait 20 s → refresh`. 😩 Too slow.\n\nWhat we want:\n`edit → save → refresh` (1–2 seconds). 😄\n\n### Two ways to get changes into a container\n\n| Method | How | Problem on Windows |\n|--------|-----|-------------------|\n| **Bind mount** + file watcher (`nodemon`, `node --watch`) | Container sees your Windows folder directly | File-change events from Windows often **don't reach** the Linux VM → the watcher never notices. Also slow for big folders. |\n| **`develop.watch`** (Compose) ✅ | Compose watches files **on Windows**, **copies** changed files into the container, and optionally restarts/rebuilds | Works on every OS |\n\n---\n\n## 2. `develop.watch` explained\n\n```yaml\nservices:\n  api:\n    build: .\n    develop:\n      watch:\n        - action: sync+restart\n          path: ./src\n          target: /app/src\n        - action: sync\n          path: ./public\n          target: /app/public\n        - action: rebuild\n          path: package.json\n          ignore:\n            - node_modules/\n```\n\n| Key | Meaning |\n|-----|---------|\n| `path` | Folder/file **on your PC** to watch (relative to the compose file) |\n| `target` | Where to copy it **inside the container** (needed for `sync` actions) |\n| `ignore` | Patterns to skip |\n| `action` | What to do when something changes 👇 |\n\n| Action | What happens | Use for |\n|--------|-------------|---------|\n| `sync` | Copy the changed file into the container. Nothing else. | Static files (HTML/CSS), or apps that hot-reload by themselves (Vite, Angular dev server) |\n| `sync+restart` | Copy, then **restart** the container | Server code (Node/Express) without its own reloader |\n| `rebuild` | Rebuild the image and replace the container | Dependency files (`package.json`, `requirements.txt`), Dockerfile |\n\nStart it:\n```powershell\ndocker compose watch          # start services + watch (logs of watch actions shown)\n# or\ndocker compose up --watch     # start + show service logs + watch\n```\nStop with **Ctrl + C**.\n\n> 💡 In our test, `sync` worked even though the task board image runs as `USER node` and its files belong to root. Compose copies the files in for you, and the app only needs to **read** them. If a sync ever fails with `permission denied`, give the folder to the app user in the Dockerfile: `COPY --chown=node:node src ./src`.\n\n---\n\n## 3. Override files — base + changes\n\nKeep **one** base `compose.yml` that is \"production-like\", and put dev-only changes in another file.\n\n```\ncompose.yml             ← base: images, ports, db, volumes\ncompose.override.yml    ← dev extras: watch, debug env, extra tools\n```\n\n- `docker compose up` **automatically** loads `compose.yml` **+** `compose.override.yml` (if it exists) and merges them.\n- To ignore the override: `docker compose -f compose.yml up`\n- To pick files yourself: `docker compose -f compose.yml -f compose.prod.yml up` (later files win)\n\n**How merging works:**\n\n| Type of key | Merge rule |\n|-------------|-----------|\n| Single values (`image`, `command`, `restart`) | Later file **replaces** |\n| Maps (`environment`, `labels`) | **Combined**; same key → later wins |\n| Lists (`ports`, `volumes`) | **Combined** |\n\nCheck the result: `docker compose config`\n\n> `$HOME\\docker-learning\\taskboard` uses the name `docker-compose.dev.yml` instead, so there you must pass both files:\n> `docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --watch`\n\n---\n\n## 4. Profiles — optional services\n\nSome services you only want sometimes (a mail catcher, a DB admin UI, tests).\n\n```yaml\nservices:\n  mailhog:\n    image: mailhog/mailhog\n    ports: [\"3125:8025\"]\n    profiles: [\"tools\"]        # NOT started by a plain \"up\"\n  test:\n    build: .\n    command: [\"npm\", \"test\"]\n    profiles: [\"test\"]\n```\n\n| Command | Starts |\n|---------|--------|\n| `docker compose up -d` | Only services **without** a profile |\n| `docker compose --profile tools up -d` | Normal services + `tools` ones |\n| `docker compose --profile test run --rm test` | Runs the test container once and removes it |\n| `docker compose up -d mailhog` | Naming a service directly also starts it |\n\n---\n\n## 5. Multi-target Dockerfile — dev and prod from one file\n\nA **stage** is a section that starts with `FROM ... AS name`. You can build up to a chosen stage with `--target` (or `build.target` in Compose). (Phase 7 goes deeper.)\n\n```dockerfile\nFROM node:22-alpine AS base\nWORKDIR /app\nCOPY package*.json ./\n\n# ---- dev: all deps, auto-reload, runs as root for simplicity\nFROM base AS dev\nRUN npm ci\nCOPY . .\nCMD [\"npm\", \"run\", \"dev\"]\n\n# ---- prod: only prod deps, non-root\nFROM base AS prod\nENV NODE_ENV=production\nRUN npm ci --omit=dev\nCOPY --chown=node:node src ./src\nCOPY --chown=node:node public ./public\nUSER node\nCMD [\"node\", \"src/server.js\"]\n```\n\n`compose.override.yml`:\n```yaml\nservices:\n  api:\n    build:\n      context: ../taskboard\n      target: dev                 # use the dev stage\n    environment:\n      NODE_ENV: development\n    develop:\n      watch:\n        - action: sync+restart\n          path: ../taskboard/src\n          target: /app/src\n        - action: rebuild\n          path: ../taskboard/package.json\n```\nThe base `compose.yml` uses `target: prod` (or no target = last stage).\n\nCheck what each target gives you:\n```powershell\ndocker build --target dev  -t app:dev .\ndocker build --target prod -t app:prod .\ndocker run --rm app:dev whoami     # → root\ndocker run --rm app:prod whoami    # → node\n```\n> In the `dev` stage, `npm` is PID 1 and node runs as its child. That's fine while developing, but it has the same signal problem as shell-form `CMD` (Phase 2), which is one more reason the `prod` stage starts `node` directly.\n\n---\n\n## 6. Hands-on, step by step\n\n### Option A — Use the ready-made setup in taskboard\n\n```powershell\ncd $HOME\\docker-learning\\taskboard\ndocker compose -f docker-compose.yml -f docker-compose.dev.yml up --build --watch\n```\n- `-f a -f b` → merge base + dev file\n- `--build` → build the image first\n- `--watch` → turn on `develop.watch`\n\nNow:\n1. Open http://localhost:3100\n2. Edit `src/server.js` (e.g. change a text in a response) and save.\n3. In the terminal you'll see (the service in this project is called `web`):\n   ```\n   Container taskboard Restarting\n   taskboard  | SIGTERM received, shutting down...\n   ⦿ service(s) [\"web\"] restarted\n   taskboard  | Task Board (Docker dev) listening on http://0.0.0.0:3000 (pid 1)\n   ```\n4. Refresh the browser → change is there. ✅\n5. Edit `public/index.html` → `⦿ Syncing service \"web\" after 1 changes were detected`, **no restart**; refresh → changed.\n6. Edit `package.json` → `⦿ Rebuilding service(s) [\"web\"]`, then the container is recreated.\n\n**Real timings from a test run:** code change live after **~3 s** (with a clean restart, exit code 0); HTML change live with **no restart** (uptime kept counting); `package.json` change rebuilt and recreated the container in **~14 s**.\n\nCtrl + C to stop, then `docker compose -f docker-compose.yml -f docker-compose.dev.yml down`.\n\n### Option B — Add a profile to your Phase 5 project\n\nIn `$HOME\\docker-learning\\phase5\\compose.yml` add:\n```yaml\n  mailhog:\n    image: mailhog/mailhog\n    ports: [\"3125:8025\"]\n    profiles: [\"tools\"]\n```\n```powershell\ncd $HOME\\docker-learning\\phase5\ndocker compose up -d                    # mailhog NOT started\ndocker compose ps\ndocker compose --profile tools up -d    # now it starts → http://localhost:3125\ndocker compose --profile tools down\n```\n> ⚠️ A plain `docker compose down` does **not** stop services that belong to a profile: in our test `mailhog` was still running afterwards. Pass the same `--profile` to `down` that you used for `up`.\n\n---\n\n## 7. Common mistakes\n\n| Problem | Cause | Fix |\n|---------|-------|-----|\n| Edited file, nothing happens | Using bind mount + `node --watch` on Windows | Use `develop.watch` |\n| `watch` says \"no services have develop config\" | No `develop:` section, or override file not loaded | Check `docker compose config` |\n| `sync` fails: permission denied | Container user can't write to target | `COPY --chown=node:node …` in Dockerfile |\n| Override applied in production by accident | `compose.override.yml` is auto-loaded | In prod use `-f compose.yml` explicitly (or `-f compose.yml -f compose.prod.yml`) |\n| Profile service never starts | Forgot `--profile` | `docker compose --profile tools up -d` |\n| Profile service still running after `down` | `down` without `--profile` ignores profile services | `docker compose --profile tools down` |\n| Changes to `package.json` don't apply | `sync` only copies; deps need a rebuild | Use `action: rebuild` for dependency files |\n\n---\n\n## 8. Exercise\n\n1. Convert `$HOME\\docker-learning\\taskboard\\Dockerfile` into a **multi-target** file with `dev` and `prod` stages (section 5).\n2. Make `docker compose up --watch` use `target: dev`, and `docker compose -f docker-compose.yml up` use `prod`.\n3. Add a `test` service (profile `test`) that runs `npm test`. (Add a tiny test first, e.g. with Node's built-in `node --test`.) Run it with:\n   `docker compose --profile test run --rm test` — check `$LASTEXITCODE` is `0`.\n\n---\n\n## 9. Check yourself ✅\n\n1. Why doesn't `node --watch` with a bind mount reload on Docker Desktop for Windows?\n2. Which `develop.watch` action would you use for: (a) a `.css` file, (b) `server.js`, (c) `package.json`?\n3. Which file does `docker compose up` load automatically besides `compose.yml`?\n4. How do you start a service that has `profiles: [\"tools\"]`?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. File-change events from the Windows filesystem often don't reach the Linux VM, so the watcher inside never sees a change.\n2. (a) `sync`, (b) `sync+restart`, (c) `rebuild`.\n3. `compose.override.yml`.\n4. `docker compose --profile tools up -d` (or name the service directly).\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker compose watch                              # start + watch files\ndocker compose up --watch                         # same, with service logs\ndocker compose -f compose.yml up -d               # ignore the override file\ndocker compose -f a.yml -f b.yml config           # see merged result\ndocker compose --profile tools up -d              # include optional services\ndocker compose --profile test run --rm test       # run tests once\ndocker build --target dev -t app:dev .            # build a specific stage\n```"},{"id":"phase-07","kind":"phase","num":7,"title":"Production-Grade Images: Small, Safe, Repeatable","short":"Production images","oneLine":"Build with all the tools you need, but ship only what is needed to run — using multi-stage builds, a non-root user, and security scanning.","meta":["Time: ~2 hours","Work folder: $HOME\\docker-learning\\phase7"],"time":"~2 hours","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## What you will learn\n\n- **Multi-stage builds** (`FROM … AS`, `COPY --from`)\n- How to pick a small base image (alpine, slim, distroless)\n- **BuildKit** features: cache mounts, secret mounts\n- Running as **non-root**, read-only filesystem\n- Scanning for vulnerabilities with `docker scout`\n- Building for other CPUs (`--platform`)\n- A production checklist\n\n---\n\n## 1. The idea: the kitchen vs the plate 🍽️\n\nTo cook a meal you need knives, pans, an oven, raw ingredients, a mess on the counter.\nTo **serve** it, the customer only needs **the plate of food**.\n\nA normal Dockerfile ships **the whole kitchen**: compilers, TypeScript, dev dependencies, source files, caches. That means:\n- **Big** images → slow to download and start\n- **More attack surface** → more programs with possible security holes\n- **Leaked stuff** → source code, `.npmrc` tokens, test data\n\n**Multi-stage build:** cook in one stage (the kitchen), then copy **only the plate** into a fresh, clean final stage.\n\n```\n  Stage \"build\"  (big: node + all devDeps + TypeScript)\n  ┌──────────────────────────────┐\n  │ npm ci (all deps)            │\n  │ COPY . .                     │\n  │ npm run build  ──▶ /app/dist │──┐\n  └──────────────────────────────┘  │ COPY --from=build /app/dist\n                                    ▼\n  Stage \"runtime\"  (small: node + prod deps + dist only)\n  ┌──────────────────────────────┐\n  │ npm ci --omit=dev            │\n  │ /app/dist                    │   ← only this stage becomes the final image\n  └──────────────────────────────┘\n```\n\nEarlier stages are **thrown away**. They are not in the final image.\n\n---\n\n## 2. Multi-stage syntax explained\n\n```dockerfile\nFROM node:22-alpine AS build     # \"AS build\" gives the stage a name\n...\nFROM node:22-alpine AS runtime   # a new FROM = a new, empty stage\nCOPY --from=build /app/dist ./dist\n```\n\n| Part | Meaning |\n|------|---------|\n| `FROM image AS name` | Start a new stage called `name` |\n| `COPY --from=name SRC DEST` | Copy files **from another stage** (not from your PC) |\n| `COPY --from=nginx:1.27-alpine /etc/nginx/nginx.conf .` | You can even copy from any **image** |\n| `FROM build AS test` | A stage can start **from a previous stage** |\n| `docker build --target build .` | Stop after the `build` stage (for debugging / dev) |\n\nThe **last** stage in the file is the default output.\n\n---\n\n## 3. Choosing a base image\n\n| Base | Size | Has a shell? | Notes |\n|------|------|-------------|-------|\n| `node:22` | ~1.6 GB | ✅ bash | Everything. Use only for build stages if needed. |\n| `node:22-slim` | ~330 MB | ✅ | Debian minimal, glibc. Safe default. |\n| `node:22-alpine` | ~240 MB | ✅ sh | Smallest common choice. musl libc — rare native-module issues. |\n| `gcr.io/distroless/nodejs22-debian12` | close to alpine | ❌ **no shell** | Only Node + minimal libs. Very secure. Harder to debug (no `sh`). |\n| `scratch` | 0 MB | ❌ nothing | Empty. For single static binaries (Go, Rust). |\n\n**Pin versions** for repeatable builds:\n- Good: `node:22.11-alpine3.20`\n- Best (exact, can't change): `node:22-alpine@sha256:abc123…` (a **digest**)\n\n---\n\n## 4. BuildKit features\n\nBuildKit is Docker's modern build engine (on by default). Put this as the **first line** of the Dockerfile to get the newest syntax:\n```dockerfile\n# syntax=docker/dockerfile:1\n```\n\n### 4.1 Cache mounts — faster installs\n```dockerfile\nRUN --mount=type=cache,target=/root/.npm npm ci\n```\n- Keeps npm's download cache **between builds**, but **not** inside the image.\n- Even when the layer must rebuild, packages come from the local cache → much faster.\n- Other examples: `target=/root/.cache/pip` (Python), `target=/var/cache/apt` (Debian).\n\n### 4.2 Secret mounts — use a password while building, never store it\n```dockerfile\nRUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci\n```\n```powershell\ndocker build --secret id=npmrc,src=$env:USERPROFILE\\.npmrc -t app .\n```\n- The file is available **only during that one RUN** and is **not** saved in any layer.\n- ❌ Never do `COPY .npmrc .` or `ARG NPM_TOKEN` — they end up in the image/history.\n\n---\n\n## 5. Security basics\n\n| Practice | How | Why |\n|----------|-----|-----|\n| **Non-root user** | `USER node` (or create one: `RUN addgroup -S app && adduser -S app -G app`) | A hacked app can't do root things |\n| **Own files correctly** | `COPY --chown=node:node …` | App can read; avoid giving write access you don't need |\n| **Read-only filesystem** | `docker run --read-only --tmpfs /tmp …` | App can't modify itself; malware can't drop files |\n| **Drop Linux capabilities** | `docker run --cap-drop ALL …` | Removes extra kernel powers |\n| **No secrets in image** | Pass at runtime: `-e`, env_file, Docker secrets | Images get shared; anything inside can be extracted |\n| **Few packages** | Small base, multi-stage, no curl/git in final image unless needed | Fewer things that can have CVEs |\n| **Scan** | `docker scout cves` | Find known vulnerabilities |\n| **Healthcheck** | `HEALTHCHECK …` | Orchestrators know when to restart |\n| **Exec-form CMD** | `CMD [\"node\",\"dist/server.js\"]` | Clean shutdown on `docker stop` |\n\n### `docker scout` — vulnerability scanning\n\n> 🔐 `docker scout` needs you to be **signed in to Docker** (a free Docker Hub account is enough). Run `docker login` or sign in to Docker Desktop first, otherwise it only prints `Log in with your Docker ID or email address to use docker scout.`\n\n| Command | What it shows |\n|---------|---------------|\n| `docker scout quickview IMAGE` | Summary: how many Critical / High / Medium / Low CVEs |\n| `docker scout cves IMAGE` | Full list of CVEs with the package that has them |\n| `docker scout cves --only-severity critical,high IMAGE` | Only the serious ones |\n| `docker scout recommendations IMAGE` | Suggests a better base image |\n\n> A **CVE** is a publicly known security bug with an ID like `CVE-2026-12345`.\n\n---\n\n## 6. Building for other CPUs\n\nYour PC is `amd64` (Intel/AMD). Apple M-series Macs and many cloud servers (AWS Graviton) are `arm64`.\n\n```powershell\ndocker build --platform linux/arm64 -t app:arm .          # build for ARM\ndocker buildx build --platform linux/amd64,linux/arm64 -t user/app:1.0 --push .   # both at once (needs a registry)\n```\n| Flag | Meaning |\n|------|---------|\n| `--platform` | Target OS/CPU, e.g. `linux/amd64`, `linux/arm64` |\n| `buildx` | The extended build command (multi-platform, more cache options) |\n| `--push` | Push straight to a registry (multi-platform images can't be loaded locally as one image) |\n\n---\n\n## 7. Hands-on, step by step\n\n### Example 1 — Multi-stage TypeScript API\n\n```powershell\nmkdir $HOME\\docker-learning\\phase7\\ts-api; cd $HOME\\docker-learning\\phase7\\ts-api\nnpm init -y\nnpm install express\nnpm install -D typescript @types/express @types/node\n```\n\n`tsconfig.json`\n```json\n{ \"compilerOptions\": { \"rootDir\": \"src\", \"outDir\": \"dist\", \"module\": \"commonjs\", \"target\": \"es2022\", \"strict\": true, \"esModuleInterop\": true } }\n```\n> `rootDir` is required by **TypeScript 7** when you set `outDir`: without it the build stops with `error TS5011: The common source directory … The 'rootDir' setting must be explicitly set`. It is harmless on older versions, so always include it.\n\nIn our test run npm installed **Express 5** and **TypeScript 7**; the code below works with both.\n\n`src/server.ts`\n```ts\nimport express from \"express\";\nconst app = express();\napp.get(\"/health\", (_req, res) => res.json({ ok: true }));\napp.get(\"/\", (_req, res) => res.send(\"Hello from a multi-stage image\"));\nconst server = app.listen(3000, \"0.0.0.0\", () => console.log(\"listening on 3000\"));\nprocess.on(\"SIGTERM\", () => server.close(() => process.exit(0)));   // graceful stop\n```\n\nAdd the build script to `package.json` without opening an editor:\n```powershell\nnpm pkg set scripts.build=tsc\n```\n\n`.dockerignore`\n```\nnode_modules\ndist\n.git\n*.md\n```\n\n**Single-stage (the \"kitchen\") — `Dockerfile.single`:**\n```dockerfile\nFROM node:22\nWORKDIR /app\nCOPY . .\nRUN npm install && npm run build\nCMD [\"node\", \"dist/server.js\"]\n```\n\n**Multi-stage (the \"plate\") — `Dockerfile`:**\n```dockerfile\n# syntax=docker/dockerfile:1\n\n# ---------- 1. deps: install ALL dependencies (needed to compile)\nFROM node:22-alpine AS deps\nWORKDIR /app\nCOPY package*.json ./\nRUN --mount=type=cache,target=/root/.npm npm ci\n\n# ---------- 2. build: compile TypeScript → dist/\nFROM deps AS build\nCOPY tsconfig.json ./\nCOPY src ./src\nRUN npm run build\n\n# ---------- 3. runtime: only prod deps + compiled JS\nFROM node:22-alpine AS runtime\nENV NODE_ENV=production\nWORKDIR /app\nCOPY package*.json ./\nRUN --mount=type=cache,target=/root/.npm npm ci --omit=dev\nCOPY --from=build --chown=node:node /app/dist ./dist\nUSER node\nEXPOSE 3000\nHEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\\n  CMD wget -qO- http://127.0.0.1:3000/health || exit 1\nCMD [\"node\", \"dist/server.js\"]\n```\n\nBuild both and compare:\n```powershell\ndocker build -f Dockerfile.single -t tsapi:single .\ndocker build -t tsapi:prod .\ndocker images tsapi\n# tsapi  single  ~1.6 GB\n# tsapi  prod    ~250 MB   ✅  (sizes as docker images shows them on Docker Desktop)\n```\n\nProve the final image has **no** TypeScript and **no** source:\n```powershell\ndocker run --rm tsapi:prod ls /app                 # → dist  node_modules  package.json  package-lock.json  (no src/)\ndocker run --rm tsapi:prod ls node_modules/typescript   # → No such file or directory (no compiler shipped)\ndocker run --rm tsapi:prod whoami                  # → node\n```\n\nRun with extra hardening:\n```powershell\ndocker run -d --name tsapi -p 3130:3000 --read-only --tmpfs /tmp --cap-drop ALL tsapi:prod\ndocker ps            # wait for (healthy)\ncurl.exe http://localhost:3130\n```\n- `--read-only` → root filesystem can't be changed\n- `--tmpfs /tmp` → but give it a writable temp folder in memory\n- `--cap-drop ALL` → remove all special Linux powers (a web app on port 3000 needs none)\n\n### Example 2 — Static frontend served by nginx\n\nFor an Angular / React / Vite app:\n```dockerfile\n# syntax=docker/dockerfile:1\nFROM node:22-alpine AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN --mount=type=cache,target=/root/.npm npm ci\nCOPY . .\nRUN npm run build                       # Angular → dist/\u003capp>/browser, Vite → dist/\n\nFROM nginx:1.27-alpine\nCOPY --from=build /app/dist/browser /usr/share/nginx/html\n# for single-page apps, send unknown URLs to index.html:\nRUN printf 'server { listen 80; root /usr/share/nginx/html; location / { try_files $uri /index.html; } }' \\\n    > /etc/nginx/conf.d/default.conf\n```\nFinal image ≈ **75 MB** (73.6 MB in our test) — no Node at all, just nginx + HTML/JS/CSS files. A deep link such as `/tasks/42` returns `index.html`, so the app's own router can handle it.\n\n### Example 3 — Scan\n\n```powershell\ndocker scout quickview tsapi:prod\ndocker scout cves --only-severity critical,high tsapi:prod\ndocker scout quickview tsapi:single       # compare: usually many more CVEs in the big image\n```\n\n### Clean up\n```powershell\ndocker rm -f tsapi\ndocker rmi tsapi:single tsapi:prod\n```\n\n**Real results from a test run:** single-stage **1.71 GB** vs multi-stage **246 MB** (7× smaller); the final image had no `src/`, no TypeScript and ran as `node`; with `--read-only --tmpfs /tmp --cap-drop ALL` it was healthy, writing to `/app` failed with `Read-only file system` while `/tmp` worked, and `docker stop` ended with exit code 0. A rebuild after a code change took 8 s. The nginx frontend image was 73.6 MB and served `index.html` for unknown paths. (The `docker scout` scan was not part of this run because it needs a Docker sign-in.)\n\n---\n\n## 8. Production checklist ✅\n\n- [ ] Multi-stage: build tools are **not** in the final image\n- [ ] Small, **pinned** base image\n- [ ] `.dockerignore` excludes `node_modules`, `.git`, `.env`, tests, docs\n- [ ] Dependencies copied/installed **before** source (cache)\n- [ ] Only production dependencies in final stage\n- [ ] Runs as **non-root** (`USER`)\n- [ ] **Exec-form** `CMD`, app handles `SIGTERM`\n- [ ] App listens on `0.0.0.0`\n- [ ] `HEALTHCHECK` (using `127.0.0.1` on Alpine)\n- [ ] **No secrets** in layers (`docker history` is clean)\n- [ ] `docker scout` shows **0 critical** CVEs\n- [ ] Config comes from **environment variables**, not baked into the image\n\n---\n\n## 9. Common mistakes\n\n| Mistake | Effect | Fix |\n|---------|--------|-----|\n| `COPY --from=build /app .` (copy everything) | Final image gets source + devDeps again | Copy only `dist` (and install prod deps fresh) |\n| Using distroless, then `docker exec … sh` | \"executable file not found\" — there's no shell | Debug with a `-debug` variant or a separate debug stage |\n| `RUN rm -rf node_modules` in a later layer | Size doesn't drop (earlier layer still has it) | Multi-stage instead |\n| `ARG NPM_TOKEN` / `COPY .npmrc` | Token visible in `docker history` | `--mount=type=secret` |\n| `--read-only` and app crashes writing to `/tmp` | No writable place | Add `--tmpfs /tmp` |\n| Building on Windows, deploying to ARM server | `exec format error` | `--platform linux/arm64` or multi-platform buildx |\n\n---\n\n## 10. Exercise\n\nTake `$HOME\\docker-learning\\taskboard` and:\n1. Turn its `Dockerfile` into a multi-stage build (even without TypeScript: stage 1 installs, stage 2 copies only `node_modules` + `src` + `public`).\n2. Add `# syntax=docker/dockerfile:1` and a cache mount for npm.\n3. Target: **under 260 MB** in `docker images` (step4 was 247 MB, step1 was 1.65 GB), `whoami` → `node`, `docker scout quickview` → 0 critical.\n4. Run it with `--read-only --tmpfs /tmp --cap-drop ALL` and confirm it still works.\n\n---\n\n## 11. Check yourself ✅\n\n1. In a multi-stage build, which stage becomes the final image?\n2. What does `COPY --from=build` copy from?\n3. Why is a cache mount better than a normal layer for `npm ci`?\n4. How do you use a private npm token during build without leaking it?\n5. What does `--read-only` do, and why might you need `--tmpfs /tmp` with it?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. The last one (or the one named with `--target`).\n2. From the filesystem of the stage named `build` — not from your PC.\n3. The npm download cache is reused across builds even when the layer rebuilds, and it's not stored in the image.\n4. `RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm ci` + `docker build --secret id=npmrc,src=…`.\n5. Makes the container's filesystem unchangeable; apps that need temp files need a writable in-memory `/tmp`.\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker build -t app:prod .                         # multi-stage build (last stage)\ndocker build --target build -t app:debug .         # stop at a stage\ndocker build --secret id=npmrc,src=PATH -t app .   # build secret\ndocker build --platform linux/arm64 -t app:arm .   # other CPU\ndocker scout quickview app:prod                    # CVE summary\ndocker scout cves --only-severity critical,high app:prod\ndocker run --read-only --tmpfs /tmp --cap-drop ALL app:prod   # hardened run\n```"},{"id":"phase-08","kind":"phase","num":8,"title":"Registries, Tags & Versions: Sharing Images","short":"Registries & tags","oneLine":"Give your image a proper name and version, push it to a registry, and pull it on any other machine.","meta":["Time: ~1 hour","Uses images from Phase 7 (or taskboard:step4 from Phase 2)"],"time":"~1 hour","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## What you will learn\n\n- How an image name is built: `registry/namespace/repo:tag`\n- Tags vs **digests**\n- A good tagging strategy (and why not to use `latest`)\n- `docker login`, `tag`, `push`, `pull`, `logout`\n- Running your own **private registry** locally\n- Docker Hub and GitHub Container Registry (GHCR)\n\n---\n\n## 1. The idea\n\nSo far, images lived only on your PC. A server, a teammate, or a CI pipeline can't use them.\n\nA **registry** is like **GitHub, but for images**:\n- `docker push` = upload (like `git push`)\n- `docker pull` = download (like `git pull`/`clone`)\n\n### The full image name\n\n```\n  ghcr.io / vasim / taskboard : 1.2.0\n  └──┬───┘ └─┬──┘ └───┬───┘   └─┬─┘\n  registry  namespace  repo     tag\n  (server)  (user/org) (name)  (version)\n```\n\n| You write | Docker reads it as |\n|-----------|-------------------|\n| `nginx` | `docker.io/library/nginx:latest` (Docker Hub, official image) |\n| `vasim/taskboard:1.0` | `docker.io/vasim/taskboard:1.0` (Docker Hub, user vasim) |\n| `ghcr.io/vasim/taskboard:1.0` | GitHub Container Registry |\n| `localhost:5001/taskboard:1.0` | A registry running on your PC, port 5001 |\n\n**Rule:** the registry address is the part **before the first `/`** if it contains a `.` or `:` — otherwise Docker assumes Docker Hub.\n\n---\n\n## 2. Tags vs digests\n\n| | Tag (`:1.2.0`) | Digest (`@sha256:65645c…`) |\n|---|---|---|\n| What it is | A human-friendly **label** | The image's **fingerprint** (calculated from its content) |\n| Can it change? | ✅ Yes — anyone with push rights can move a tag to a new image | ❌ Never — different content = different digest |\n| Use for | Everyday work, readable versions | Exact, guaranteed reproducible deploys |\n\n```powershell\ndocker pull nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10\ndocker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}'\n```\n\n### Why not `latest`?\n\n- `latest` is just the **default tag name** — not \"the newest\".\n- `myapp:latest` today and `myapp:latest` next week can be different images → \"it worked yesterday!\" problems.\n- You can't roll back to \"the previous latest\".\n\n### A good tagging strategy\n\nTag the **same** image with several tags at once:\n\n| Tag | Example | Meaning |\n|-----|---------|---------|\n| Full version | `1.4.2` | Exactly this release (never re-pushed) |\n| Minor | `1.4` | Newest `1.4.x` (moves with patches) |\n| Major | `1` | Newest `1.x.x` |\n| Git commit | `sha-3f9c2a1` | Exactly the commit it was built from (great in CI) |\n| Environment (optional) | `staging` | What staging runs now (moves) |\n\nDeploy with `1.4.2` or `sha-…` — **never** `latest`.\n\n---\n\n## 3. Commands explained\n\n| Command | What it does |\n|---------|--------------|\n| `docker login` | Log in to Docker Hub (asks username + password/**access token**) |\n| `docker login ghcr.io -u USER` | Log in to another registry |\n| `docker logout [registry]` | Remove saved login |\n| `docker tag SOURCE TARGET` | Add a new name to an image (no copy, same ID) |\n| `docker push NAME:TAG` | Upload that tag (only layers the registry doesn't have yet) |\n| `docker push --all-tags NAME` | Push every tag of that repo |\n| `docker pull NAME:TAG` | Download |\n| `docker pull --platform linux/arm64 NAME:TAG` | Download a specific CPU variant |\n| `docker search nginx` | Search Docker Hub |\n| `docker image inspect NAME --format '{{.RepoDigests}}'` | See digest after push/pull |\n| `docker manifest inspect NAME:TAG` | Which platforms (amd64/arm64) an image supports |\n\n> 🔐 Use an **access token**, not your real password: Docker Hub → Account settings → Personal access tokens. For GHCR: a GitHub token with `write:packages`.\n> Logins are saved by Docker Desktop's credential helper (Windows Credential Manager), not in plain text.\n\n---\n\n## 4. Hands-on, step by step\n\n### Example 1 — Your own private registry on your PC\n\nThe registry itself is just a container! (`registry:2` is the official one.)\n\n```powershell\ndocker run -d --name registry -p 5001:5000 -v registry-data:/var/lib/registry registry:2\n```\n- `-p 5001:5000` → registry listens on 5000 inside; we use 5001 on the PC\n- `-v registry-data:/var/lib/registry` → keep pushed images if the registry container is recreated\n\n> Docker trusts `localhost` registries without HTTPS. For a registry on another machine you'd need TLS.\n\n**Tag** the image for this registry:\n```powershell\ndocker build -t taskboard:step4 $HOME\\docker-learning\\taskboard\ndocker tag taskboard:step4 localhost:5001/taskboard:1.0.0\ndocker tag taskboard:step4 localhost:5001/taskboard:1.0\ndocker images localhost:5001/taskboard      # same IMAGE ID for both tags\n```\n\n**Push:**\n```powershell\ndocker push localhost:5001/taskboard:1.0.0\ndocker push localhost:5001/taskboard:1.0\n```\nOutput shows each layer: `Pushed` (uploaded) or `Layer already exists` (skipped — layers are shared!).\nThe last line shows the **digest**.\n\n**See what's in the registry** (it has a simple HTTP API):\n```powershell\ncurl.exe http://localhost:5001/v2/_catalog                 # {\"repositories\":[\"taskboard\"]}\ncurl.exe http://localhost:5001/v2/taskboard/tags/list      # {\"name\":\"taskboard\",\"tags\":[\"1.0.0\",\"1.0\"]}\n```\n\n**Pull** — delete the local copy first to prove it really comes from the registry.\n\nAn image is only deleted when its **last** tag is removed. `taskboard:step4` points to the same image, so remove that tag too, otherwise `docker rmi` only prints `Untagged:` and nothing is downloaded:\n```powershell\ndocker rmi localhost:5001/taskboard:1.0.0 localhost:5001/taskboard:1.0 taskboard:step4\n# Untagged: …   Untagged: …   Deleted: sha256:ff28…   ← \"Deleted\" means the image is really gone\ndocker pull localhost:5001/taskboard:1.0.0\n# 1.0.0: Pulling from taskboard\n# 87b02288c4cd: Download complete      ← only the app's own layer; the node base layers were still on disk\ndocker tag localhost:5001/taskboard:1.0.0 taskboard:step4      # put the old name back for later phases\ndocker run -d --name tb-reg -p 3110:3000 localhost:5001/taskboard:1.0.0\n# open http://localhost:3110\n```\n> 💡 On Docker 29 the **IMAGE ID** you see in `docker images` is the same as the registry **digest** (`sha256:ff28…`), so you can match local images to registry versions at a glance.\n\n### Example 2 — Docker Hub\n\n```powershell\ndocker login                                   # username + access token\ndocker tag taskboard:step4 YOUR_DOCKERHUB_USER/taskboard:1.0.0\ndocker push YOUR_DOCKERHUB_USER/taskboard:1.0.0\n```\nNow on **any** computer: `docker run -p 3100:3000 YOUR_DOCKERHUB_USER/taskboard:1.0.0`\n\n> ⚠️ New Docker Hub repos are **public** by default (free accounts get 1 private repo). Don't push company code to a public repo. Check with your team first.\n\n### Example 3 — GitHub Container Registry (GHCR)\n\n```powershell\n$env:CR_PAT = \"\u003cgithub token with write:packages>\"      # don't commit this anywhere\n$env:CR_PAT | docker login ghcr.io -u YOUR_GITHUB_USER --password-stdin\ndocker tag taskboard:step4 ghcr.io/YOUR_GITHUB_USER/taskboard:1.0.0\ndocker push ghcr.io/YOUR_GITHUB_USER/taskboard:1.0.0\n```\n- `--password-stdin` → read the token from the pipe, so it doesn't appear in your command history.\n- Packages on GHCR are **private** by default.\n\n### Example 4 — Use a registry image in Compose\n\n```yaml\nservices:\n  api:\n    image: localhost:5001/taskboard:1.0.0     # pull instead of build\n    ports: [\"3100:3000\"]\n```\n```powershell\ndocker compose pull\ndocker compose up -d\n```\nIf a service has **both** `build:` and `image:`, Compose builds and **tags** the result with that `image:` name — then `docker compose push` uploads it.\n\n### Clean up\n```powershell\ndocker rm -f tb-reg registry\ndocker volume rm registry-data\n```\n\n**Real results from a test run:** the first push uploaded 5 layers, the second tag only reported `Layer already exists`; `/v2/_catalog` and `/tags/list` listed the repo and tags; after deleting the image for real, the pull downloaded only one layer; `1.0.0` and `1.1.0` ran side by side on 3110/3111, the rollback to `1.0.0` worked, and running `localhost:5001/taskboard@sha256:c227…` started exactly `1.1.0`. Compose pulled the registry image and the service came up healthy.\n\n---\n\n## 5. Common mistakes\n\n| Problem | Cause | Fix |\n|---------|-------|-----|\n| `denied: requested access to the resource is denied` | Not logged in, or the namespace isn't yours | `docker login`; tag as `YOURUSER/name` |\n| `An image does not exist locally with the tag` | Pushed a name you never tagged | `docker tag` first |\n| `http: server gave HTTP response to HTTPS client` | Registry on another host without TLS | Use TLS, or add it to `insecure-registries` in Docker Desktop → Settings → Docker Engine (dev only) |\n| Deploy changed \"by itself\" | Used `latest` or a moving tag | Deploy fixed versions or digests |\n| `exec format error` on the server | Image built for amd64, server is arm64 | `docker buildx build --platform linux/amd64,linux/arm64 --push` |\n| Token in shell history | `docker login -p TOKEN` | `--password-stdin` |\n\n---\n\n## 6. Exercise\n\n1. Push `taskboard` as `1.0.0` to your local registry.\n2. Change a visible text in `src/server.js`, rebuild, and push as `1.1.0` (and move `1.1` + `1` tags too).\n3. Run **both** versions side by side: `1.0.0` on port 3110 and `1.1.0` on 3111. Open both in the browser.\n4. \"Roll back\": stop `1.1.0`, start `1.0.0` again — you can, because the old version is still in the registry.\n5. Find the digest of `1.1.0` and run it **by digest**: `docker run -p 3112:3000 localhost:5001/taskboard@sha256:…`\n\n---\n\n## 7. Check yourself ✅\n\n1. What is the full name Docker uses when you type `redis`?\n2. Can a tag point to a different image tomorrow? Can a digest?\n3. Why tag one image as `1.4.2`, `1.4` **and** `1`?\n4. Why use `--password-stdin`?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. `docker.io/library/redis:latest`.\n2. Tag: yes. Digest: never.\n3. Users can choose how \"fixed\" they want to be: exact release, newest patch, or newest minor.\n4. So the secret isn't typed on the command line (history, process list).\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker run -d -p 5001:5000 --name registry registry:2    # local registry\ndocker login [REGISTRY]          ·  docker logout [REGISTRY]\ndocker tag  LOCAL:TAG  REGISTRY/NS/NAME:TAG\ndocker push REGISTRY/NS/NAME:TAG\ndocker pull REGISTRY/NS/NAME:TAG\ndocker pull NAME@sha256:DIGEST                           # exact image\n```"},{"id":"phase-09","kind":"phase","num":9,"title":"Debugging & Running Containers Safely","short":"Debugging & operations","oneLine":"Find out why a container broke, and set it up so it restarts by itself, doesn't eat all memory, and doesn't fill the disk.","meta":["Time: ~1.5 hours","Work folder: $HOME\\docker-learning\\phase9"],"time":"~1.5 hours","md":"\n## What you will learn\n\n- A step-by-step **debug checklist**\n- Reading **exit codes** (0, 1, 125, 126, 127, 137, 139, 143)\n- Debug tools: `logs`, `inspect`, `events`, `stats`, `top`, `diff`, `cp`, `--entrypoint`\n- **Restart policies**\n- **Resource limits** (memory, CPU)\n- **Log rotation**\n- Cleaning disk space: `system df`, `prune`\n\n---\n\n## 1. The idea: be a detective 🕵️\n\nWhen a container \"doesn't work\", it's always one of a few things:\n\n1. It **didn't start** (bad image name, bad command, port in use)\n2. It **started then died** (app crash, missing env var, out of memory)\n3. It **runs but doesn't answer** (wrong port, listening on 127.0.0.1, wrong network)\n4. It's **slow / unhealthy** (out of CPU/memory, waiting for a dependency)\n\nDocker leaves **clues** for each case: status, exit code, logs, events, health info.\n\n---\n\n## 2. The debug checklist\n\n```\n 1. docker ps -a                 → Is it running? What's the STATUS / exit code?\n 2. docker logs --tail 50 NAME   → What did the app say before it died?\n 3. docker inspect NAME          → ExitCode, OOMKilled, Error, Health, Env, Mounts, Ports\n 4. docker events                → What happened, in order (die, oom, restart, health_status)\n 5. Get inside:\n      running   → docker exec -it NAME sh\n      crashing  → docker run --rm -it --entrypoint sh IMAGE\n 6. Check from outside → curl the port; check network with docker network inspect\n```\n\n### Exit codes — what they tell you\n\n| Code | Meaning | Typical cause |\n|------|---------|---------------|\n| `0` | Finished successfully | One-time job done; or the main process ended on purpose |\n| `1` | General app error | Exception, missing config, can't connect to DB |\n| `125` | Docker itself failed | Bad flag, name conflict, port already in use |\n| `126` | Command can't be run | File not executable (permissions) |\n| `127` | Command not found | Typo in CMD, `bash` not present in Alpine |\n| `137` | Killed (SIGKILL = 128+9) | **Out of memory** (check `OOMKilled`) or `docker kill` / stop timeout |\n| `139` | Segfault (128+11) | Crash in native code; often alpine/musl vs glibc issue |\n| `143` | Terminated (SIGTERM = 128+15) | Normal `docker stop` |\n\n---\n\n## 3. Debug commands explained\n\n| Command | What it does | Useful flags |\n|---------|--------------|--------------|\n| `docker logs NAME` | App output | `-f` follow, `--tail N`, `--since 10m`, `-t` timestamps |\n| `docker inspect NAME` | Full JSON | `--format '{{.State.ExitCode}}'`, `{{.State.OOMKilled}}`, `{{.State.Error}}`, `{{json .State.Health}}` |\n| `docker events` | Live stream of Docker events | `--filter container=NAME`, `--since 30m` |\n| `docker stats` | Live CPU / memory / network / disk I/O | `--no-stream` (print once) |\n| `docker top NAME` | Processes inside | |\n| `docker diff NAME` | Files changed in the container | |\n| `docker cp NAME:/path ./local` | Copy a file **out of** a container (works on stopped ones too!) | `docker cp ./local NAME:/path` copies **in** |\n| `docker run --entrypoint sh -it IMAGE` | Start the image with a shell **instead of** the app | Lets you look at a crashing image |\n| `docker exec -u root -it NAME sh` | Shell as root (to install a debug tool) | |\n| `docker port NAME` | Port mappings | |\n| `docker compose logs -f` / `ps` | Same for a Compose project | |\n\nHandy `inspect` one-liners:\n```powershell\ndocker inspect NAME --format '{{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}'\ndocker inspect NAME --format '{{json .State.Health}}'      # last health check results\ndocker inspect NAME --format '{{range .Config.Env}}{{println .}}{{end}}'   # env vars\ndocker inspect NAME --format '{{json .Mounts}}'            # volumes\n```\n\n> **Debugging an image with no shell** (distroless)? Attach a helper container that shares its process view:\n> `docker run --rm -it --pid container:NAME --network container:NAME alpine:3.20 sh`\n\n---\n\n## 4. Restart policies\n\n| Policy | Restarts when… | After Docker/PC restart | Use for |\n|--------|----------------|------------------------|---------|\n| `no` (default) | Never | ❌ | Tests, one-off jobs |\n| `on-failure[:N]` | Exit code ≠ 0 (max N times) | ✅ if it was failing | Jobs that may fail temporarily |\n| `always` | Always, even after `docker stop` once Docker restarts | ✅ | Rare |\n| `unless-stopped` | Always, **except** if you stopped it yourself | ✅ (unless you stopped it) | ✅ **Most services** |\n\n```powershell\ndocker run -d --restart unless-stopped nginx:1.27-alpine\ndocker update --restart unless-stopped NAME        # change on an existing container\n```\nCompose: `restart: unless-stopped`\n\n> Docker waits a bit longer between each restart (100 ms, 200 ms, 400 ms… up to 1 min) so a crash loop doesn't burn your CPU. Status shows `Restarting (1) 3 seconds ago`.\n\n---\n\n## 5. Resource limits\n\nWithout limits, one buggy container can use **all** the memory of the Docker VM and slow everything down.\n\n| Flag | Meaning | Example |\n|------|---------|---------|\n| `-m` / `--memory` | Max RAM. Above it → process is **killed** (OOM, exit 137) | `-m 256m` |\n| `--memory-swap` | RAM + swap total. Same as `-m` → no swap | `--memory-swap 256m` |\n| `--cpus` | Max CPU cores (can be fractional) | `--cpus 0.5` = half a core |\n| `--pids-limit` | Max number of processes (stops fork bombs) | `--pids-limit 200` |\n\nCompose:\n```yaml\nservices:\n  api:\n    deploy:\n      resources:\n        limits:\n          memory: 256M\n          cpus: \"0.5\"\n```\nChange limits on a running container: `docker update -m 512m --memory-swap 512m NAME`\n\n> Node.js tip: set the heap below the container limit, e.g. `NODE_OPTIONS=--max-old-space-size=200` for `-m 256m`.\n\n---\n\n## 6. Log rotation\n\nBy default Docker keeps **all** logs forever (`json-file` driver) → a chatty app can fill the disk.\n\n```powershell\ndocker run -d --log-opt max-size=10m --log-opt max-file=3 nginx:1.27-alpine\n```\n- `max-size=10m` → start a new file at 10 MB\n- `max-file=3` → keep only 3 files (max 30 MB total)\n\nCompose:\n```yaml\nlogging:\n  driver: json-file\n  options:\n    max-size: \"10m\"\n    max-file: \"3\"\n```\nSet it for **all** containers: Docker Desktop → Settings → Docker Engine →\n```json\n\"log-driver\": \"json-file\",\n\"log-opts\": { \"max-size\": \"10m\", \"max-file\": \"3\" }\n```\n\n---\n\n## 7. Disk cleanup\n\n| Command | Removes | Risk |\n|---------|---------|------|\n| `docker system df` | Nothing — **shows** space used by images, containers, volumes, build cache | — |\n| `docker system df -v` | Detailed per item | — |\n| `docker container prune` | Stopped containers | Low |\n| `docker image prune` | Dangling images (`\u003cnone>`) | Low |\n| `docker image prune -a` | All images not used by a container | Medium (re-download later) |\n| `docker builder prune` | Build cache | Low (slower next build) |\n| `docker volume prune` | Unused **anonymous** volumes | Medium |\n| `docker volume prune -a` | **All** unused volumes, including named | ⚠️ **High — data loss** |\n| `docker system prune` | Stopped containers + unused networks + dangling images + build cache | Medium |\n| `docker system prune -a --volumes` | Almost everything not running | ⚠️ **Very high** |\n\nMost prune commands accept `--filter until=24h` (only older than 24 h) and `-f` (don't ask).\n\n> Have old stopped containers you still care about? Check with `docker ps -a` before pruning, because `container prune` deletes **all** stopped containers. Remove specific ones with `docker rm NAME` if unsure.\n\n---\n\n## 8. Hands-on: break things on purpose\n\n```powershell\nmkdir $HOME\\docker-learning\\phase9; cd $HOME\\docker-learning\\phase9\n```\n\n### Case 1 — Crash loop\n```powershell\ndocker run -d --name crash --restart on-failure:3 alpine:3.20 sh -c \"echo starting; echo boom >&2; exit 1\"\nStart-Sleep 5\ndocker ps -a --filter name=crash          # Exited (1)\ndocker logs crash                         # \"starting / boom\" printed 4 times (1 + 3 restarts)\ndocker inspect crash --format 'exit={{.State.ExitCode}} restarts={{.RestartCount}}'\n# exit=1 restarts=3\n```\n**Diagnosis:** app exits with 1 → `on-failure:3` tried 3 times → gave up.\n\n### Case 2 — Out of memory\n```powershell\ndocker run --name oom -m 50m --memory-swap 50m alpine:3.20 tail /dev/zero\ndocker inspect oom --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'\n# exit=137 oom=true\n```\n`tail /dev/zero` keeps reading zeros into memory and never finds a line end, so it grows until it hits the 50 MB limit. **Diagnosis:** exit 137 + `OOMKilled=true` → the kernel killed the main process for using too much memory.\n\n**A tricky variant:** the kernel may kill a *child* process instead of the main one.\n```powershell\ndocker run --name oom-child -m 50m --memory-swap 50m alpine:3.20 sh -c \"apk add -q stress-ng && stress-ng --vm 1 --vm-bytes 200M -t 10s\"\ndocker inspect oom-child --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}}'\n# exit=0 oom=true\n```\nstress-ng's worker was killed, stress-ng started a new one, and the main program finished normally. So **`OOMKilled=true` can appear even with exit code 0**. If an app \"randomly\" loses workers or requests, check `OOMKilled`, not only the exit code.\n\n### Case 3 — Command not found\n```powershell\ndocker run --name nf alpine:3.20 bash\n# exec: \"bash\": executable file not found in $PATH\ndocker inspect nf --format 'exit={{.State.ExitCode}} err={{.State.Error}}'\n# exit=127\n```\n**Fix:** Alpine has `sh`, not `bash`.\n\n### Case 4 — Runs but doesn't answer\n```powershell\ndocker run -d --name wrongport -p 3140:3000 nginx:1.27-alpine\ncurl.exe -s -m 3 http://localhost:3140      # empty / connection reset\ndocker port wrongport                        # 3000/tcp -> 0.0.0.0:3140\ndocker exec wrongport netstat -tln           # nginx listens on :80, not :3000\n```\n**Fix:** `-p 3140:80` (the container port must be the one the app really listens on).\n\n### Case 5 — Look inside an image that crashes at start\n```powershell\ndocker run --rm -it --entrypoint sh taskboard:step4\n# now you're inside with the app NOT running: ls, cat files, check env, try \"node src/server.js\" by hand\n```\n\n### Case 6 — Copy a file out of a dead container\n```powershell\ndocker cp crash:/etc/os-release .\\crash-os-release.txt\n```\n\n### Case 7 — Watch events live\nIn one terminal: `docker events --filter container=demo`\nIn another:\n```powershell\ndocker run -d --name demo nginx:1.27-alpine; docker stop demo; docker start demo; docker rm -f demo\n```\nYou'll see `create`, `start`, `kill`, `stop`, `die`, `start`, `kill`, `die`, `destroy`.\n\nOnly one terminal? Replay the past instead of watching live:\n```powershell\ndocker events --filter container=demo --since 5m --until 0s --format '{{.Action}}'\n```\n\n### Clean up\n```powershell\ndocker rm -f crash oom oom-child nf wrongport\ndocker system df\n```\n\n**Real results from a test run:** crash loop → 4 starts, then `exit=1 restarts=3`; `tail /dev/zero` with `-m 50m` → `exit=137 oom=true`; the stress-ng variant → `exit=0 oom=true`; `bash` on Alpine → exit 127; wrong port → empty reply while `netstat` showed nginx on `:80`; `--entrypoint sh` opened the image without starting the app; `docker cp` worked on an exited container.\n\n---\n\n## 9. Exercise\n\n1. A teammate says: *\"My container starts and then disappears.\"* Write your own 5-step checklist (use section 2) and apply it to `crash`.\n2. Start the Phase 5 Compose project with `restart: unless-stopped`, memory limit `256M`, and log rotation for `api`. Kill the node process inside (`docker compose exec api kill 1`) and watch it come back with `docker compose ps`. (In our test it came back after ~4 s with `RestartCount` 1. The app exited cleanly with code 0, and `unless-stopped` restarts it anyway; `on-failure` would **not**, because exit code 0 is not a failure.)\n3. Run `docker system df`. Which takes the most space: images, containers, volumes, or build cache? Clean only the safe ones.\n\n---\n\n## 10. Check yourself ✅\n\n1. A container shows `Exited (137)`. What are the two likely reasons and how do you tell them apart?\n2. What's the difference between `always` and `unless-stopped`?\n3. Your image crashes immediately so you can't `exec` into it. How do you look inside?\n4. Why add log rotation?\n5. Which prune command can delete database data?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. Out of memory, or force-killed (`docker kill` / stop timeout). Check `docker inspect --format '{{.State.OOMKilled}}'`.\n2. `unless-stopped` stays stopped after Docker
