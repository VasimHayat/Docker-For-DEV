<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Docker by Example</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a course reader — steel-grey yard, left rail of phases with a container-stack progress gauge, reading column ~68ch, on-page contents rail on wide screens. Code blocks are always terminal-dark. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e3e8ed;
  --ink: #15212c;
  --ink-2: #4b5967;
  --line: #d2d9e0;
  --accent: #1d5da3;
  --accent-ink: #ffffff;
  --signal: #f0b429;
  --signal-ink: #4d3800;
  --ok: #1d8049;
  --warn-bg: #fff3d1;
  --warn-line: #d9a300;
  --tip-bg: #e4eefa;
  --tip-line: #1d5da3;
  --mark: #ffe08a;
  --shadow: 0 1px 2px rgba(21,33,44,.06), 0 4px 16px rgba(21,33,44,.06);
  --code-bg: #0f1922;
  --code-head: #17232e;
  --code-fg: #d9e2ea;
  --code-dim: #7f91a1;
  --hl-kw: #ff9e64;
  --hl-str: #a6da95;
  --hl-com: #6f8396;
  --hl-num: #f5c97a;
  --hl-fn: #7dc4ff;
  --hl-var: #e4b4ff;
  --font-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  --step--1: .875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.4rem;
  --step-4: clamp(2.8rem, 6vw, 4.4rem);
  --radius: 6px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d141a; --surface: #131d26; --surface-2: #1a2631; --ink: #e2e9ef; --ink-2: #98a8b6;
    --line: #253340; --accent: #6eaaf0; --accent-ink: #0d141a; --signal: #f0b429; --signal-ink: #2d2100;
    --ok: #47c47e; --warn-bg: #2a2310; --warn-line: #b88a00; --tip-bg: #132338; --tip-line: #6eaaf0;
    --mark: #6b5310; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --code-bg: #091016; --code-head: #111b24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d141a; --surface: #131d26; --surface-2: #1a2631; --ink: #e2e9ef; --ink-2: #98a8b6;
  --line: #253340; --accent: #6eaaf0; --accent-ink: #0d141a; --signal: #f0b429; --signal-ink: #2d2100;
  --ok: #47c47e; --warn-bg: #2a2310; --warn-line: #b88a00; --tip-bg: #132338; --tip-line: #6eaaf0;
  --mark: #6b5310; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --code-bg: #091016; --code-head: #111b24;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
button { font: inherit; color: inherit; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: var(--top-h);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: var(--radius); width: 38px; height: 38px; cursor: pointer; }
.menu-btn svg { display: block; margin: auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); flex-shrink: 0; }
.brand-mark { width: 30px; height: 20px; border-radius: 2px; background: repeating-linear-gradient(90deg, var(--signal) 0 4px, color-mix(in srgb, var(--signal) 70%, #000) 4px 5px); }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.search { position: relative; margin-left: auto; width: min(420px, 100%); min-width: 0; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 36px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--ink); font: inherit; font-size: var(--step--1);
}
.search input::placeholder { color: var(--ink-2); }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--ink-2); pointer-events: none; }
.search kbd { position: absolute; right: 8px; top: 8px; font-family: var(--font-mono); font-size: .72rem; color: var(--ink-2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; background: var(--surface); }
.results {
  position: absolute; top: 44px; right: 0; width: min(560px, calc(100vw - 32px));
  max-height: min(70vh, 560px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 6px;
}
.result { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 4px; padding: 8px 10px; cursor: pointer; }
.result:hover, .result.active { background: var(--surface-2); }
.result-where { font-size: .78rem; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.result-text { font-size: var(--step--1); overflow-wrap: anywhere; }
.result-text mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.results-empty { padding: 12px; color: var(--ink-2); font-size: var(--step--1); }

/* ---------- shell ---------- */
.shell {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr) 220px;
  gap: 40px;
  max-width: 1440px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sidebar {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
  align-self: start;
  height: calc(100vh - var(--top-h) - env(safe-area-inset-top, 0px));
  overflow-y: auto;
  padding-block: 24px;
  display: flex; flex-direction: column; gap: 20px;
}
.gauge { display: flex; flex-direction: column; gap: 8px; }
.gauge-label { display: flex; justify-content: space-between; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); }
.gauge-label b { color: var(--ink); font-variant-numeric: tabular-nums; }
.gauge-bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.gauge-fill { height: 100%; background: var(--signal); transition: width .3s ease; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); padding: 14px 10px 6px; }
.nav a {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) 16px; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--radius);
  text-decoration: none; color: var(--ink); font-size: var(--step--1); line-height: 1.3;
}
.nav a:hover { background: var(--surface-2); }
.nav a.current { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
.nav-num { font-family: var(--font-mono); font-size: .75rem; color: var(--ink-2); }
.nav-check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); }
.nav a.done .nav-check { border-color: var(--ok); background: var(--ok); box-shadow: inset 0 0 0 3px var(--surface); }
.nav a.current.done .nav-check { box-shadow: inset 0 0 0 3px var(--surface); }
.nav-plain { grid-template-columns: 30px minmax(0,1fr) !important; }

main { min-width: 0; padding-block: 32px 80px; }
.toc {
  position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); align-self: start;
  max-height: calc(100vh - var(--top-h)); overflow-y: auto;
  padding-block: 32px; font-size: .86rem;
}
.toc-title { font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); margin-bottom: 8px; }
.toc a { display: block; padding: 4px 0 4px 12px; border-left: 2px solid var(--line); color: var(--ink-2); text-decoration: none; line-height: 1.35; }
.toc a:hover { color: var(--ink); border-left-color: var(--ink-2); }
.toc a.on { color: var(--accent); border-left-color: var(--accent); }

/* ---------- page header ---------- */
.phase-head { display: flex; flex-direction: column; gap: 14px; padding-bottom: 28px; margin-bottom: 8px; border-bottom: 1px solid var(--line); max-width: 72ch; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); }
.tag { font-family: var(--font-mono); letter-spacing: .04em; background: var(--signal); color: var(--signal-ink); padding: 2px 8px; border-radius: 3px; font-weight: 600; }
.phase-head h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--step-3); line-height: 1.02; margin: 0; letter-spacing: .005em; text-wrap: balance; }
.lede { font-size: var(--step-1); line-height: 1.45; color: var(--ink); margin: 0; max-width: 60ch; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .82rem; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px; }

/* ---------- prose ---------- */
.prose { max-width: 72ch; }
.prose > * + * { margin-top: 1rem; }
.prose h2 { font-size: var(--step-2); line-height: 1.2; margin-top: 2.6rem; margin-bottom: .2rem; text-wrap: balance; scroll-margin-top: calc(var(--top-h) + 16px); }
.prose h3 { font-size: var(--step-1); margin-top: 2rem; scroll-margin-top: calc(var(--top-h) + 16px); }
.prose h4 { font-size: var(--step-0); margin-top: 1.4rem; }
.prose p, .prose li { overflow-wrap: break-word; }
.prose ul, .prose ol { padding-left: 1.4rem; }
.prose li + li { margin-top: .3rem; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin-block: 2.2rem; }
.prose strong { font-weight: 700; }
.prose :not(pre) > code {
  font-family: var(--font-mono); font-size: .86em;
  background: var(--surface-2); padding: .1em .35em; border-radius: 4px; overflow-wrap: anywhere;
}
.prose blockquote {
  margin: 1.2rem 0; padding: 12px 16px; border-left: 4px solid var(--tip-line);
  background: var(--tip-bg); border-radius: 0 var(--radius) var(--radius) 0;
}
.prose blockquote.warn { border-left-color: var(--warn-line); background: var(--warn-bg); }
.prose blockquote > * + * { margin-top: .5rem; }
.prose blockquote p { margin: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: .93rem; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.prose th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose td code { white-space: nowrap; }
.prose details { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 10px 14px; }
.prose details summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.prose details[open] summary { margin-bottom: .6rem; }
.prose input[type=checkbox] { accent-color: var(--ok); margin-right: 6px; }
.prose li:has(> input[type=checkbox]) { list-style: none; margin-left: -1.4rem; }

/* ---------- code ---------- */
.code { margin: 1.2rem 0; border-radius: var(--radius); overflow: hidden; background: var(--code-bg); color: var(--code-fg); }
.code-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 6px 4px 14px; background: var(--code-head); font-family: var(--font-mono); font-size: .74rem; color: var(--code-dim); text-transform: lowercase; }
.copy { background: none; border: 1px solid transparent; color: var(--code-dim); border-radius: 4px; padding: 3px 10px; cursor: pointer; font-family: var(--font-mono); font-size: .74rem; }
.copy:hover { color: var(--code-fg); border-color: var(--code-dim); }
.copy.copied { color: var(--hl-str); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-family: var(--font-mono); font-size: .86rem; line-height: 1.55; tab-size: 2; }
.code pre code { font-family: inherit; background: none; padding: 0; }
.code.diagram pre { line-height: 1.3; }
.hljs-keyword, .hljs-built_in, .hljs-selector-tag, .hljs-section, .hljs-meta .hljs-keyword { color: var(--hl-kw); }
.hljs-string, .hljs-attr .hljs-string, .hljs-template-string, .hljs-regexp { color: var(--hl-str); }
.hljs-comment, .hljs-quote { color: var(--hl-com); font-style: italic; }
.hljs-number, .hljs-literal, .hljs-symbol, .hljs-bullet { color: var(--hl-num); }
.hljs-title, .hljs-title.function_, .hljs-attr, .hljs-attribute, .hljs-name { color: var(--hl-fn); }
.hljs-variable, .hljs-template-variable, .hljs-params, .hljs-meta, .hljs-type { color: var(--hl-var); }

/* ---------- done + pager ---------- */
.finish { max-width: 72ch; margin-top: 3rem; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
.finish p { margin: 0; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--radius); padding: 10px 18px; font-weight: 700; cursor: pointer; text-decoration: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.is-done { background: transparent; color: var(--ok); border-color: var(--ok); }
.pager { max-width: 72ch; margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); text-decoration: none; color: var(--ink); background: var(--surface); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager small { color: var(--ink-2); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; }
.pager span { overflow-wrap: anywhere; font-weight: 700; }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
.hero h1 { font-family: var(--font-display); font-weight: 800; font-size: var(--step-4); line-height: .95; text-transform: uppercase; margin: 0 0 18px; letter-spacing: .01em; text-wrap: balance; }
.hero p { font-size: var(--step-1); line-height: 1.45; margin: 0 0 22px; max-width: 46ch; color: var(--ink); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.stack-wrap { display: flex; flex-direction: column; gap: 10px; }
.stack { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; padding: 10px 10px 0; border-bottom: 6px solid var(--ink); }
.box {
  aspect-ratio: 2.5 / 1; border-radius: 2px; display: flex; align-items: flex-end; justify-content: space-between; padding: 4px 7px;
  font-family: var(--font-mono); font-size: .68rem; text-decoration: none; color: var(--ink-2);
  border: 1.5px solid var(--line);
  background: repeating-linear-gradient(90deg, transparent 0 7px, color-mix(in srgb, var(--ink) 7%, transparent) 7px 9px), var(--surface);
}
.box:hover { border-color: var(--accent); }
.box.done { color: var(--signal-ink); border-color: color-mix(in srgb, var(--signal) 70%, #000); background: repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.12) 7px 9px), var(--signal); font-weight: 600; }
.stack-caption { font-size: .82rem; color: var(--ink-2); display: flex; justify-content: space-between; gap: 10px; }
.section-title { font-size: var(--step-2); margin: 40px 0 6px; }
.section-sub { color: var(--ink-2); margin: 0 0 18px; max-width: 64ch; }
.phase-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.phase-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.phase-card:hover { border-color: var(--accent); }
.phase-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; color: var(--ink-2); }
.phase-card h3 { font-size: var(--step-1); line-height: 1.25; margin: 0; }
.phase-card p { margin: 0; font-size: .93rem; color: var(--ink-2); line-height: 1.45; }
.state { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.state.done { color: var(--ok); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }
.cols ol, .cols ul { margin: 0; padding-left: 1.3rem; }
.cols li + li { margin-top: .35rem; }
.panel { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: var(--step-1); }
.panel code { font-family: var(--font-mono); font-size: .86em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
.ref-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.ref-links a { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.ref-links a:hover { border-color: var(--accent); }
.ref-links small { color: var(--ink-2); }
.reset { background: none; border: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; font-size: .82rem; padding: 0; }
.confirm { display: inline-flex; gap: 8px; align-items: center; font-size: .82rem; }

.overlay { display: none; }

/* ---------- responsive ---------- */
@media (max-width: 1240px) {
  .shell { grid-template-columns: 260px minmax(0, 1fr); }
  .toc { display: none; }
}
@media (max-width: 900px) {
  .menu-btn { display: block; }
  .shell { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .sidebar {
    position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(320px, 86vw); height: auto;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: var(--bg); border-right: 1px solid var(--line);
    transform: translateX(-102%); transition: transform .2s ease;
  }
  .sidebar.open { transform: none; box-shadow: var(--shadow); }
  .overlay.open { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.35); }
  .hero { grid-template-columns: minmax(0, 1fr); }
  .search kbd { display: none; }
}
@media (max-width: 520px) {
  .brand-name { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  .phase-head h1 { font-size: 2rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>

<header class="topbar">
  <button class="menu-btn" id="menu-btn" aria-label="Open the phase list" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg>
  </button>
  <a class="brand" href="#home" aria-label="Docker by Example home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Docker by Example</span>
  </a>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Search commands, flags, topics" autocomplete="off" aria-label="Search the course">
    <kbd>/</kbd>
    <div class="results" id="results" hidden></div>

<script id="course-data" type="application/json">{"pages":[{"id":"home","kind":"home","title":"Docker by Example"},{"id":"phase-00","kind":"phase","num":0,"title":"What is Docker? (The Mental Model)","short":"What is Docker?","oneLine":"Docker lets you pack an app *with everything it needs* into a box, and run that box the same way on any computer.","meta":["Time: ~30 minutes","No files needed"],"time":"~30 minutes","md":"\n## What you will learn\n\n- The problem Docker solves\n- The 4 words you must know: **Image, Container, Dockerfile, Registry**\n- How Docker works on Windows\n- Your first 3 commands: `docker version`, `docker info`, `docker run hello-world`\n\n---\n\n## 1. The problem Docker solves\n\nHave you heard this?\n\n> \"It works on my machine!\" 🤷\n\nYour app works on your laptop, but on the server it fails. Why?\n\n- Server has Node 18, you have Node 22\n- A library is missing on the server\n- An environment variable is different\n- The OS is different (Windows vs Linux)\n\n**Docker's answer:** Don't send *only the code*. Send the code **plus** the exact Node version, the libraries, the OS files, the settings — all packed together. That pack runs the same everywhere.\n\n### Simple analogy: the shipping container 🚢\n\nBefore shipping containers, every product (bananas, cars, furniture) was loaded differently. Slow and messy.\nThen came the **standard steel container**. The ship doesn't care what is inside — every container has the same shape, so it is loaded the same way.\n\nDocker does the same for software. Your laptop, a test server, the cloud — none of them care what is inside the container. They just run it.\n\n---\n\n## 2. The 4 key words\n\n| Word | Simple meaning | Real-life analogy |\n|------|----------------|-------------------|\n| **Dockerfile** | A text file of instructions: \"start from Linux, install Node, copy my code, run it\" | A **recipe** 📝 |\n| **Image** | The result of following the recipe. A frozen, read-only package. | A **cake mix packet** (or a class in programming) 📦 |\n| **Container** | A *running* copy of an image. You can run many containers from one image. | The **cake you baked** from the packet (or an object made from a class) 🎂 |\n| **Registry** | An online store where images are kept and shared. Docker Hub is the biggest. | A **supermarket** that sells cake mix packets 🏪 |\n\n**The flow:**\n\n```\n Dockerfile  ──(docker build)──▶  Image  ──(docker run)──▶  Container\n                                    │  ▲\n                        (docker push)  (docker pull)\n                                    ▼  │\n                                 Registry (Docker Hub)\n```\n\n### Important ideas\n\n- **One image → many containers.** Like one class → many objects. Each container gets its own private \"scratch space\" to write files in.\n- **Images are read-only.** A container never changes its image. Changes go into the container's own thin writable layer.\n- **Containers are not virtual machines.** A VM runs a whole separate operating system (heavy, slow to boot, GBs). A container is just a normal process on Linux that is *isolated* — it sees only its own files, its own network, its own processes. That is why a container starts in under 1 second and can be only a few MB.\n\n```\n   Virtual Machines                     Containers\n ┌───────┐ ┌───────┐               ┌───────┐ ┌───────┐\n │ App A │ │ App B │               │ App A │ │ App B │\n │ Libs  │ │ Libs  │               │ Libs  │ │ Libs  │\n │Guest OS││Guest OS│              └───┬───┘ └───┬───┘\n └───┬───┘ └───┬───┘               ┌───┴─────────┴───┐\n ┌───┴─────────┴───┐               │  Docker Engine   │\n │   Hypervisor    │               ├──────────────────┤\n ├─────────────────┤               │  Host OS (Linux) │\n │    Host OS      │               └──────────────────┘\n └─────────────────┘\n  Each VM = full OS (GBs)          Containers share the host kernel (MBs)\n```\n\n---\n\n## 3. How Docker works on Windows\n\nContainers need a **Linux kernel**. Windows doesn't have one, so **Docker Desktop** quietly runs a small Linux virtual machine (using **WSL2**) and runs your containers inside it.\n\n```\n Your Windows PC\n ├── PowerShell / Git Bash  ──  you type \"docker ...\"  (the CLIENT)\n └── Docker Desktop\n      └── small Linux VM (WSL2)\n           └── Docker Engine (the SERVER / \"daemon\")\n                ├── container 1\n                └── container 2\n```\n\n- The **client** (`docker` command) only *sends requests*.\n- The **engine / daemon** does the real work (download, build, run).\n- If Docker Desktop is not running, every command fails with\n  `error during connect ... The system cannot find the file specified`.\n  → Fix: open Docker Desktop and wait until it says **\"Engine running\"**.\n\n---\n\n## 4. Your first commands\n\n### 4.1 `docker version` — \"Is Docker working?\"\n\n```powershell\ndocker version\n```\n\n**What it does:** Prints the version of the **client** and the **server (engine)**.\n\n**How to read the output:**\n- You see both `Client:` and `Server:` sections → ✅ everything is fine.\n- You see only `Client:` and an error → ❌ Docker Desktop is not running.\n\n**Useful flag:**\n\n| Flag | Meaning |\n|------|---------|\n| `--format '...'` | Print only the parts you want, using a template. Example below. |\n\n```powershell\ndocker version --format 'Client {{.Client.Version}} / Server {{.Server.Version}}'\n# Client 29.5.2 / Server 29.5.2\n```\n\n> `{{ ... }}` is **Go template** syntax. Many docker commands accept `--format`. You'll use it a lot later.\n\n---\n\n### 4.2 `docker info` — \"Tell me about my Docker setup\"\n\n```powershell\ndocker info\n```\n\n**What it does:** Shows a system report. Look for these lines:\n\n| Line in output | What it means |\n|----------------|---------------|\n| `Containers: 23  Running: 0  Stopped: 23` | How many containers exist |\n| `Images: 40` | How many images are downloaded |\n| `CPUs: 8` / `Total Memory: 7.6GiB` | Resources Docker Desktop's VM is allowed to use |\n| `Operating System: Docker Desktop` | You're on Docker Desktop |\n| `OSType: linux` | Containers are Linux containers |\n\n---\n\n### 4.3 `docker run hello-world` — your first container 🎉\n\n```powershell\ndocker run hello-world\n```\n\n**What happens, step by step:**\n\n1. The client asks the engine: \"run the image `hello-world`\".\n2. The engine looks for the image **locally**. Not found →\n   `Unable to find image 'hello-world:latest' locally`\n3. It **pulls** (downloads) it from Docker Hub.\n4. It **creates** a container from the image.\n5. It **starts** the container. The program inside prints \"Hello from Docker!\"\n6. The program finishes → the container **exits** (stops). It still exists, in a stopped state.\n\nRun it a **second time** — step 3 is skipped (image is already on your PC), so it is much faster.\n\n**The name `hello-world` actually means `hello-world:latest`**:\n\n```\n   hello-world : latest\n   └── name ──┘  └ tag ┘   (tag = version label; \"latest\" is used if you don't write one)\n```\n\n---\n\n## 5. Common beginner confusions\n\n| Confusion | Truth |\n|-----------|-------|\n| \"Docker is a VM\" | No. Containers are isolated processes, much lighter than VMs. |\n| \"Stopping a container deletes it\" | No. A stopped container still exists (`docker ps -a` shows it) until you remove it. |\n| \"`latest` means the newest version\" | Not always! `latest` is just a tag name. Someone has to set it. Always use a real version like `nginx:1.27` for real work. |\n| \"If I change files in a container, the image changes\" | No. The image never changes. Only that one container's private layer changes. |\n\n---\n\n## 6. Exercise\n\n1. Run `docker version` and write down your client and server versions.\n2. Run `docker run hello-world` twice. Notice the second run is faster. Why?\n3. Read the text that `hello-world` prints. It lists 4 steps. Match each step with the flow diagram in section 2.\n4. Run `docker ps -a` and find the `hello-world` container. What is its status? (We will learn this command properly in Phase 1.)\n\n---\n\n## 7. Check yourself ✅\n\nCan you answer these without looking?\n\n1. What is the difference between an image and a container?\n2. Why is a container faster to start than a virtual machine?\n3. On Windows, where do Linux containers actually run?\n4. What does the tag `latest` mean?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. Image = read-only package (recipe result). Container = a running copy of that image, with its own writable layer.\n2. A container doesn't boot a whole OS; it is just an isolated process sharing the host's Linux kernel.\n3. Inside a small Linux VM (WSL2) that Docker Desktop manages.\n4. It is only the default tag name used when you don't give one. It does not guarantee \"newest\".\n\u003c/details>\n\n---\n\n## Summary\n\n- Docker packs **app + everything it needs** into an **image**.\n- Running an image creates a **container**.\n- Images come from a **registry** (Docker Hub).\n- Commands learned: `docker version`, `docker info`, `docker run`."},{"id":"phase-01","kind":"phase","num":1,"title":"Containers: Run, Look Inside, Stop, Remove","short":"Containers","oneLine":"Learn to control a container's whole life — start it, talk to it, look inside, stop it and delete it.","meta":["Time: ~1 hour","Outputs shown are from a real run"],"time":"~1 hour","md":"\n## What you will learn\n\n- The **life cycle** of a container\n- `docker run` and its most important flags (`-d`, `-p`, `--name`, `--rm`, `-it`, `-e`)\n- How to see containers (`docker ps`), read their output (`docker logs`), and get inside them (`docker exec`)\n- How to stop, start, restart and remove containers\n- How to inspect a container (`docker inspect`, `docker diff`, `docker top`)\n\n---\n\n## 1. The idea: the life of a container\n\nA container goes through these states:\n\n```\n             docker create            docker start\n  (image) ───────────────▶ CREATED ───────────────▶ RUNNING\n                                                   │   ▲\n                                      docker stop  │   │ docker start\n                         (or the program finishes) ▼   │\n                                                  EXITED ──── docker rm ───▶ (gone)\n```\n\n- `docker run` = `docker create` + `docker start` in one command. You will almost always use `run`.\n- **A container lives only as long as its main program (PID 1) runs.** When that program ends, the container goes to `EXITED`.\n  - `hello-world` prints a message and ends → container exits at once.\n  - `nginx` is a web server that runs forever → container keeps running.\n- **EXITED is not deleted.** The container and its files still exist until you `docker rm` it.\n\n---\n\n## 2. Commands explained\n\n### 2.1 `docker run` — create and start a container\n\n**Syntax:**\n```\ndocker run [FLAGS] IMAGE[:TAG] [COMMAND] [ARGS...]\n```\n\n- `IMAGE[:TAG]` — what to run, e.g. `nginx:1.27-alpine`\n- `[COMMAND] [ARGS]` — *optional*. Replaces the image's default command, e.g. `sh -c \"echo hi\"`\n\n**The most important flags:**\n\n| Flag | Long form | What it does | Example |\n|------|-----------|--------------|---------|\n| `-d` | `--detach` | Run in the **background**. You get your terminal back and see only the container ID. Without it, the terminal is \"stuck\" showing the container's output. | `docker run -d nginx` |\n| `-p H:C` | `--publish` | **Port mapping.** Connect port `H` on your PC to port `C` inside the container. Without this you cannot reach the app from your browser. | `-p 3101:80` → open `localhost:3101`, reach nginx's port 80 |\n| `--name X` | | Give the container a **name** you choose. Without it Docker invents a random one like `magical_mclean`. Names must be unique. | `--name web` |\n| `--rm` | | **Auto-delete** the container when it stops. Great for one-time commands so no rubbish is left behind. | `docker run --rm alpine echo hi` |\n| `-i` | `--interactive` | Keep the keyboard input (STDIN) open so you can type into the container. | |\n| `-t` | `--tty` | Give a real terminal (nice prompt, colours, arrow keys). | |\n| `-it` | | `-i` + `-t` together = \"**give me an interactive shell**\". | `docker run -it alpine sh` |\n| `-e K=V` | `--env` | Set an **environment variable** inside the container. Use many times for many variables. | `-e GREETING=hi -e WHO=Sam` |\n| `--env-file F` | | Load many variables from a file (one `KEY=value` per line). | `--env-file .env` |\n| `-w DIR` | `--workdir` | Folder to start in inside the container. | `-w /app` |\n| `--restart P` | | What to do if the container stops. (More in Phase 9.) | `--restart unless-stopped` |\n\n**Understanding `-p` (port mapping) with a picture:**\n\n```\n   Your browser\n       │  http://localhost:3101\n       ▼\n ┌─ Windows PC ──────────────────────────────┐\n │   port 3101  ──────┐                      │\n │                    │  -p 3101:80          │\n │   ┌─ container ────▼───────────┐          │\n │   │  nginx listening on :80    │          │\n │   └────────────────────────────┘          │\n └───────────────────────────────────────────┘\n```\n\n> Rule to remember: **`-p  HOST : CONTAINER`** — left side is *your PC*, right side is *inside the box*.\n> If a PC port is already in use, choose another number for the left side. This course uses ports from 3100 upwards.\n\n---\n\n### 2.2 `docker ps` — list containers\n\n```powershell\ndocker ps        # only RUNNING containers\ndocker ps -a     # ALL containers, including stopped ones\n```\n\n| Flag | What it does |\n|------|--------------|\n| `-a` / `--all` | Show stopped (exited) containers too |\n| `-q` / `--quiet` | Show only the IDs (useful in scripts) |\n| `--filter name=web` | Show only containers whose name contains \"web\". `name=^web$` = exactly \"web\" |\n| `--filter status=exited` | Show only stopped ones |\n| `--format 'table {{.Names}}\\t{{.Status}}'` | Choose which columns to show |\n| `-s` / `--size` | Show disk size of each container |\n\n**Reading the output:**\n```\nCONTAINER ID   IMAGE               COMMAND                  CREATED   STATUS         PORTS                   NAMES\n240c51335fb3   nginx:1.27-alpine   \"/docker-entrypoint.…\"   5s ago    Up 2 seconds   0.0.0.0:3101->80/tcp    web\n```\n| Column | Meaning |\n|--------|---------|\n| CONTAINER ID | Short unique ID. You can use the first 3–4 characters instead of the name: `docker stop 240c` |\n| STATUS | `Up 2 seconds` = running · `Exited (0)` = stopped OK · `Exited (1)` or `(137)` = stopped with error / killed |\n| PORTS | `0.0.0.0:3101->80/tcp` = PC port 3101 goes to container port 80 |\n\n---\n\n### 2.3 `docker logs` — see what the container printed\n\nEverything the main program writes to the screen (stdout / stderr) is saved by Docker.\n\n```powershell\ndocker logs web\n```\n\n| Flag | What it does |\n|------|--------------|\n| `-f` / `--follow` | Keep watching, show new lines live (like `tail -f`). Stop with **Ctrl + C** (this stops watching, not the container). |\n| `--tail 20` | Show only the last 20 lines |\n| `-t` / `--timestamps` | Add a time to each line |\n| `--since 10m` | Only lines from the last 10 minutes |\n\n---\n\n### 2.4 `docker exec` — run a command inside a running container\n\n```powershell\ndocker exec web ls /usr/share/nginx/html      # run one command, print result\ndocker exec -it web sh                        # open a shell and stay inside\n```\n\n| Flag | What it does |\n|------|--------------|\n| `-it` | Interactive terminal (needed for a shell) |\n| `-e K=V` | Extra env variable just for this command |\n| `-u USER` | Run as a different user, e.g. `-u root` |\n| `-w DIR` | Folder to run the command in |\n\n- `exec` works **only on a running container**.\n- Typing `exit` leaves the shell. **The container keeps running**, because the shell was not its main program.\n- Alpine images have `sh`, not `bash`. Use `sh` if `bash` says \"not found\".\n\n**`run` vs `exec` (common confusion):**\n\n| | `docker run` | `docker exec` |\n|---|---|---|\n| Creates a new container? | ✅ Yes | ❌ No — uses an existing, running one |\n| Input | an **image** name | a **container** name |\n\n---\n\n### 2.5 Stop, start, restart, remove\n\n| Command | What it does |\n|---------|--------------|\n| `docker stop web` | Politely asks the main program to stop (sends **SIGTERM**). Waits 10 seconds, then forces it (SIGKILL). Container → EXITED. |\n| `docker stop -t 3 web` | Same, but wait only 3 seconds |\n| `docker kill web` | Force-stop **immediately** (SIGKILL). Use only if `stop` hangs. |\n| `docker start web` | Start a stopped container again. **Same container, same files.** |\n| `docker start -a web` | Start and *attach* (show its output) |\n| `docker restart web` | stop + start |\n| `docker rm web` | Delete a **stopped** container |\n| `docker rm -f web` | **Force**: stop and delete in one step |\n| `docker container prune` | Delete **all** stopped containers (asks first) ⚠️ |\n\n> Exit code **137** = container was killed (SIGKILL, often out-of-memory or `docker kill`).\n> Exit code **143** = stopped by SIGTERM (normal `docker stop`).\n> Exit code **0** = program finished successfully.\n\n---\n\n### 2.6 Looking inside: `inspect`, `diff`, `top`\n\n| Command | What it shows |\n|---------|---------------|\n| `docker inspect web` | **Everything** Docker knows about the container, as JSON: IP, ports, env vars, mounts, state, image… |\n| `docker inspect web --format '{{.State.Status}}'` | Just one field |\n| `docker diff web` | Files changed inside the container compared to the image. `A` = added, `C` = changed, `D` = deleted |\n| `docker top web` | Processes running inside the container |\n| `docker stats` | Live CPU / memory use of all running containers (Ctrl+C to quit) |\n| `docker port web` | Port mappings only |\n\n---\n\n## 3. Hands-on, step by step\n\n### Example 1 — A web server in one command\n\n```powershell\ndocker run -d --name web -p 3101:80 nginx:1.27-alpine\n```\nFlag by flag:\n- `-d` → background\n- `--name web` → call it \"web\"\n- `-p 3101:80` → PC port 3101 → nginx port 80\n- `nginx:1.27-alpine` → the image: nginx version 1.27, built on small Alpine Linux\n\n**Real output:**\n```\nUnable to find image 'nginx:1.27-alpine' locally       ← not on PC yet\n1.27-alpine: Pulling from library/nginx               ← downloading\nStatus: Downloaded newer image for nginx:1.27-alpine\n240c51335fb3c449a8d4...                                ← the new container's ID\n```\n\nNow open **http://localhost:3101** → \"Welcome to nginx!\" 🎉\n\n**Look at it:**\n```powershell\ndocker ps                     # STATUS: Up …   PORTS: 0.0.0.0:3101->80/tcp\ndocker logs -f web            # refresh the browser and watch a new line appear; Ctrl+C to stop watching\n```\nLog line you'll see:\n```\n172.17.0.1 - - [15/Oct/2026:14:25:28 +0000] \"GET / HTTP/1.1\" 200 615 ...\n```\n`172.17.0.1` is your PC as seen from inside the container. `200` = success.\n\n**Go inside:**\n```powershell\ndocker exec -it web sh\n```\n```sh\ncat /etc/os-release         # → Alpine Linux v3.21  (the container has its own OS files!)\nls /usr/share/nginx/html    # → 50x.html  index.html   (the web pages)\ncat /proc/1/cmdline         # → nginx -g daemon off;   (PID 1 = the main program)\nexit\n```\n\n**Life cycle:**\n```powershell\ndocker stop web     # STATUS → Exited (0)\ndocker start web    # STATUS → Up\ndocker rm -f web    # gone\n```\n\n---\n\n### Example 2 — A throwaway container\n\n```powershell\ndocker run --rm -it alpine:3.20 sh\n```\n- `--rm` → delete automatically when I exit\n- `-it` → interactive shell\n- `alpine:3.20` → a tiny (≈8 MB) Linux\n- `sh` → the command to run (replaces the image's default)\n\nInside:\n```sh\napk add curl                        # apk = Alpine's package manager (like apt / npm)\ncurl -s https://example.com | head -5\nexit\n```\n\nNow run the same image again:\n```powershell\ndocker run --rm alpine:3.20 sh -c \"which curl || echo curl not found\"\n```\n**Real result:** `curl not found` — because it's a **brand-new container** from the **unchanged image**. Your install lived only in the old container, which `--rm` deleted.\n\n> `sh -c \"...\"` means \"start a shell and run this text as a command\". Use it when you need `&&`, `||`, `;`, pipes, or `$VARIABLES` evaluated *inside* the container.\n\n---\n\n### Example 3 — Environment variables and exit codes\n\n```powershell\ndocker run --rm -e GREETING=hi -e WHO=Sam alpine:3.20 sh -c 'echo $GREETING $WHO; exit 3'\necho $LASTEXITCODE\n```\n**Real output:**\n```\nhi Sam\n3\n```\n- `-e` put the variables into the container.\n- The container's exit code (3) is passed back to Windows. CI pipelines use this to know if a step failed.\n\n---\n\n## 4. Exercises (with the real results)\n\n### Exercise 1 & 2 — Two servers, edit one, restart vs recreate\n\n```powershell\ndocker run -d --name web  -p 3101:80 nginx:1.27-alpine\ndocker run -d --name web2 -p 3102:80 nginx:1.27-alpine\ndocker exec web2 sh -c 'echo \"\u003ch1>Edited inside the container\u003c/h1>\" > /usr/share/nginx/html/index.html'\ndocker diff web2\ndocker restart web2           # → page still shows the edit\ndocker rm -f web2\ndocker run -d --name web2 -p 3102:80 nginx:1.27-alpine   # → page is back to \"Welcome to nginx!\"\n```\n\n| Action | Is the edit still there? | Why |\n|--------|-------------------------|-----|\n| `restart` | ✅ Yes | Same container, same writable layer |\n| `rm` + `run` | ❌ No | New container, fresh copy of the image |\n\n`docker diff web2` showed:\n```\nC /usr/share/nginx/html\nC /usr/share/nginx/html/index.html\n```\n\n**Lesson:** never keep important data only inside a container. → **Phase 3 (volumes)** solves this.\n\n`docker ps -s` showed each container's own layer was only **82 kB**, on top of a **52.7 MB** image that both containers *share*.\n\n### Exercise 3 — Inspect\n\n```powershell\ndocker inspect web --format '{{json .NetworkSettings.Ports}}'\ndocker inspect web --format '{{range $n, $c := .NetworkSettings.Networks}}{{$n}}={{$c.IPAddress}}{{end}}'\ndocker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}'\n```\nReal results: IP `bridge=172.17.0.2`, ports `3101→80`, digest `nginx@sha256:65645c7b…`.\n\n> A **digest** (`sha256:…`) is the image's fingerprint. A tag like `1.27-alpine` can be moved to a new image later; a digest never changes.\n\n---\n\n## 5. Common mistakes & Windows gotchas\n\n| Problem | Cause | Fix |\n|---------|-------|-----|\n| `port is already allocated` | Another container/app uses that PC port | Use another left-side port: `-p 3105:80` |\n| `Conflict. The container name \"/web\" is already in use` | Old container with same name exists (maybe stopped) | `docker rm -f web` first |\n| Container exits immediately | Its main program finished (or crashed) | `docker logs \u003cname>` to see why |\n| `exec: \"bash\": not found` | Alpine has no bash | Use `sh` |\n| **Git Bash** turns `/etc/os-release` into `C:/Program Files/Git/etc/os-release` | Git Bash \"helpfully\" converts Linux paths | Run `export MSYS_NO_PATHCONV=1` first (or use PowerShell) |\n| **PowerShell 5.1**: `sh -c 'echo \"$A $B\"; exit 3'` prints only part | PS 5.1 drops inner `\"` when calling programs | Avoid inner double quotes, or use PowerShell 7 (`pwsh`) |\n| `map has no entry for key \"IPAddress\"` | Docker 29 removed the old field | Read IP from `.NetworkSettings.Networks.\u003cname>.IPAddress` |\n\n---\n\n## 6. Check yourself ✅\n\n1. What does `-p 3101:80` mean? Which side is your PC?\n2. You ran `docker run -d nginx` and now can't find it with `docker ps`. Why might that be, and what command shows it?\n3. What is the difference between `docker stop` and `docker rm`?\n4. Why does `exit` from a `docker exec -it web sh` shell not stop the container?\n5. When should you use `--rm`?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. PC port 3101 → container port 80. Left = PC.\n2. It's running but `docker ps` shows it with a random name; or it exited — use `docker ps -a`.\n3. `stop` = turn off (still exists). `rm` = delete.\n4. Because the shell is an extra process. The container's life depends only on its main process (PID 1, nginx).\n5. For one-time/throwaway runs, so stopped containers don't pile up.\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker run -d --name NAME -p HOST:CONT IMAGE   # start in background\ndocker run --rm -it IMAGE sh                   # throwaway shell\ndocker ps / docker ps -a                       # list running / all\ndocker logs -f NAME                            # follow output\ndocker exec -it NAME sh                        # shell into running container\ndocker stop | start | restart NAME\ndocker rm -f NAME                              # stop + delete\ndocker inspect NAME   ·   docker diff NAME   ·   docker top NAME   ·   docker stats\n```"},{"id":"phase-02","kind":"phase","num":2,"title":"Images & the Dockerfile","short":"Images & Dockerfile","oneLine":"Write a recipe (Dockerfile), turn it into an image (docker build), and understand *layers* so your builds are fast.","meta":["Time: ~1.5 hours","Uses $HOME\\docker-learning\\taskboard (Express task board, port 3000 inside the container)"],"time":"~1.5 hours","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## What you will learn\n\n- What an image really is: a **stack of layers**\n- Every common Dockerfile instruction: `FROM`, `WORKDIR`, `COPY`, `RUN`, `ENV`, `ARG`, `EXPOSE`, `USER`, `CMD`, `ENTRYPOINT`, `HEALTHCHECK`\n- `docker build` and its flags\n- The **build cache** — why order of lines matters\n- `.dockerignore`\n- Image commands: `images`, `history`, `tag`, `rmi`, `pull`, `image prune`\n\n---\n\n## 1. The idea: an image is a stack of layers\n\nThink of an image like a **stack of transparent sheets** 📄📄📄. Each sheet adds or changes some files. Look from the top and you see the final filesystem.\n\n```\n  ┌──────────────────────────────┐  ← (container's writable layer — only when running)\n  ├──────────────────────────────┤\n  │ Layer 5: COPY src ./src      │  your code          (changes often)\n  │ Layer 4: RUN npm ci          │  node_modules       (changes sometimes)\n  │ Layer 3: COPY package*.json  │  dependency list    (changes rarely)\n  │ Layer 2: WORKDIR /app        │\n  │ Layer 1: FROM node:22-alpine │  Linux + Node       (almost never)\n  └──────────────────────────────┘\n```\n\nKey facts:\n- **Each instruction in the Dockerfile = one layer** (roughly).\n- Layers are **read-only** and **shared**. 10 images based on `node:22-alpine` store that base only once on disk.\n- Docker **caches** layers. If a line and everything above it didn't change, Docker reuses the old layer → super fast rebuild.\n- **The moment one layer changes, every layer *below it* must be rebuilt.**\n\n\n---\n\n## 2. Dockerfile instructions explained\n\nA Dockerfile is a plain text file named `Dockerfile` (no extension). One instruction per line, written in CAPITALS by convention.\n\n### `FROM` — the starting point\n```dockerfile\nFROM node:22-alpine\n```\n- Every Dockerfile starts with `FROM`. It's the **base image** you build on top of.\n- Choose small, official, **pinned** bases.\n\n| Base tag | Size (approx.) | When to use |\n|----------|---------------|-------------|\n| `node:22` | ~1.6 GB | Full Debian. Has every tool. Big. |\n| `node:22-slim` | ~330 MB | Debian, minimal. Good default if alpine causes problems. |\n| `node:22-alpine` | ~240 MB | Alpine Linux, very small. Uses *musl* instead of *glibc* — a few native libraries may break. |\n\n> Sizes are what `docker images` shows on Docker Desktop (Docker 29). Docker Hub lists smaller numbers because it shows the **compressed download** size. Compare sizes on the same machine and the ratios stay the same.\n\n> ❌ `FROM node` (= `node:latest`, changes without warning)  ✅ `FROM node:22-alpine`\n\n### `WORKDIR` — \"cd\" into a folder\n```dockerfile\nWORKDIR /app\n```\n- Sets the current folder for all following instructions **and** for the running container.\n- Creates the folder if it doesn't exist. Use this instead of `RUN cd /app` (which doesn't persist between lines).\n\n### `COPY` — copy files from your PC into the image\n```dockerfile\nCOPY package.json package-lock.json ./\nCOPY src ./src\nCOPY . .\n```\n- `COPY \u003cfrom-your-project> \u003cto-inside-image>`\n- Paths on the left are relative to the **build context** (the folder you pass to `docker build`, usually `.`).\n- Destination `./` means \"the current WORKDIR\".\n- Useful flags: `--chown=node:node` (set the file owner), `--from=build` (copy from another stage — Phase 7).\n\n> `ADD` is like `COPY` but can also download URLs and unpack `.tar` files. Prefer `COPY` — it is simpler and predictable.\n\n### `RUN` — run a command *while building*\n```dockerfile\nRUN npm ci --omit=dev && npm cache clean --force\n```\n- Runs at **build time**. The result (new/changed files) is saved as a new layer.\n- Join related commands with `&&` so they are one layer, and clean up in the **same** line (deleting in a later line does not shrink the earlier layer).\n\n### `ENV` — environment variable (build time **and** run time)\n```dockerfile\nENV NODE_ENV=production\n```\n- Available to later `RUN` lines *and* inside the running container.\n- Can be overridden at run time with `docker run -e NODE_ENV=development`.\n\n### `ARG` — variable for **build time only**\n```dockerfile\nARG NODE_VERSION=22\nFROM node:${NODE_VERSION}-alpine\n```\n- Set it with `docker build --build-arg NODE_VERSION=20 .`\n- Not present in the running container. **Never put passwords in ARG** — they can be seen with `docker history`.\n\n| | `ARG` | `ENV` |\n|---|---|---|\n| Exists during build | ✅ | ✅ |\n| Exists in running container | ❌ | ✅ |\n| Set from CLI | `--build-arg` | `docker run -e` |\n\n### `EXPOSE` — documentation of the port\n```dockerfile\nEXPOSE 3000\n```\n- Only a **note** saying \"this app listens on 3000\". It does **not** open or publish anything.\n- You still need `-p 3100:3000` when running.\n\n### `USER` — who runs the app\n```dockerfile\nUSER node\n```\n- By default containers run as **root**. If someone hacks your app, they become root inside the container.\n- Official Node images include a ready-made user called `node`. Switch to it near the end (after installs that need root).\n\n### `CMD` — the default command when the container starts\n```dockerfile\nCMD [\"node\", \"src/server.js\"]      # ✅ exec form (JSON array)\nCMD node src/server.js             # ⚠️ shell form\n```\n- Only the **last** `CMD` counts.\n- Can be replaced at run time: `docker run myimage node other.js`.\n\n**Exec form vs shell form — why it matters:**\n\n| | Exec form `[\"node\",\"app.js\"]` | Shell form `node app.js` |\n|---|---|---|\n| What runs as PID 1 | `node` | `/bin/sh -c \"node app.js\"` → `sh` is PID 1 |\n| Receives `docker stop` signal (SIGTERM) | ✅ node gets it, can shut down nicely | ❌ sh does not pass it on → the app is force-killed (exit code 137), no clean shutdown |\n| `$VARIABLES` expanded | ❌ no shell | ✅ yes |\n\n\n### `ENTRYPOINT` — the fixed command\n```dockerfile\nENTRYPOINT [\"ping\", \"-c\", \"3\"]\nCMD [\"localhost\"]\n```\n- `ENTRYPOINT` = the part that is **always** run.\n- `CMD` = **default arguments** you can replace.\n- `docker run pinger` → `ping -c 3 localhost`\n- `docker run pinger docker.com` → `ping -c 3 docker.com` (CMD replaced, ENTRYPOINT kept)\n- To replace the entrypoint itself: `docker run --entrypoint sh -it pinger`\n\n### `HEALTHCHECK` — \"is the app actually OK?\"\n```dockerfile\nHEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\\n  CMD wget -qO- http://127.0.0.1:3000/api/health || exit 1\n```\n| Option | Meaning |\n|--------|---------|\n| `--interval=30s` | Check every 30 seconds |\n| `--timeout=3s` | A check taking longer than 3 s = failed |\n| `--start-period=5s` | Give the app 5 s to boot before failures count |\n| `--retries=3` | 3 failures in a row → status becomes `unhealthy` |\n- The command must exit `0` (healthy) or `1` (unhealthy). `docker ps` then shows `(healthy)` / `(unhealthy)`.\n- ⚠️ On Alpine use **`127.0.0.1`**, not `localhost` (localhost goes to IPv6 `::1` first; app listens on IPv4 → \"connection refused\"). This is a very common trap.\n\n### `LABEL` — metadata\n```dockerfile\nLABEL org.opencontainers.image.authors=\"you@example.com\"\n```\n\n---\n\n## 3. `.dockerignore` — keep the build context clean\n\nWhen you run `docker build .`, Docker sends **the whole folder** (the **build context**) to the engine first. `.dockerignore` lists what to leave out — like `.gitignore`.\n\n```gitignore\nnode_modules\nnpm-debug.log*\n.env\n.git\nDockerfile*\ndocker-compose*.yml\n*.md\n```\n\nWhy:\n- **Speed** — `node_modules` can be 100s of MB.\n- **Correctness** — your Windows `node_modules` must not overwrite the Linux one built inside the image.\n- **Security** — `.env` with passwords never goes into the image.\n\n---\n\n## 4. Commands explained\n\n### 4.1 `docker build` — make an image from a Dockerfile\n\n```\ndocker build [FLAGS] CONTEXT\n```\n\n| Flag | What it does | Example |\n|------|--------------|---------|\n| `-t name:tag` | **Tag** (name) the image. You can give several `-t`. | `-t taskboard:1.0` |\n| `-f path` | Use a Dockerfile with another name/location | `-f docker-steps/step1.Dockerfile` |\n| `CONTEXT` (last arg) | Folder whose files `COPY` can see. Usually `.` | `.` |\n| `--build-arg K=V` | Set an `ARG` | `--build-arg NODE_VERSION=20` |\n| `--no-cache` | Ignore the cache, build every layer fresh | |\n| `--target stage` | Build only up to a named stage (Phase 7) | `--target dev` |\n| `--progress=plain` | Show full output of every step (good for debugging) | |\n| `--platform` | Build for another CPU type | `--platform linux/arm64` |\n\nReading the build output:\n```\n => [2/5] WORKDIR /app                          0.0s\n => CACHED [3/5] COPY package*.json ./          0.0s   ← reused from cache\n => CACHED [4/5] RUN npm ci --omit=dev          0.0s   ← reused, saved ~20 s!\n => [5/5] COPY src ./src                        0.1s   ← rebuilt (code changed)\n```\n\n### 4.2 Image management commands\n\n| Command | What it does |\n|---------|--------------|\n| `docker images` (or `docker image ls`) | List images on your PC: name, tag, ID, size |\n| `docker images taskboard` | Only images named \"taskboard\" |\n| `docker history taskboard:step4` | Show every layer and its size — find what makes the image big |\n| `docker image inspect taskboard:step4` | Full JSON details (env, cmd, layers, user…) |\n| `docker tag taskboard:step4 taskboard:1.0` | Add another name to the **same** image (no copy, instant) |\n| `docker pull nginx:1.27-alpine` | Download an image without running it |\n| `docker rmi taskboard:step1` | Remove an image tag (fails if a container uses it; `-f` to force) |\n| `docker image prune` | Remove **dangling** images (`\u003cnone>:\u003cnone>` left behind by rebuilds) |\n| `docker image prune -a` | Remove **all** images not used by any container ⚠️ |\n\n---\n\n## 5. Hands-on, step by step\n\nAll commands in `$HOME\\docker-learning\\taskboard`:\n```powershell\ncd $HOME\\docker-learning\\taskboard\n```\n\n### Step 1 — The naive Dockerfile (`docker-steps/step1.Dockerfile`)\n```dockerfile\nFROM node:22\nWORKDIR /app\nCOPY . .\nRUN npm install\nEXPOSE 3000\nCMD node src/server.js\n```\n```powershell\ndocker build -f docker-steps/step1.Dockerfile -t taskboard:step1 .\ndocker run -d --name tb1 -p 3100:3000 taskboard:step1\n# open http://localhost:3100\n```\nProblems: huge base (~1.6 GB), copies everything, any code change re-runs `npm install`, runs as root, shell-form CMD.\n\n**See the problems yourself (real results):**\n```powershell\ndocker exec tb1 whoami                            # → root\ndocker inspect tb1 --format '{{json .Config.Cmd}}' # → [\"/bin/sh\",\"-c\",\"node src/server.js\"]\ndocker stop tb1\ndocker inspect tb1 --format '{{.State.ExitCode}}'  # → 137  (force-killed)\ndocker logs --tail 2 tb1                          # no \"shutting down\" line: node never got the signal\n```\nThe app has a graceful-shutdown handler, but with the shell form `sh` is PID 1 and never passes `SIGTERM` on to node, so the handler never runs.\n\n### Step 2 — Add `.dockerignore`\nSame Dockerfile, but now `.dockerignore` exists. Watch the line `transferring context:` in the build output — it gets much smaller.\n\n### Step 3 — Order for caching (`step3.Dockerfile`)\n```dockerfile\nFROM node:22\nWORKDIR /app\nCOPY package.json package-lock.json ./     # rarely changes\nRUN npm ci --omit=dev                      # cached until package*.json changes\nCOPY src ./src                             # changes often\nCOPY public ./public\nEXPOSE 3000\nCMD node src/server.js\n```\n- `npm ci` = clean install **exactly** from `package-lock.json` (reproducible). Better than `npm install` for images.\n- `--omit=dev` = skip devDependencies (test tools etc.).\n\n**Prove the cache works:**\n```powershell\ndocker build -f docker-steps/step3.Dockerfile -t taskboard:step3 .\n# edit any line in src/server.js (e.g. a comment), then:\ndocker build -f docker-steps/step3.Dockerfile -t taskboard:step3 .\n# → \"[4/6] RUN npm ci --omit=dev  CACHED\" — only COPY src and the steps after it rerun\n```\nNow edit `package.json` (e.g. the description) and rebuild → `npm ci` runs again. **Why?** Its input layer changed, so it and everything below it rebuild.\n\nReal timings for this app: rebuild after a code change **3 s**, after a `package.json` change **8 s**. With many dependencies the difference becomes minutes.\n\n### Step 4 — Production hardening (`step4.Dockerfile` = the real `Dockerfile`)\n```dockerfile\nFROM node:22-alpine\nENV NODE_ENV=production\nWORKDIR /app\nCOPY package.json package-lock.json ./\nRUN npm ci --omit=dev && npm cache clean --force\nCOPY src ./src\nCOPY public ./public\nUSER node\nEXPOSE 3000\nHEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \\\n  CMD wget -qO- http://127.0.0.1:3000/api/health || exit 1\nCMD [\"node\", \"src/server.js\"]\n```\n```powershell\ndocker build -f docker-steps/step4.Dockerfile -t taskboard:step4 .\ndocker images taskboard             # compare: step1 ≈ 1.65 GB vs step4 ≈ 250 MB\ndocker history taskboard:step4      # see each layer's size\ndocker run -d --name tb4 -p 3101:3000 taskboard:step4\ndocker ps                           # after ~5 s STATUS shows \"(healthy)\"\ndocker exec tb4 whoami              # → node   (not root ✅)\ndocker stop tb4\ndocker inspect tb4 --format '{{.State.ExitCode}}'   # → 0  (clean exit)\ndocker logs --tail 1 tb4            # → SIGTERM received, shutting down...\n```\n\n**Real results:** 247 MB instead of 1.65 GB (6.7× smaller), healthy after a few seconds, runs as `node`, and `docker stop` finished in 0.5 s with exit code 0 because node is PID 1 and receives the signal.\n\n### Step 5 — CMD vs ENTRYPOINT experiment\nCreate `$HOME\\docker-learning\\phase2-entrypoint\\Dockerfile`:\n```dockerfile\nFROM alpine:3.20\nENTRYPOINT [\"ping\", \"-c\", \"3\"]\nCMD [\"localhost\"]\n```\n```powershell\ndocker build -t pinger $HOME\\docker-learning\\phase2-entrypoint\ndocker run --rm pinger                 # ping -c 3 localhost\ndocker run --rm pinger 1.1.1.1         # ping -c 3 1.1.1.1\ndocker run --rm --entrypoint echo pinger hello   # replaces ENTRYPOINT → prints \"hello\"\n```\nLook closely at the first line of output: `PING localhost (::1)`. Alpine turns `localhost` into the **IPv6** address `::1` first. That is exactly why the `HEALTHCHECK` above uses `127.0.0.1`.\n\n### Clean up\n```powershell\ndocker rm -f tb1 tb4\ndocker rmi taskboard:step1 pinger\ndocker image prune\n```\n\n---\n\n## 6. Common mistakes\n\n| Mistake | What goes wrong | Fix |\n|---------|----------------|-----|\n| `COPY . .` before `npm install` | Every code change reinstalls all packages | Copy `package*.json` → install → then copy code |\n| No `.dockerignore` | Slow builds, Windows `node_modules` overwrites Linux one, secrets in image | Add `.dockerignore` |\n| `RUN cd /app` | `cd` is forgotten on the next line | Use `WORKDIR` |\n| Cleaning up in a separate `RUN` | Image doesn't get smaller (old layer still holds files) | Clean up in the **same** `RUN` with `&&` |\n| `FROM node:latest` | Build breaks one day when \"latest\" changes | Pin: `node:22-alpine` |\n| Password in `ARG`/`ENV` | Visible in `docker history` / `inspect` | Use build secrets (Phase 7) or runtime env |\n| Shell-form `CMD` | `docker stop` takes 10 s, no graceful shutdown | Exec form `[\"node\",\"...\"]` |\n| Thinking `EXPOSE` publishes a port | App not reachable | Use `-p` at run time |\n\n---\n\n## 7. Exercise\n\nWrite a Dockerfile **from scratch** (don't copy!) for a tiny Python Flask app.\n\n`$HOME\\docker-learning\\phase2-flask\\app.py`\n```python\nfrom flask import Flask\napp = Flask(__name__)\n\n@app.get(\"/\")\ndef hello():\n    return \"Hello from Flask in Docker!\"\n\nif __name__ == \"__main__\":\n    app.run(host=\"0.0.0.0\", port=5000)\n```\n`requirements.txt`\n```\nflask==3.1.0\n```\n\nYour Dockerfile must:\n1. Use a pinned slim base (`python:3.13-slim`)\n2. Install requirements **before** copying `app.py` (cache!)\n3. Use `pip install --no-cache-dir -r requirements.txt`\n4. Run as a non-root user (hint: `RUN useradd -m app` then `USER app`)\n5. Use exec-form `CMD`\n6. Have a `.dockerignore`\n\nRun it with `-p 3120:5000` and open http://localhost:3120.\n\n> Why `host=\"0.0.0.0\"`? Inside a container, `127.0.0.1` means \"only this container\". `0.0.0.0` means \"accept connections from outside the container too\" — needed for `-p` to work.\n\n---\n\n## 8. Check yourself ✅\n\n1. You changed one line in `src/server.js`. Which layers rebuild in step4?\n2. What's the difference between `RUN` and `CMD`?\n3. Does `EXPOSE 3000` let you open the app in a browser?\n4. Why use `npm ci` instead of `npm install` in a Dockerfile?\n5. Why should the app listen on `0.0.0.0` inside a container?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. Only `COPY src ./src` and the layers after it. The `npm ci` layer is cached.\n2. `RUN` runs during **build** and saves files into a layer. `CMD` runs when a **container starts**.\n3. No. It's documentation. You need `-p`.\n4. `npm ci` installs exactly what's in the lock file — reproducible and faster.\n5. `127.0.0.1` inside a container accepts only connections from inside that same container; `-p` traffic comes from outside it.\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker build -t NAME:TAG .                       # build from ./Dockerfile\ndocker build -f other.Dockerfile -t NAME:TAG .   # build from another file\ndocker images                                     # list images\ndocker history NAME:TAG                           # layers and sizes\ndocker tag OLD:TAG NEW:TAG                        # add a name\ndocker rmi NAME:TAG                               # remove image\ndocker image prune                                # remove dangling images\n```"},{"id":"phase-03","kind":"phase","num":3,"title":"Keeping Data: Volumes & Bind Mounts","short":"Volumes & bind mounts","oneLine":"Containers are temporary — their files die with them. Volumes and bind mounts store data outside the container so it survives.","meta":["Time: ~1 hour","Work folder: $HOME\\docker-learning\\phase3"],"time":"~1 hour","md":"\n## What you will learn\n\n- Why container data disappears\n- The 3 types of storage: **named volume**, **bind mount**, **tmpfs**\n- The `-v` and `--mount` flags (every part explained)\n- `docker volume` commands\n- How to back up and restore a volume\n\n---\n\n## 1. The idea: containers forget\n\nFrom Phase 1 you saw: edit a file inside a container → `docker rm` → new container → **edit is gone**.\n\nThat's fine for a web server's default page. It is a **disaster** for a database. 😱\n\nThe fix: put the important folder **outside** the container and \"plug it in\".\n\n### Analogy: a USB drive 💾\n\n- The container is a **laptop you rent**. When you return it, everything on it is wiped.\n- A **volume** is your **USB drive**. Plug it into any rented laptop, your files are there. Return the laptop, keep the drive.\n\n```\n  Without volume                      With volume\n ┌─ container ─────────┐            ┌─ container ─────────┐\n │ /var/lib/postgresql │            │ /var/lib/postgresql ├──┐\n │   (your data)       │            └─────────────────────┘  │ plugged in\n └─────────────────────┘                                     ▼\n   docker rm → data GONE ❌          ┌─ volume \"pgdata\" ───────┐\n                                     │  (your data, safe) ✅   │\n                                     └─────────────────────────┘\n                                       docker rm → volume stays\n```\n\n---\n\n## 2. The 3 storage types\n\n| Type | Where data lives | Who manages it | Best for |\n|------|------------------|----------------|----------|\n| **Named volume** | Inside Docker's own storage area (in the Docker Desktop VM) | Docker | **Databases**, any app data in production |\n| **Bind mount** | A folder **on your PC** that you choose, e.g. `$HOME\\docker-learning\\site` | You | **Development**: edit code on Windows, container sees it instantly; config files |\n| **tmpfs** | In memory (RAM) only | Docker | Temporary, secret or fast scratch files. Gone when container stops. |\n\n**Simple rule:**\n- Data the **app owns** (database, uploads) → **named volume**\n- Files **you edit** (source code, config) → **bind mount**\n\n> On Windows, named volumes are also **much faster** than bind mounts, because bind mounts must cross from Windows into the Linux VM.\n\n---\n\n## 3. The flags explained\n\n### 3.1 `-v` (short form)\n\n```\n-v  SOURCE : TARGET_IN_CONTAINER [:OPTIONS]\n```\n\n| You write | Docker understands |\n|-----------|-------------------|\n| `-v pgdata:/var/lib/postgresql/data` | SOURCE is a **name** → **named volume** \"pgdata\" (created automatically if missing) |\n| `-v ${PWD}\\site:/usr/share/nginx/html` | SOURCE is a **path** → **bind mount** of that PC folder |\n| `-v $HOME\\docker-learning\\site:/usr/share/nginx/html:ro` | `:ro` = **read-only**. Container can read but not change it |\n| `-v /data` | No source → **anonymous volume** (random name — hard to find later; avoid) |\n\n- `${PWD}` in PowerShell = the current folder. (In Git Bash use `$(pwd)`.)\n- The TARGET is always a **Linux path** inside the container.\n- If the target folder already has files in the image:\n  - **Named volume (empty)** → Docker copies the image's files into the volume first.\n  - **Bind mount** → your PC folder **hides** the image's files completely.\n\n### 3.2 `--mount` (long form — clearer, recommended in scripts)\n\n```powershell\n--mount type=volume,source=pgdata,target=/var/lib/postgresql/data\n--mount type=bind,source=$HOME\\docker-learning\\site,target=/usr/share/nginx/html,readonly\n--mount type=tmpfs,target=/tmp,tmpfs-size=64m\n```\n\n| Key | Meaning |\n|-----|---------|\n| `type=` | `volume`, `bind` or `tmpfs` |\n| `source=` / `src=` | volume name or PC path |\n| `target=` / `dst=` | path inside the container |\n| `readonly` | read-only |\n\nDifference: with `-v`, a missing bind-mount folder is **created** silently (often wrong!). With `--mount`, a missing folder gives an **error** — safer.\n\n---\n\n## 4. `docker volume` commands\n\n| Command | What it does |\n|---------|--------------|\n| `docker volume create pgdata` | Create a named volume |\n| `docker volume ls` | List all volumes |\n| `docker volume inspect pgdata` | Details: where it lives, when created |\n| `docker volume rm pgdata` | Delete it (fails if a container — even a stopped one — uses it) |\n| `docker volume prune` | Delete all **anonymous** unused volumes |\n| `docker volume prune -a` | Delete **all** unused volumes, named ones too ⚠️ **data loss** |\n| `docker rm -v CONTAINER` | Remove the container **and** its anonymous volumes |\n\n> `docker rm` alone **never** deletes a named volume. That's the point — your data is safe.\n\n---\n\n## 5. Hands-on, step by step\n\n```powershell\nmkdir $HOME\\docker-learning\\phase3; cd $HOME\\docker-learning\\phase3\n```\n\n### Example 1 — Database WITHOUT a volume (watch the data die)\n\n```powershell\ndocker run -d --name pg1 -e POSTGRES_PASSWORD=dev -p 5433:5432 postgres:17-alpine\n```\nFlag by flag:\n- `-e POSTGRES_PASSWORD=dev` → the postgres image **requires** a password variable to start\n- `-p 5433:5432` → PC port 5433 → postgres port 5432 (5433 avoids clashing with any local Postgres)\n- `postgres:17-alpine` → PostgreSQL 17, small Alpine build\n\nWait a few seconds for it to start. To check that it's ready:\n```powershell\ndocker exec pg1 pg_isready -U postgres     # → /var/run/postgresql:5432 - accepting connections\n```\nThen:\n```powershell\ndocker exec -it pg1 psql -U postgres -c \"CREATE TABLE t(x int); INSERT INTO t VALUES (42);\"\ndocker exec -it pg1 psql -U postgres -c \"SELECT * FROM t;\"      # → 42\n```\n- `psql` = the Postgres command-line client (already inside the image)\n- `-U postgres` = log in as user \"postgres\"\n- `-c \"...\"` = run this SQL and exit\n\nNow delete and recreate:\n```powershell\ndocker rm -f pg1\ndocker run -d --name pg1 -e POSTGRES_PASSWORD=dev -p 5433:5432 postgres:17-alpine\ndocker exec -it pg1 psql -U postgres -c \"SELECT * FROM t;\"\n# ERROR: relation \"t\" does not exist   ❌ data gone\n```\n\n**A surprise: the data wasn't really \"in the container\".** Look at the mounts of this container:\n```powershell\ndocker inspect pg1 --format '{{range .Mounts}}{{.Type}} {{.Name}} -> {{.Destination}}{{end}}'\n# volume 473e34c15150… -> /var/lib/postgresql/data\n```\nThe postgres image declares `VOLUME /var/lib/postgresql/data` in its Dockerfile. So Docker **automatically** made an **anonymous volume** (a volume with a random name) for each container. When you ran a new container, it got a **new, empty** anonymous volume. The old one is still on disk, orphaned, with your table inside, and nobody will ever find it by name.\n\n```powershell\ndocker volume ls -f dangling=true     # orphaned volumes: not used by any container\n```\n\nClean up **with `-v`**, which also removes the container's anonymous volumes:\n```powershell\ndocker rm -f -v pg1\n```\n> Lesson: an anonymous volume does not protect your data, it only hides it. Always give database data a **named** volume (Example 2).\n\n### Example 2 — Database WITH a named volume (data survives)\n\n```powershell\ndocker volume create pgdata\ndocker run -d --name pg1 -e POSTGRES_PASSWORD=dev -p 5433:5432 `\n  -v pgdata:/var/lib/postgresql/data postgres:17-alpine\n```\n- `` ` `` (backtick) at the line end = \"command continues on next line\" in PowerShell\n- `-v pgdata:/var/lib/postgresql/data` → plug volume \"pgdata\" in where Postgres stores its files\n\n```powershell\ndocker exec -it pg1 psql -U postgres -c \"CREATE TABLE t(x int); INSERT INTO t VALUES (42);\"\ndocker rm -f pg1                                  # destroy the container\ndocker run -d --name pg1 -e POSTGRES_PASSWORD=dev -p 5433:5432 `\n  -v pgdata:/var/lib/postgresql/data postgres:17-alpine\ndocker exec -it pg1 psql -U postgres -c \"SELECT * FROM t;\"\n#  x\n# ----\n#  42     ✅ survived!\n```\n\nLook at the volume:\n```powershell\ndocker volume ls\ndocker volume inspect pgdata      # \"Mountpoint\": \"/var/lib/docker/volumes/pgdata/_data\"  (inside the Docker VM)\n```\n\n> 💡 How do you know which folder to mount? Read the image's page on Docker Hub (\"Where to store data\"), or run `docker image inspect postgres:17-alpine --format '{{json .Config.Volumes}}'`.\n\n### Example 3 — Bind mount: live-edit a website from Windows\n\n```powershell\nmkdir site\nSet-Content site\\index.html \"\u003ch1>Hello from my Windows folder\u003c/h1>\"\ndocker run -d --name site -p 3103:80 `\n  -v ${PWD}\\site:/usr/share/nginx/html:ro nginx:1.27-alpine\n```\n- `${PWD}\\site` → the `site` folder on your PC\n- `/usr/share/nginx/html` → where nginx looks for web pages\n- `:ro` → nginx can read, not write (safer)\n\nOpen http://localhost:3103. Now edit `site\\index.html` in VS Code / Notepad, save, refresh the browser → **change appears instantly**, no rebuild, no restart. ✨\n\nTry writing from inside:\n```powershell\ndocker exec site sh -c \"echo hack > /usr/share/nginx/html/x.html\"\n# → Read-only file system   (because of :ro) ✅\n```\n\n### Example 4 — tmpfs (memory-only)\n\n```powershell\ndocker run --rm --mount type=tmpfs,target=/scratch,tmpfs-size=16m alpine:3.20 `\n  sh -c \"echo temp > /scratch/a.txt; df -h /scratch\"\n# Filesystem  Size  Used ... Mounted on\n# tmpfs       16.0M 4.0K ... /scratch\n```\n\n### Example 5 — Back up a volume\n\nThere's no `docker volume backup` command. The trick: run a **helper container** that mounts *both* the volume and a PC folder, then `tar` from one to the other.\n\n```powershell\ndocker run --rm `\n  -v pgdata:/data:ro `\n  -v ${PWD}:/backup `\n  alpine:3.20 tar czf /backup/pgdata.tgz -C /data .\n```\n- `-v pgdata:/data:ro` → the volume, read-only, at `/data`\n- `-v ${PWD}:/backup` → current PC folder at `/backup`\n- `tar czf /backup/pgdata.tgz -C /data .` → **c**reate a g**z**ipped archive **f**ile of everything in `/data`\n- `--rm` → helper container deletes itself\n\nResult: `$HOME\\docker-learning\\phase3\\pgdata.tgz` on your PC.\n\n> ⚠️ Copying the files of a **running** database can catch it in the middle of a write. For a live database a real dump is safer. Write the dump **inside** the container, then copy it out:\n> ```powershell\n> docker exec pg1 pg_dump -U postgres -f /tmp/backup.sql\n> docker cp pg1:/tmp/backup.sql .\\backup.sql\n> ```\n> Avoid `docker exec pg1 pg_dump -U postgres > backup.sql` in Windows PowerShell 5.1: `>` saves the file as UTF-16, and `psql` cannot read it back.\n\n### Clean up\n```powershell\ndocker rm -f pg1 site\ndocker volume rm pgdata\n```\n\n**Real results from a test run:** without a volume the table was gone (and two orphaned anonymous volumes were left behind); with `pgdata` the value 42 survived `docker rm -f`; the bind-mounted page changed the moment the file was saved; `:ro` blocked writes with `Read-only file system`; the tar backup was 4.4 MB and restored into a new volume with the row intact.\n\n---\n\n## 6. Common mistakes\n\n| Mistake | Result | Fix |\n|---------|--------|-----|\n| Forgetting `-v` on a database | All data lost on `docker rm` | Always mount a named volume for DB data folders |\n| Typo in the target path (`/var/lib/postgres/data`) | Your named volume stays empty; the real data goes into an anonymous volume and is lost track of | Check the exact path with `docker image inspect IMAGE --format '{{json .Config.Volumes}}'` |\n| `docker rm -f` on containers whose image has a `VOLUME` | Orphaned anonymous volumes pile up and use disk | Use `docker rm -f -v`, and check `docker volume ls -f dangling=true` |\n| `-v site:/usr/...` (no `./` or full path) | Docker creates a **named volume** called \"site\" instead of mounting your folder | Use a full path: `${PWD}\\site` |\n| Bind-mounting over a folder that has image files (e.g. over `/app` with node_modules) | Your PC folder hides `node_modules` → app crashes | Mount only `src`, or add a volume for `/app/node_modules` |\n| `docker volume prune -a` \"to clean up\" | Deletes your databases | Read before you prune |\n| Expecting file-watchers (`node --watch`, nodemon) to see Windows edits through a bind mount | Often **no reload** on Docker Desktop for Windows | Use Compose `develop.watch` (Phase 6) |\n\n---\n\n## 7. Exercise\n\n1. **Restore** `pgdata.tgz` into a **new** volume `pgdata2`:\n   - `docker volume create pgdata2`\n   - Run an alpine helper with `-v pgdata2:/data` and `-v ${PWD}:/backup`, and `tar xzf /backup/pgdata.tgz -C /data`\n   - Start Postgres on `pgdata2` and check `SELECT * FROM t;` shows 42.\n2. Run two nginx containers (ports 3103 and 3104) that **share the same bind-mounted** `site` folder. Edit the file once — do both change?\n3. Find the size of your volumes: `docker system df -v`.\n\n---\n\n## 8. Check yourself ✅\n\n1. Which storage type would you use for: (a) MySQL data, (b) your React source while developing, (c) a temporary secret?\n2. Does `docker rm -f pg1` delete the `pgdata` volume?\n3. What does `:ro` do?\n4. Why is `-v site:/x` different from `-v ${PWD}\\site:/x`?\n\n\u003cdetails>\u003csummary>Answers\u003c/summary>\n\n1. (a) named volume, (b) bind mount, (c) tmpfs.\n2. No. Named volumes are only removed with `docker volume rm` (or prune).\n3. Mounts it read-only inside the container.\n4. `site` alone is treated as a volume **name**; a path is treated as a **bind mount**.\n\u003c/details>\n\n---\n\n## Command summary\n\n```powershell\ndocker volume create NAME        ·  docker volume ls  ·  docker volume inspect NAME  ·  docker volume rm NAME\ndocker run -v VOLUME:/path IMAGE                 # named volume\ndocker run -v ${PWD}\\folder:/path:ro IMAGE       # bind mount, read-only\ndocker run --mount type=tmpfs,target=/tmp IMAGE  # memory only\ndocker run --rm -v VOL:/data -v ${PWD}:/backup alpine tar czf /backup/x.tgz -C /data .   # backup\n```"},{"id":"phase-04","kind":"phase","num":4,"title":"Networking: How Containers Talk","short":"Networking","oneLine":"Put containers on the same network and they can find each other by name — like phones in the same office calling by extension.","meta":["Time: ~1 hour","Work folder: $HOME\\docker-learning\\phase4"],"time":"~1 hour","md":"> This phase uses the **sample task board app**. If you have not set it up yet, follow the [Sample app](sample-app.md) page first.\n\n\n## What you will learn\n\n- What \"localhost\" means inside a container (it's **not** your PC!)\n- Network types: `bridge` (default), **user-defined bridge**, `hos
